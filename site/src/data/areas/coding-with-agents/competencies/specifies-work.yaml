id: coding-with-agents/specifies-work
area: coding-with-agents
statement: >-
  Spécifie le travail assez bien pour qu’un agent l’implémente et que n’importe qui le vérifie
topics: [coding-with-agents/specification, using-agents/decomposition]
objectives:
  - id: coding-with-agents/specifies-work/judges-worth-building
    statement: Juge si une chose doit être construite avant de la construire
    level: base
    behaviors:
      - claim: L’apprenant énonce le problème et qui l’a avant de proposer une modification.
        why: >-
          Un agent rend la construction peu coûteuse, donc construire la mauvaise chose devient tout aussi
          peu coûteux.
        example: >-
          « Le support répond dix fois par semaine à la même question » vient avant « construire une page
          de réglages », et la réponse peut être une correction de la documentation.
      - claim: >-
          L’apprenant nomme au moins une autre option que construire, y compris ne rien faire, et dit
          pourquoi construire l’emporte.
        why: C’est la comparaison qui transforme un souhait en décision.
        example: >-
          « Nous pourrions ajouter la fonctionnalité, changer le réglage par défaut ou documenter le
          contournement ; le contournement coûte cinq minutes par semaine à chaque utilisateur, donc nous
          changeons le réglage par défaut. »
      - claim: >-
          L’apprenant met en balance le coût de possession de la modification et sa valeur, et le coût
          d’écriture en est la plus petite partie.
        why: L’agent l’écrit en une heure, et l’équipe l’entretient pendant des années.
        example: >-
          Une nouvelle dépendance pour un seul format de date est refusée, parce qu’elle ajoute un paquet
          à maintenir à jour, et une fonction de dix lignes est écrite à la place.
  - id: coding-with-agents/specifies-work/defines-success
    statement: Définit ce qu’exige un résultat réussi
    level: base
    behaviors:
      - claim: >-
          La réussite est écrite sous forme de résultats observables qu’une autre personne que l’auteur
          pourrait vérifier.
        why: >-
          Un critère que l’auteur doit interpréter est un critère que l’agent et le relecteur interprètent
          différemment.
        example: >-
          « Les résultats de recherche arrivent en moins de 300 ms au 95e centile sur le jeu de données
          de
          test » au lieu de « la recherche est rapide ».
      - claim: Les critères incluent ce qui doit continuer de fonctionner en plus de ce qui est
          nouveau.
        why: Un agent qui optimise le nouveau critère sacrifie tout ce qui n’est pas listé.
        example: >-
          « Tous les exports existants s’ouvrent toujours dans le tableur de l’équipe finance » est
          ajouté, parce que le nouveau format CSV pourrait les casser.
      - claim: L’apprenant écrit ce qui est hors du périmètre.
        why: >-
          L’agent remplit l’écart entre « terminé » et « tout ce qu’il pourrait améliorer » avec ses
          propres choix.
        example: >-
          « Hors périmètre : mise en page mobile, traductions » empêche l’agent de restyler toute la page.
  - id: coding-with-agents/specifies-work/decomposes-into-components
    statement: Décompose un problème en composants aux dépendances claires
    level: base
    behaviors:
      - claim: >-
          Chaque composant a une seule responsabilité claire et une interface qui tient en une phrase.
        why: >-
          Des composants qu’une personne sait décrire sont des composants qu’un agent peut implémenter
          isolément et qu’un relecteur peut vérifier isolément.
        example: >-
          « Un analyseur qui transforme le fichier en enregistrements ; un validateur qui signale les
          mauvais enregistrements ; un rédacteur qui enregistre les bons », au lieu d’une seule tâche
          « import ».
      - claim: >-
          L’apprenant dessine les dépendances et ordonne le travail pour que chaque étape puisse être
          vérifiée avant que la suivante commence.
        why: Un composant construit sur un composant non vérifié hérite de ses erreurs et les cache.
        example: >-
          L’analyseur est construit et testé sur de vrais fichiers avant le validateur, parce que les
          tests du validateur ont besoin de vrais enregistrements analysés.
      - claim: >-
          Chaque composant est assez petit pour tenir dans une session d’agent et une modification
          relisible.
        why: >-
          Une tâche trop grande pour une session perd son contexte à mi-chemin, et son diff est trop grand
          pour être lu.
        example: >-
          L’apprenant découpe « ajouter l’authentification » en émission de jetons, vérification de jetons
          et page de connexion, et rédige une consigne pour chacune.
  - id: coding-with-agents/specifies-work/designs-the-check
    statement: Conçoit la vérification du travail avant de le construire
    level: base
    behaviors:
      - claim: >-
          Avant de construire, l’apprenant écrit comment chaque critère de réussite sera vérifié : quel
          test, quelle mesure, quelle étape manuelle.
        why: >-
          Un contrôle conçu après coup est conçu autour de ce qui a été construit, et il passe par
          construction.
        example: >-
          Pour « aucune facture en double », le contrôle est un test qui importe deux fois le même fichier
          et vérifie qu’il n’y a qu’un seul jeu de lignes, écrit avant le code d’import.
      - claim: >-
          Le contrôle est une chose que l’agent peut exécuter, pour qu’il vérifie son propre travail avant
          de rendre la main.
        why: >-
          Un contrôle que seule une personne peut lancer est lancé une fois, à la fin, et un contrôle
          que
          l’agent peut lancer est lancé à chaque tentative.
        example: >-
          Le test d’acceptation va dans la suite de tests, et la consigne dit « terminé quand `mise run
          test` passe ».
      - claim: L’apprenant conçoit au moins un contrôle qui échouerait si l’agent prenait un
          raccourci.
        why: >-
          Les agents optimisent pour le contrôle qu’ils voient, et un contrôle qui passe sur une coquille
          vide (stub) passe sur une coquille vide.
        example: >-
          Le test de l’envoi d’e-mails utilise une fausse boîte aux lettres et vérifie que le message
          est
          arrivé, là où un contrôle sur la valeur de retour de la fonction d’envoi passerait sur une
          coquille vide.
  - id: coding-with-agents/specifies-work/is-interviewed-before-planning
    statement: >-
      Arrive à une conception partagée en se faisant interroger par l’agent avant la planification
    level: base
    behaviors:
      - claim: >-
          Pour une fonctionnalité importante, l’apprenant demande à l’agent de l’interroger sur la
          conception avant d’écrire un plan.
        why: >-
          Les questions font apparaître des décisions que l’apprenant n’avait pas encore prises, à un
          moment où les changer ne coûte encore rien (@Claude Code best practices).
        example: >-
          L’apprenant écrit « Je veux un export CSV. Interroge-moi à ce sujet avant de planifier quoi
          que
          ce soit », et reçoit des questions sur les encodages et les très gros fichiers auxquelles il
          n’avait pas pensé.
      - claim: L’apprenant répond par des décisions, et dit « pas encore décidé » quand il n’y en a
          pas.
        why: Une réponse inventée pour avancer devient une exigence que l’agent construit.
        example: >-
          À la question du fuseau horaire de l’export, l’apprenant répond que ce n’est pas décidé, et
          la
          spécification le liste comme question ouverte.
      - claim: >-
          L’entretien se termine par une spécification écrite, et le travail part de ce fichier dans une
          nouvelle session.
        why: >-
          Le fichier contient le résultat de l’entretien, et une nouvelle session a de la place pour le
          travail (@Claude Code best practices).
        example: >-
          L’agent écrit `SPEC.md`, l’apprenant le lit et le corrige, puis ouvre une nouvelle session avec
          « implémente `SPEC.md` ».
  - id: coding-with-agents/specifies-work/settles-with-a-prototype
    statement: Tranche une question de conception avec un prototype jetable
    level: expert
    behaviors:
      - claim: >-
          L’apprenant énonce la question unique à laquelle un prototype doit répondre avant de le
          demander.
        why: >-
          Un prototype sans question grandit jusqu’à devenir une première version du système (@Thomas
          2019).
        example: >-
          « La bibliothèque peut-elle lire l’export de 2 Go en moins d’une minute ? », et l’agent écrit
          un
          court script qui chronomètre exactement cela.
      - claim: Le prototype laisse de côté tout ce dont la question n’a pas besoin.
        why: >-
          Sa valeur est la réponse, donc des tests, une gestion d’erreurs et une structure sont des
          efforts dépensés sur du code qui sera supprimé.
        example: >-
          Le script de chronométrage a un chemin codé en dur et aucun test, et l’apprenant ne demande
          ni
          l’un ni l’autre.
      - claim: L’apprenant écrit la réponse dans la spécification et supprime le prototype.
        why: Du code construit sans structure apporte ses raccourcis dans le système quand on le
          garde.
        example: >-
          La spécification gagne la phrase « l’analyseur doit lire en flux, parce que la bibliothèque
          charge tout le fichier en mémoire », et la branche du prototype est supprimée.
