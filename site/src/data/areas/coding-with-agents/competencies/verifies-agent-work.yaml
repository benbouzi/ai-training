id: coding-with-agents/verifies-agent-work
area: coding-with-agents
statement: Vérifie le code écrit par un agent avant de lui faire confiance
topics: [coding-with-agents/verification, coding-with-agents/quality, safety/agent-risk]
objectives:
  - id: coding-with-agents/verifies-agent-work/reviews-others-code
    statement: Relit du code qu’il n’a pas écrit, au regard de la spécification
    level: base
    behaviors:
      - claim: >-
          La revue part de la spécification et se demande si la modification fait ce qui était demandé,
          avant de regarder comment elle le fait.
        why: >-
          Un code bien écrit qui résout le mauvais problème est l’échec d’agent le plus courant, et le
          plus difficile à voir ligne par ligne.
        example: >-
          L’apprenant lit la consigne, puis les tests, puis le diff, et découvre que l’agent a rendu le
          filtre sensible à la casse alors que la consigne disait le contraire.
      - claim: >-
          L’apprenant lit chaque fichier modifié et interroge les modifications que la consigne ne
          demandait pas.
        why: >-
          Le diff d’un agent contient souvent des « améliorations » qui sont la partie la plus risquée
          de
          la modification.
        example: >-
          Une pull request « corriger la nouvelle tentative » reformate aussi deux fichiers sans rapport
          et change un délai d’expiration, donc l’apprenant demande de les retirer ou de les séparer.
      - claim: L’apprenant exécute le code en plus de le lire.
        why: >-
          La lecture détecte les problèmes de conception, et l’exécution détecte les comportements que
          les
          tests ont manqués.
        example: >-
          L’apprenant récupère la branche et essaie les deux cas limites mentionnés dans la consigne avant
          d’approuver.
  - id: coding-with-agents/verifies-agent-work/observes-and-debugs
    statement: Observe le système en marche et isole un défaut de façon méthodique
    level: base
    behaviors:
      - claim: L’apprenant reproduit le défaut avant de modifier quoi que ce soit, et note les
          étapes.
        why: >-
          Une correction d’un défaut qu’on ne sait pas reproduire ne peut pas être vérifiée, et l’agent
          risque de corriger autre chose.
        example: >-
          L’apprenant transforme un signalement « échoue parfois » en « échoue quand le fichier a une
          ligne d’en-tête et aucune donnée » avant de donner la consigne à l’agent.
      - claim: L’apprenant lit les journaux et les traces du système en marche en plus du code.
        why: Le code dit ce qui devrait se passer, et le système dit ce qui s’est passé.
        example: >-
          La trace d’appels montre que la requête n’a jamais atteint le gestionnaire, donc l’apprenant
          regarde le routage avant le gestionnaire que l’agent s’apprêtait à réécrire.
      - claim: >-
          L’apprenant réduit le défaut par moitiés : une modification, une observation, et une note de
          ce
          qui a été écarté.
        why: >-
          Changer plusieurs choses à la fois en espérant est la façon dont une séance de débogage dure
          des
          heures.
        example: >-
          L’apprenant désactive le cache, voit que le bug persiste, et écarte le cache avant de laisser
          l’agent toucher à quoi que ce soit.
  - id: coding-with-agents/verifies-agent-work/automates-the-check
    statement: Transforme un contrôle en boucle d’autovérification bornée
    level: base
    behaviors:
      - claim: >-
          L’apprenant transforme un contrôle manuel en commande que l’agent peut lancer et dont il peut
          lire le résultat.
        why: >-
          Un contrôle que l’agent peut lancer est lancé à chaque itération, et un contrôle que seul
          l’apprenant peut lancer est lancé une fois (@Claude Code best practices).
        example: >-
          « Ouvrir la page et voir que le tableau a des lignes » devient un test qui affiche la page et
          vérifie le nombre de lignes.
      - claim: >-
          La boucle a une limite : un nombre de tentatives ou une durée, après quoi l’agent s’arrête et
          fait son rapport.
        why: >-
          Un agent à qui l’on dit « continue jusqu’à ce que les tests passent » peut tourner indéfiniment
          ou supprimer le test.
        example: >-
          La consigne dit « lance les tests ; s’ils échouent, corrige et relance, au plus cinq fois, puis
          arrête-toi et montre-moi ce que tu as trouvé ».
      - claim: L’apprenant protège le contrôle contre l’agent qui s’y confronte.
        why: Le chemin le plus court vers un contrôle au vert consiste souvent à modifier le
          contrôle.
        example: >-
          La consigne dit que le fichier de tests est en lecture seule, et la revue confirme que les
          assertions n’ont pas changé.
  - id: coding-with-agents/verifies-agent-work/prefers-gates-to-opinions
    statement: >-
      Choisit une barrière déterministe de préférence à la revue d’un modèle pour bloquer un travail
    level: base
    behaviors:
      - claim: >-
          L’apprenant ne laisse bloquer une fusion ou terminer la boucle d’un agent qu’aux contrôles dont
          le résultat ne demande aucun jugement, comme les tests, la vérification des types, les builds
          et
          les contrôles de schéma.
        why: >-
          Une barrière fiable donne le même résultat pour la même entrée, donc un échec a le même sens
          à
          chaque exécution.
        example: >-
          L’équipe rend la suite de tests et la vérification des types obligatoires sur chaque pull
          request, et marque les commentaires du relecteur IA comme consultatifs.
      - claim: >-
          L’apprenant traite la revue d’un second modèle comme un avis qu’une personne pèse, à côté des
          barrières et jamais à leur place.
        why: >-
          Le verdict d’un modèle est un jugement. Il peut manquer ce que le modèle qui a écrit a manqué,
          et il peut changer d’une exécution à l’autre.
        example: >-
          Un relecteur IA approuve une modification dont la vérification des types échoue, et l’apprenant
          bloque la fusion jusqu’à ce que la vérification des types passe.
      - claim: >-
          L’apprenant lit comme une affirmation le rapport d’un agent selon lequel les contrôles passent,
          et regarde le résultat de la barrière elle-même.
        why: >-
          Le rapport est ce que l’agent dit de la barrière, et seule la sortie de la barrière montre ce
          qui a tourné.
        example: >-
          L’agent dit que tous les tests passent, donc l’apprenant ouvre l’exécution de la CI et découvre
          que la tâche de tests a été sautée.
  - id: coding-with-agents/verifies-agent-work/screens-for-security
    statement: >-
      Contrôle ce que produit un agent pour les problèmes de sécurité et de chaîne d’approvisionnement
    level: base
    behaviors:
      - claim: >-
          L’apprenant vérifie chaque nouvelle dépendance ajoutée par l’agent : existe-t-elle, est-ce le
          paquet voulu, est-elle maintenue, est-elle nécessaire.
        why: >-
          Les agents proposent des paquets de mémoire, et un nom qui n’existe pas, ou un paquet sosie
          publié sous un nom mal orthographié, finit installé.
        example: >-
          Le diff ajoute un paquet dont le nom diffère légèrement de celui du paquet connu, donc
          l’apprenant consulte le registre et le retire.
      - claim: >-
          L’apprenant regarde comment la modification traite les entrées, les secrets et les permissions,
          comme un relecteur le ferait pour n’importe quel code.
        why: >-
          Le code écrit par un agent a les mêmes classes de vulnérabilités que le code humain, produites
          plus vite et avec plus d’assurance.
        example: >-
          L’apprenant repère la requête générée par formatage de chaîne et demande une requête paramétrée.
      - claim: >-
          L’apprenant vérifie qu’aucun secret ni identifiant n’a fini dans le code, les tests ou la
          transcription.
        why: >-
          Un agent qui a lu un fichier `.env` pour résoudre un problème peut coller son contenu dans des
          données de test (fixture).
        example: >-
          Les données de test de la pull request contiennent une clé d’API qui a l’air réelle, donc
          l’apprenant la fait tourner et ajoute le fichier au détecteur de secrets.
  - id: coding-with-agents/verifies-agent-work/uses-a-fresh-review
    statement: Fait relire une modification dans une nouvelle session et pèse les remarques
    level: base
    behaviors:
      - claim: >-
          L’apprenant confie la revue à une session qui n’a pas écrit la modification, avec le diff, la
          spécification et les critères à vérifier.
        why: >-
          Une nouvelle session juge le résultat sans le raisonnement qui l’a produit, donc elle ne défend
          pas les choix faits (@Claude Code best practices).
        example: >-
          L’apprenant fait relire le diff par un sous-agent au regard de `PLAN.md`, et lui fait vérifier
          que chaque cas limite listé a un test.
      - claim: >-
          L’apprenant dit au relecteur de ne signaler que ce qui touche la justesse ou les exigences
          énoncées.
        why: >-
          Un relecteur à qui l’on demande des manques en signale même dans un travail solide, et les
          traiter tous ajoute du code dont personne n’a besoin.
        example: >-
          Le prompt de revue se termine par « signale les manques au regard de la spécification, sans
          préférences de style », et la revue revient avec deux remarques au lieu de quinze.
      - claim: >-
          L’apprenant décide pour chaque remarque de la corriger, de la rejeter ou d’en faire un ticket,
          et les barrières décident toujours de la fusion.
        why: >-
          Une remarque de revue est le jugement d’un modèle, et seule une barrière déterministe peut
          bloquer seule une modification.
        example: >-
          L’apprenant corrige le contrôle de valeur nulle manquant, rejette une abstraction supplémentaire
          proposée, et attend la CI avant de fusionner.
