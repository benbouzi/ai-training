id: coding-with-agents/works-in-team
area: coding-with-agents
statement: Travaille avec des agents au sein d’une équipe
topics: [coding-with-agents/team, coding-with-agents/workflow]
objectives:
  - id: coding-with-agents/works-in-team/attributes-honestly
    statement: Attribue honnêtement le travail des agents dans les commits et les revues
    level: base
    behaviors:
      - claim: >-
          Les commits et les pull requests disent qu’un agent a écrit la modification, sous la forme
          convenue par l’équipe.
        why: >-
          Les relecteurs lisent différemment une modification écrite par un agent et une modification
          écrite par une personne, et ils ont besoin de savoir laquelle ils ont sous les yeux.
        example: >-
          La ligne de fin du commit nomme l’agent et le modèle, selon la convention du dépôt, sur chaque
          commit écrit par un agent.
      - claim: >-
          L’apprenant assume la responsabilité de la modification en tant qu’auteur, et l’attribution
          ne
          reporte pas la faute sur l’outil.
        why: La personne qui a soumis la modification en répond, et l’outil n’en répond pas.
        example: >-
          En revue, l’apprenant écrit « j’ai demandé cela à l’agent et je l’ai vérifié » au lieu de
          « l’agent a fait cela ».
      - claim: >-
          L’apprenant respecte la forme d’attribution que demande le projet, y compris ce qu’elle
          interdit.
        why: >-
          Certains projets demandent un certificat d’origine que seule une personne peut signer, et la
          signature d’un agent n’est pas valable.
        example: >-
          L’apprenant ajoute la ligne de fin « assisted-by » et omet `Signed-off-by`, parce que le projet
          dit que seules les personnes certifient.
  - id: coding-with-agents/works-in-team/follows-team-norms
    statement: Suit les règles de revue et de CI de l’équipe pour les modifications d’agents
    level: base
    behaviors:
      - claim: >-
          Les modifications écrites par un agent passent par les mêmes barrières de revue et de CI que
          toute autre modification, et l’apprenant ne les contourne pas parce que « l’agent a testé ».
        why: >-
          Les barrières existent pour les modifications de n’importe qui, et les tests d’un agent font
          partie de la modification relue.
        example: >-
          L’apprenant attend la CI et l’approbation d’un relecteur sur la pull request de l’agent au lieu
          de la fusionner lui-même.
      - claim: >-
          L’apprenant dimensionne et étiquette les modifications d’agents pour que les relecteurs puissent
          les lire.
        why: Un relecteur qui reçoit un diff d’agent de 3 000 lignes le saute ou le bloque.
        example: >-
          L’apprenant découpe la modification générée en trois pull requests et les marque comme faites
          avec un agent dans le titre, comme l’équipe l’a demandé.
      - claim: >-
          L’apprenant lit et suit le fichier d’instructions pour agents de l’équipe avant de commencer,
          et
          propose des modifications à ce fichier au lieu de le contourner.
        why: >-
          Le fichier est l’accord commun de l’équipe, et une session qui l’ignore fait des modifications
          que l’équipe rejette.
        example: >-
          Les instructions disent « aucune nouvelle dépendance sans ticket », donc l’apprenant ouvre
          d’abord le ticket.
  - id: coding-with-agents/works-in-team/keeps-the-backlog-reachable
    statement: Garde les spécifications et les tickets là où l’équipe et l’agent peuvent les
      atteindre
    level: base
    behaviors:
      - claim: >-
          Les spécifications et les tickets vont dans l’outil de suivi de l’équipe, et l’apprenant n’en
          garde aucun seulement dans une note privée ou une conversation.
        why: >-
          Un travail qui n’existe que dans les notes d’une personne est invisible pour le reste de
          l’équipe et pour chaque session d’agent.
        example: >-
          L’apprenant transforme le plan d’une conversation en trois tickets, chacun avec un lien vers
          la
          spécification, avant qu’un agent commence à travailler dessus.
      - claim: >-
          L’apprenant indique quel ticket en bloque un autre avec les liens propres à l’outil de suivi.
        why: >-
          L’outil de suivi marque alors les tickets bloqués, donc une personne ou un agent qui prend du
          travail peut les sauter (@GitHub docs creating-issue-dependencies).
        example: >-
          Le ticket de la page de connexion est marqué comme bloqué par le ticket des jetons, et l’agent
          à
          qui l’on demande le prochain ticket ouvert prend celui des jetons.
      - claim: >-
          L’agent accède à l’outil de suivi par un outil en ligne de commande, avec des identifiants qui
          ne permettent que ce dont il a besoin.
        why: >-
          Un outil en ligne de commande coûte peu de contexte, et des identifiants restreints limitent
          ce
          qu’une mauvaise commande peut faire (@Claude Code best practices).
        example: >-
          Le jeton de l’agent peut lire les tickets et ajouter des commentaires, et il ne peut ni
          supprimer de tickets ni changer les réglages du projet.
  - id: coding-with-agents/works-in-team/turns-findings-into-rules
    statement: >-
      Transforme les remarques de revue récurrentes en normes écrites ou en contrôles automatiques
    level: base
    behaviors:
      - claim: >-
          Quand la même remarque de revue revient, l’apprenant l’ajoute au fichier de normes de l’équipe.
        why: >-
          Une règle écrite une fois est lue par chaque relecteur et chaque agent, et une remarque répétée
          dans des commentaires s’oublie (@Claude Code memory).
        example: >-
          Après le troisième commentaire sur la journalisation de données personnelles, l’apprenant ajoute
          la règle au fichier de normes avec un exemple de ce qu’il faut journaliser à la place.
      - claim: >-
          Une règle qu’un outil d’analyse ou un hook peut vérifier sort du fichier et passe dans le
          contrôle.
        why: >-
          Une règle écrite est un conseil que l’agent peut manquer, et un contrôle s’exécute sur chaque
          modification (@Claude Code best practices).
        example: >-
          La règle « pas d’instructions print dans le code des bibliothèques » devient une règle de
          l’outil d’analyse, et la ligne du fichier de normes est supprimée.
      - claim: >-
          Les relecteurs ne bloquent une modification que pour une règle du fichier ou un contrôle en
          échec, et marquent les autres points comme des suggestions.
        why: >-
          Une revue qui bloque sur une préférence personnelle rend la norme floue et donne moins de poids
          aux règles du fichier (@Google eng-practices).
        example: >-
          Un relecteur écrit « Détail : je nommerais cela autrement » et approuve, parce que le nommage
          n’est pas couvert par le fichier.
  - id: coding-with-agents/works-in-team/runs-parallel-work
    statement: Fait tourner plusieurs sessions d’agents sans perdre la cohérence
    level: expert
    behaviors:
      - claim: >-
          Chaque session parallèle travaille dans sa propre copie extraite ou son propre worktree, sur
          sa
          propre branche, avec une tâche qui ne recoupe pas les autres.
        why: >-
          Deux agents qui modifient les mêmes fichiers produisent des conflits qui coûtent plus que ce
          que
          le parallélisme a fait gagner.
        example: >-
          L’apprenant confie à un agent la modification de l’API et à un autre la documentation, dans
          deux
          worktrees, et fusionne d’abord l’API.
      - claim: >-
          L’apprenant tient une liste écrite de ce que fait chaque session et de l’état où elle se trouve.
        why: >-
          Une personne ne peut suivre de près qu’une session à la fois, et une session oubliée est une
          session qui a mal fini.
        example: >-
          Une courte note par session : branche, tâche, prochain point d’étape, et si elle attend
          l’apprenant.
      - claim: L’apprenant intègre souvent et dans un ordre fixe, et rebase les autres branches.
        why: >-
          Les branches parallèles divergent, et plus elles vivent longtemps, plus elles sont difficiles
          à
          fusionner.
        example: >-
          Chaque après-midi, l’apprenant fusionne les branches terminées dans main et fait rebaser les
          sessions restantes avant qu’elles continuent.
      - claim: >-
          Les ressources partagées (ports, bases de données, la remise (stash), identifiants) sont soit
          propres à chaque session, soit laissées tranquilles.
        why: Des sessions qui partagent un port ou une remise se gênent sans aucun conflit visible.
        example: >-
          L’apprenant dit à chaque agent de ne pas démarrer le serveur de développement, parce que le
          port
          est partagé, et de lancer le build à la place.
  - id: coding-with-agents/works-in-team/sets-team-practice
    statement: Fixe la pratique d’équipe pour l’usage des agents
    level: expert
    behaviors:
      - claim: >-
          L’apprenant écrit la pratique de l’équipe là où l’équipe et les agents la lisent : ce que les
          agents peuvent faire, comment le travail est attribué, comment il est relu.
        why: >-
          Une pratique non écrite est une pratique différente pour chaque personne, et les agents n’en
          suivent aucune.
        example: >-
          Le fichier `AGENTS.md` du dépôt dit quelle est la barrière de CI, à quoi ressemble une ligne
          de
          fin de commit, et quels dossiers les agents ne doivent pas toucher.
      - claim: >-
          La pratique part des erreurs que l’équipe a vues, et elle change quand les erreurs changent.
        why: Une pratique écrite de façon imaginaire protège contre les mauvaises choses.
        example: >-
          Après deux incidents où des agents ont committé des fichiers de verrouillage générés, l’équipe
          ajoute un hook et une ligne dans les instructions, et retire une règle qui ne s’est jamais
          déclenchée.
      - claim: L’apprenant rend la pratique vérifiable par des outils quand c’est possible.
        why: >-
          Une règle imposée par un hook est suivie à chaque fois, et une règle écrite dans un document
          est
          suivie par ceux qui l’ont lue.
        example: >-
          Un hook de style vérifie le format du message de commit, et la CI vérifie la ligne de fin
          d’attribution.
