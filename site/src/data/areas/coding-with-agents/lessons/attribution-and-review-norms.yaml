id: coding-with-agents/attribution-and-review-norms
title: Dire ce qu’a fait l’agent, dans le commit et dans la revue
description: >-
  Préparez la modification d’un agent pour la revue, dites dans la pull request ce qu’a fait
  l’agent et ce que vous avez vérifié, et attribuez-la par une ligne de fin de commit, sans la
  signature que l’agent ne peut pas donner.
mode: explanation
covers: coding-with-agents/team
serves:
  - coding-with-agents/works-in-team/attributes-honestly
  - coding-with-agents/works-in-team/follows-team-norms
introduces: [review-norms, attribution]
assumes:
  - objective: safety/handles-data-safely/discloses-ai-use
    lesson: safety/saying-ai-helped
    section: les-trois-parties-dune-ligne-de-mention
  - objective: coding-with-agents/verifies-agent-work/reviews-others-code
    lesson: coding-with-agents/reviewing-the-diff
    section: every-changed-file
after:
  - coding-with-agents/reversible-changes
  - coding-with-agents/reviewing-the-diff
  - coding-with-agents/security-review
shorts: [les lignes de fin de commit et le certificat d’origine]
exercise:
  kind: judge
  brief: >-
    Réécrivez un message de commit et une description de pull request de l’exemple pour qu’ils
    portent la ligne de fin de l’agent et disent ce qui a été vérifié, sans signature, parce que
    seule une personne peut en donner une.
sources:
  - DLAI-5
  - Git docs git-interpret-trailers
  - Git docs git-commit
  - GitHub docs creating-a-commit-with-multiple-authors
  - Linux coding assistants
  - Claude Code all settings
  - DCO
issue: 183
minutes: 10
sources-checked: 2026-09-25
review-by: 2027-03-25
notes: >-
  Explanation mode because the material is agreements, and the judge exercise keeps it concrete.
  This repository's own practice is the worked example, and the DCO and trailer claims come from
  their public sources. The assumed objective is served by responsible-use too; saying-ai-helped is
  named because its three-part disclosure line is what the pull request section builds on. Sources:
  DLAI-5 as inspiration.
