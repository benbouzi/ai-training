id: coding-with-agents/ci-and-hooks
title: Faire appliquer les règles de l’équipe par des hooks et la CI
description: >-
  Faites appliquer deux règles d’équipe sans que personne ait à s’en souvenir : un hook Claude
  Code qui bloque les modifications de l’agent sur le test et les données de l’import nocturne, et
  une tâche de CI figée qui exécute les barrières déterministes sur chaque pull request, l’agent
  corrigeant la tâche en échec à partir de son journal, dans une limite fixée.
mode: tutorial
covers: coding-with-agents/team
serves:
  - coding-with-agents/works-in-team/follows-team-norms
  - coding-with-agents/works-in-team/sets-team-practice
introduces: [ci-integration, team-hooks]
assumes:
  - objective: safety/judges-agent-risk/chooses-human-in-loop
    lesson: safety/agent-risk
    section: lhumain-dans-la-boucle
  - objective: coding-with-agents/verifies-agent-work/automates-the-check
    lesson: coding-with-agents/self-checking-loops
    section: donner-la-consigne-de-la-boucle-avec-une-limite
  - objective: coding-with-agents/verifies-agent-work/prefers-gates-to-opinions
    lesson: coding-with-agents/self-checking-loops
    section: les-barrières-et-les-seconds-avis
extends-to:
  - label: How to use Claude Code hooks to enforce the right CLI (AI Hero, en anglais)
    href: https://www.aihero.dev/how-to-use-claude-code-hooks-to-enforce-the-right-cli
  - label: >-
      Scale Codex Across Teams and Systems : faire tourner Codex sans personne, avec une sortie qui
      suit un schéma (OpenAI Academy, compte gratuit)
    href: https://academy.openai.com/public/courses/scale-codex-across-teams-and-systems-jr83a
after: [coding-with-agents/self-checking-loops]
shorts:
  - >-
    une passe de revue par un agent dans la CI avec un volet sécurité, des évaluations dans la CI
    (renvoi vers building-agents/evaluation)
exercise:
  kind: do
  brief: >-
    Ajoutez à l’exemple un hook qui bloque la modification d’un chemin protégé et une tâche de CI
    qui exécute les barrières déterministes, puis faites buter l’agent sur les deux et faites-lui
    corriger l’échec de CI dans une limite fixée.
sources:
  - Academy ai-native-sdlc-playbook
  - Claude Code best practices
  - Claude Code hooks
  - Claude Code worktrees
  - Git docs git-tag
  - GitHub docs workflow-syntax
  - GitHub docs events-that-trigger-workflows
issue: 186
minutes: 15
sources-checked: 2026-09-25
review-by: 2027-03-25
notes: >-
  Takes the material the #65 Academy pass left for this topic: hooks as approval gates, a CI review
  pass with ranked findings, review findings fed back into the project instructions on the second
  occurrence, and a cold second opinion from a fresh session. The Academy course is cited for the
  first two only at the level of its public lesson titles, and the rest is paraphrased from Claude
  Code best practices (hooks against advisory instructions, `claude -p` in CI, a fresh session as
  reviewer, turning an instruction into a hook). Claude Code hooks gives the PreToolUse input, exit
  status 2 as the block, exit status 1 as a non-blocking error, the tool-name matcher and the `ask`
  decision, all checked on 2026-09-25. GitHub docs gives the `.github/workflows` location, step
  status from the exit code, the commit SHA as the safest pin and minimum `permissions`, and the
  default `pull_request` activity types. The concept team-hooks is named "Team hooks" so its
  glossary entry stays distinct from the hooks concept of customizing-agents/hooks-permissions.
  The assumes entry on automates-the-check is added because the page opens from the
  self-checking-loops fixture and bound, and the one on prefers-gates-to-opinions (issue #408)
  because "Run the gates in CI" starts from the deterministic gates taught there. The fixtures under
  site/examples/coding-with-agents/ci-and-hooks/ load self-checking-loops/_common.py with importlib
  for the copy and the fix, add the hook, its settings and checks.yml, feed the hook five tool
  calls (two in a worktree under .claude/worktrees/, per Claude Code worktrees), and run the `run` lines
  of checks.yml before and after the fix. They run no git. Evals in
  CI point at building-agents/rubrics, the live lesson that covers building-agents/evaluation.
