id: coding-with-agents/deciding-what-to-build
title: Décider s’il faut construire, avant tout
description: >-
  Un agent rend la construction peu coûteuse, donc le jugement se déplace avant le code. Trouvez
  le problème derrière une demande, chiffrez la modification par ce que l’équipe devra entretenir
  ensuite, et écrivez des critères de réussite qu’un inconnu pourrait vérifier.
mode: explanation
covers: coding-with-agents/specification
serves:
  - coding-with-agents/specifies-work/judges-worth-building
  - coding-with-agents/specifies-work/defines-success
introduces: [what-is-worth-building, success-criteria]
assumes:
  - objective: using-agents/delegates-and-checks/writes-a-brief
    lesson: using-agents/delegating
    section: écrire-la-consigne
extends-to:
  - label: Décider et spécifier
    href: /topics/coding-with-agents/specification/
  - label: >-
      Scope AI Solutions : comparer des opportunités métier et cadrer un pilote (OpenAI Academy,
      compte gratuit)
    href: https://academy.openai.com/public/courses/scope-ai-solutions-kjplw
after: [coding-with-agents/first-session]
shorts: [le coût de conservation d’une modification]
exercise:
  kind: judge
  brief: >-
    Prenez trois demandes de fonctionnalités sur l’exemple, et rejetez ou réduisez-en au moins une.
    Pour les autres, écrivez des critères de réussite vérifiables avec une ligne « hors périmètre ».
sources: [Academy ai-fluency-for-builders, Brilliant TAS]
sources-checked: 2026-09-26
review-by: 2027-03-26
minutes: 15
notes: >-
  Explanation mode because nothing runs. The feature requests are against the first-session to-do
  fixture, and the undo scenario reuses its off-by-one bug in `done`. Sources: Brilliant TAS, Academy
  ai-fluency-for-builders (paraphrased ideas only). The fictional package named in the pitfall is on neither
  PyPI nor npm.
