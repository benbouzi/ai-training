  - objective: coding-with-agents/specifies-work/defines-success
    lesson: coding-with-agents/deciding-what-to-build
    section: écrire-ce-quexige-la-réussite
extends-to:
  - label: Tracer bullets (AI Hero, en anglais)
    href: https://www.aihero.dev/tracer-bullets
  - label: >-
      Scale Codex Across Teams and Systems : répartir le travail entre équipes, avec un contrôle pour
      chaque partie (OpenAI Academy, compte gratuit)
    href: https://academy.openai.com/public/courses/scale-codex-across-teams-and-systems-jr83a
after: [coding-with-agents/deciding-what-to-build]
