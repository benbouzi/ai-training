id: coding-with-agents/decomposing-the-work
title: Découper le travail en composants que l’agent construit un par un
description: >-
  Découpez une fonctionnalité en composants qui ont chacun une responsabilité et une interface
  d’une phrase, ordonnez-les selon leurs dépendances, et écrivez le test d’acceptation du premier
  avant qu’il existe, pour qu’il échoue sur une coquille vide.
mode: tutorial
covers: coding-with-agents/specification
