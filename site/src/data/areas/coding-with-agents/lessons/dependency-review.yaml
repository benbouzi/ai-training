id: coding-with-agents/dependency-review
title: Relire ce que l’agent a ajouté comme dépendances
description: >-
  Un agent de code ajoute des paquets vite et avec assurance. Relisez chacun en proportion de son
  risque, avec les contrôles d’OpenSSF Scorecard comme étape de sécurité et une liste écrite de ce
  que vous sautez.
mode: explanation
covers: coding-with-agents/quality
serves: [coding-with-agents/verifies-agent-work/screens-for-security]
introduces: [dependency-hygiene, supply-chain-risk]
assumes:
  - objective: coding-with-agents/ships-with-agent/runs-a-session
    lesson: coding-with-agents/first-session
    section: relire-le-diff
  - objective: safety/judges-agent-risk/names-blast-radius
    lesson: safety/agent-risk
    section: le-rayon-dimpact
extends-to:
  - label: Vérifier le travail d’un agent
    href: /coding-with-agents/verification/
after: []
shorts:
  - lire le diff d’un fichier de verrouillage, un âge minimal de publication
exercise:
  kind: judge
  brief: >-
    Classez les entrées du diff d’un fichier de verrouillage et écrivez le verdict pour chaque
    dépendance.
sources:
  - Fuchsia review
  - OpenSSF Scorecard
  - Academy ai-native-sdlc-playbook
  - sbp-dependency-audit
  - npm package-lock
  - Cargo build scripts
  - pnpm settings
  - pnpm supply chain
  - Claude Code best practices
  - Claude Code memory
  - Claude Code skills
sources-checked: 2026-09-26
review-by: 2027-03-26
minutes: 20
notes: >-
  From issue #16 (closed). Sits after tests-and-docs because the topic's prerequisites are
  verification and safety/agent-risk. Its `assumes` place it in the graph.
