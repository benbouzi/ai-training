id: coding-with-agents/keys-and-secrets
title: Garder les clés d’API hors de portée de l’agent
description: >-
  Sortez la clé d’API d’un agent de code de son fichier de réglages pour la mettre dans un
  gestionnaire de mots de passe, transmettez-la par une variable d’environnement ou un assistant
  de clé (key helper), interdisez à l’agent la lecture des secrets qui restent, et analysez
  l’exemple et la transcription pour trouver ce qu’une main a oublié.
mode: tutorial
covers: coding-with-agents/first-session
serves: [coding-with-agents/ships-with-agent/runs-a-session]
introduces: [secrets-hygiene]
assumes:
  - objective: safety/handles-data-safely/decides-what-to-share
    lesson: safety/responsible-use
    section: ce-qui-peut-y-entrer--quatre-niveaux
sources-checked: 2026-09-23
review-by: 2027-03-23
after: [coding-with-agents/first-session]
shorts: [révoquer une clé sur simple soupçon]
exercise:
  kind: do
  brief: >-
    Déplacez la clé de l’agent de l’exemple de son fichier de réglages vers un assistant de clé qui
    tient lieu de gestionnaire de mots de passe, ajoutez les règles d’interdiction, puis passez le
    détecteur de secrets sur l’exemple et la transcription, et décidez quoi faire de chaque ligne.
sources:
  - Claude Code settings
  - Claude Code authentication
  - Claude Code permissions
  - Claude Code permission modes
  - Claude docs authentication
  - Gitleaks
minutes: 10
notes: >-
  Closes the "API key hygiene" gap from issue #13: personal key, never committed, in a password
  manager or environment variable, revoke on suspicion. Placed second because the learner needs a
  key on day one. The agent-side settings hygiene from the #18 brief (lock the settings file, key
  helper instead of a stored key) is taught here, and the sandboxing lesson below takes the
  isolation part. The fixture agent (agent.py) is a stand-in that finds a key and enforces nothing,
  so the lesson runs without a real agent, a real key or a password manager. Setting names and
  behavior come from code.claude.com (settings, authentication, permissions) and
  platform.claude.com (manage-claude/authentication) and must be re-checked by
  review-by. The gitleaks README (2026-09) says the tool is feature complete and takes security
  patches only, so the review-by pass re-checks whether it is still the scanner to name.
