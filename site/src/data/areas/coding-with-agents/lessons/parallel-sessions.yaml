id: coding-with-agents/parallel-sessions
title: Faire tourner plusieurs sessions d’agents dans des worktrees
description: >-
  Faites tourner deux sessions d’agents à la fois sur un même projet, chacune dans son propre
  worktree git et sa propre branche, avec une tâche qui modifie d’autres fichiers. Tenez une note
  d’une ligne par session et intégrez dans un ordre fixe : fusionnez la branche de l’API, faites
  rebaser la session de documentation et relancer le contrôle, et tenez chaque session à l’écart
  de la remise (stash) et du port partagés.
mode: tutorial
covers: coding-with-agents/team
serves: [coding-with-agents/works-in-team/runs-parallel-work]
introduces: [parallel-sessions, worktrees]
assumes: []
extends-to:
  - label: >-
      I’m using claude --worktree for everything now (AI Hero sur YouTube, 8 minutes, en anglais)
    href: https://www.youtube.com/watch?v=yv8VZpov8bk
  - label: >-
      Extend Codex Workflows : des sous-agents dans des worktrees, et comment fusionner leur travail
      (OpenAI Academy, compte gratuit)
    href: https://academy.openai.com/public/courses/extend-codex-workflows-4e61p
after: [coding-with-agents/ci-and-hooks]
shorts:
  - git worktree en cinq commandes, les ports partagés et la remise partagée
exercise:
  kind: do
  brief: >-
    Ouvrez deux worktrees de l’exemple et confiez à un agent la modification de l’API et à un autre
    la documentation, sans fichier commun. Tenez une note d’une ligne par session, fusionnez d’abord
    la branche de l’API et faites rebaser l’autre session.
sources:
  - Brilliant BLD
  - Claude Code worktrees
  - Git docs git-worktree
  - Git docs git-stash
  - Git docs git-rebase
  - Git docs git-merge
  - AI Training orchestration
issue: 190
minutes: 15
sources-checked: 2026-09-25
review-by: 2027-03-25
notes: >-
  Expert level. This repository's orchestration practice (docs/agents/orchestration.md) is the
  worked example, cited by its GitHub URL as `AI Training orchestration` and described in our own
  words. The plan named Academy claude-code-in-action for parallel and headless runs, but its public
  lesson titles (checked on 2026-09-25) have no lesson on parallel sessions or worktrees, so it is
  dropped from the sources. Brilliant BLD-4 and BLD-5 (organize and oversee a workflow) are cited
  as an idea, and the S02 alignment table already maps them to runs-parallel-work. Claude Code
  worktrees gives the `--worktree` location and branch name, the default base branch, the fresh
  checkout without ignored files, `.worktreeinclude`, and the permission approvals saved in the main
  checkout, all checked on 2026-09-25. Git docs git-worktree gives the per-worktree HEAD and index,
  the shared refs, the refusal to check out one branch twice and `remove`. Git docs git-stash gives
  `refs/stash`. Attribution and review norms are left to coding-with-agents/attribution-and-review-norms.
  The fixtures under site/examples/coding-with-agents/parallel-sessions/ copy `shop/` to a
  temporary place, run git with an allow-list environment and fixed dates, and open the two
  worktrees as siblings of the copy, as the page and the exercise do.
