id: coding-with-agents/plan-then-test
title: Planifier d’abord, puis piloter la modification par un test qui échoue
description: >-
  Mettez un agent de code en mode plan pour un bug qui touche trois modules, corrigez une étape de
  son plan tant que les corrections coûtent peu, puis faites-lui écrire le test qui échoue,
  corriger le code jusqu’à ce que le test passe, et lisez le diff.
mode: tutorial
covers: coding-with-agents/workflow
serves: [coding-with-agents/ships-with-agent/runs-a-session]
introduces: [plan-mode, test-driven-change]
assumes:
  - objective: coding-with-agents/ships-with-agent/gives-the-right-context
    lesson: coding-with-agents/first-session
    section: give-the-right-context
sources-checked: 2026-09-23
review-by: 2027-03-23
extends-to:
  - label: I was an AI skeptic. Then I tried plan mode (AI Hero sur YouTube, 12 minutes, en anglais)
    href: https://www.youtube.com/watch?v=WNx-s-RxVxk
  - label: Red green refactor with Claude Code (AI Hero sur YouTube, 5 minutes, en anglais)
    href: https://www.youtube.com/watch?v=hYZdIwFIy-c
after: [coding-with-agents/first-session, coding-with-agents/decomposing-the-work]
shorts: ["quand un test vaut mieux qu’une spécification, et quand une spécification vaut mieux qu’un test"]
exercise:
  kind: do
  brief: >-
    En mode plan, faites proposer à l’agent les étapes d’une correction de bug dans l’exemple,
    corrigez une étape, puis laissez-le écrire le test qui échoue et implémenter jusqu’à ce qu’il
    passe.
sources:
  - Academy claude-code-101
  - Claude Code permission modes
  - Claude Code best practices
minutes: 15
notes: >-
  The fixture is the first-session to-do program a few weeks later, split into todo.py, store.py
  and render.py, with a mutate-while-iterating bug in store.remove_done that the shipped tests don't
  cover. The suite passes as the fixture ships, and the lesson's failing test is committed next to
  the scripts as test_clear.py, which the fixtures copy into a temporary copy of the repository.
  The wrong plan step the learner corrects is a change to render.py that hides done items, which
  makes the symptom go away and leaves the bug. Plan mode facts (Shift+Tab, /plan,
  --permission-mode plan, reads and explores but edits nothing until the plan is approved, the
  approve and keep-planning options, Ctrl+G) come from code.claude.com/docs/en/permission-modes, and the
  explore, plan, code rhythm and the "if you could describe the diff in one sentence, skip the
  plan" advice from code.claude.com/docs/en/best-practices. Both must be re-checked by review-by.
  DLAI-6 was inspiration only and isn't cited on the page, so it stays on the topic and is left
  out of this list.
