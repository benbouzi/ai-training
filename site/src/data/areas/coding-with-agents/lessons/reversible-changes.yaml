id: coding-with-agents/reversible-changes
title: Garder chaque modification d’un agent facile à annuler
description: >-
  Faites livrer par un agent de code les trois incréments de la spécification des dates
  d’échéance, chacun dans un commit sur une branche, annulez celui du milieu pour voir pourquoi
  les limites comptent, concevez les modifications de données avec le chemin du retour écrit, et
  écrivez les messages de commit et la description de pull request dont un relecteur a besoin.
mode: tutorial
covers: coding-with-agents/workflow
serves: [coding-with-agents/ships-with-agent/keeps-change-reversible]
introduces: [reversibility, commits-and-prs]
assumes:
  - objective: coding-with-agents/ships-with-agent/works-in-increments
    lesson: coding-with-agents/spec-driven-increments
    section: land-the-first-increment
after: [coding-with-agents/spec-driven-increments]
shorts:
  - >-
    des migrations avec le chemin du retour écrit, les drapeaux de fonctionnalité comme annulation
    moins coûteuse
exercise:
  kind: do
  brief: >-
    Faites livrer par l’agent les incréments de l’exemple, chacun dans un commit sur une branche,
    annulez celui du milieu, et écrivez la description de pull request qui nomme la spécification et
    ce qui a été vérifié.
sources: [Brilliant INC, DLAI-5, Git docs git-reset, Git docs git-reflog]
sources-checked: 2026-09-26
review-by: 2027-03-26
issue: 157
minutes: 15
notes: >-
  Sources: Brilliant INC (small committed steps), DLAI-5 as inspiration for having the agent
  commit and draft the PR. The fixtures under site/examples/coding-with-agents/reversible-changes/
  read the spec-driven-increments fixture-repo, SPEC.md and test_due.py by path and never change
  them. Each fixture copies the repo, runs git init, commits the program and the spec on main,
  branches due-dates, lands the three increments of SPEC.md as one commit each (increments 2 and 3
  are this lesson's own text, with their tests test_overdue.py and test_bad_date.py next to the
  scripts), and revert.py reverts HEAD~1. The increments keep their hunks apart in todo.py so the
  revert applies without conflict. The page leans on the spec and the first increment from
  spec-driven-increments, so that lesson is the one assumes entry. The fixtures need git 2.32 or
  newer on the learner's machine, and they strip GIT_DIR and the other location variables from
  the environment so an exported GIT_DIR can't point them at another repository.
