id: coding-with-agents/reviewing-the-diff
title: Relire un diff qu’on n’a pas écrit, au regard de la spécification
description: >-
  Relisez une branche d’agent préparée pour la spécification des dates d’échéance dans l’ordre
  consigne, tests, diff, lisez chaque fichier modifié et interrogez ce que la spécification n’a
  jamais demandé, et vérifiez les critères de réussite point par point pour trouver le critère
  abandonné, le cas limite oublié et le test supprimé derrière un résumé qui dit que tous les
  tests passent.
mode: tutorial
covers: coding-with-agents/verification
serves: [coding-with-agents/verifies-agent-work/reviews-others-code]
introduces: [reviewing-code-you-did-not-write, verifying-against-the-specification]
assumes:
  - objective: safety/verifies-output/checks-claims
    lesson: safety/spotting-hallucination
    section: lancer-la-vérification
  - objective: using-agents/delegates-and-checks/reviews-against-brief
    lesson: using-agents/delegating
    section: vérifier-au-regard-de-la-consigne
extends-to:
  - label: >-
      Get Started with Codex, module 1 : accepter une modification sur preuves, et écrire une
      passation qui dit qui a vérifié quoi (OpenAI Academy, compte gratuit)
    href: https://academy.openai.com/public/courses/get-started-with-codex-jkhsq
after: [coding-with-agents/reversible-changes]
shorts: [pourquoi on lit le diff avant le résumé de l’agent]
exercise:
  kind: judge
  brief: >-
    Relisez une branche d’agent préparée dans l’exemple au regard de sa spécification, point par
    point. Elle cache un critère abandonné, un test supprimé, un réglage par défaut modifié et un
    fichier reformaté dont la consigne ne parlait pas.
sources: [Academy ai-fluency-for-builders, Brilliant VER, Git docs git-diff]
issue: 169
minutes: 15
notes: >-
  Tutorial because the branch is real and the learner runs its tests. Sources: Brilliant VER-2,
  VER-3, Academy ai-fluency-for-builders (discernment for code, paraphrased), Git docs git-diff for
  what `--stat` prints. The fixtures under site/examples/coding-with-agents/reviewing-the-diff/ copy
  the spec-driven-increments fixture-repo and SPEC.md, commit both on main, and land the agent's
  work as one commit on a `due-dates` branch. The planted problems are `overdue` printing an empty
  line instead of `nothing overdue` (criterion 3, edge case skipped), a bad date refused with the
  message but exit status 0 (criterion 4, half dropped), `render.py` dropping the `nothing to do`
  line and `test_list_empty` deleted with it, the default file name in `store.py` changed to
  `.todos.json`, and `test_clear.py` reformatted to single quotes. The plan said "a changed
  timeout", and the fixture program has no timeout, so the changed default file name stands in for
  it as the same kind of change: a setting the spec never mentioned, changed in a file the spec
  never named. The fixtures strip GIT_DIR and the other location variables from the environment.
