id: coding-with-agents/scoping-and-referencing
title: Dire à l’agent où est la tâche et où elle s’arrête
description: >-
  Réécrivez une consigne vague pour un petit dépôt afin qu’elle nomme les fichiers concernés, les
  fichiers interdits, l’exemple à imiter, le test à étendre et le contrôle à lancer, et comparez
  les fichiers que l’agent lit avant et après.
mode: tutorial
covers: coding-with-agents/context
serves: [coding-with-agents/ships-with-agent/gives-the-right-context]
introduces: [scoping-a-task, referencing-files]
assumes:
  - objective: concepts/explains-models/explains-grounding
    lesson: concepts/retrieval
    section: lancrage-et-ce-quil-ne-corrige-pas
sources-checked: 2026-09-24
review-by: 2027-03-24
after: [coding-with-agents/plan-then-test]
shorts: [pourquoi un chemin et un numéro de ligne fonctionnent mieux qu’une description du code]
exercise:
  kind: do
  brief: >-
    Réécrivez une consigne vague pour l’exemple avec les fichiers concernés, les fichiers interdits,
    l’exemple à imiter et la commande de vérification, puis comparez les fichiers que l’agent lit
    dans les deux exécutions.
sources: [AEC-15, Academy claude-code-101, Claude Code best practices]
issue: 160
minutes: 10
notes: >-
  The plan named the topic concepts/grounding as assumed; taken as the objective
  concepts/explains-models/explains-grounding, taught by the live lesson concepts/retrieval in its
  section "Grounding, and what it doesn't fix". The fixture is the plan-then-test to-do program
  after its fix, grown with export.py (CSV), legacy/todo_v1.py (the old one-file version, which has
  an `undone` function) and docs/SPEC.md (which specifies an `undo` command that isn't built). The
  task is to add `undo` to todo.py next to `done`. A search for "undo" hits legacy/todo_v1.py and
  the spec, so the vague brief sends the agent to the legacy file; the scoped brief names todo.py
  lines 16-21 to imitate, test_todo.py line 21 to extend and docs/SPEC.md to follow. Vendor facts
  (the `@` file reference, "scope the task" and "reference existing patterns" in the prompt table,
  and the "infinite exploration" failure pattern) come from code.claude.com/docs/en/best-practices
  and must be re-checked by review-by. AEC-15 backs the "do not modify" boundaries section of an
  instruction file. Academy claude-code-101 is linked for its context-management module and nothing
  is copied from it.
