id: coding-with-agents/spec-driven-increments
title: Travailler à partir d’une spécification, par petits incréments
description: >-
  Écrivez une spécification d’une page pour une fonctionnalité de dates d’échéance dans l’exemple
  de liste de tâches, faites-la découper par un agent de code en incréments qui laissent chacun le
  programme fonctionnel, ordonnez-les en commençant par le moins sûr, et livrez le premier au
  regard des critères de réussite de la spécification elle-même.
mode: tutorial
covers: coding-with-agents/workflow
serves: [coding-with-agents/ships-with-agent/works-in-increments]
introduces: [spec-driven-change, working-increments, sequencing-for-early-feedback]
assumes:
  - objective: coding-with-agents/specifies-work/defines-success
    lesson: coding-with-agents/deciding-what-to-build
    section: écrire-ce-quexige-la-réussite
extends-to:
  - label: Building a real feature with Claude Code (AI Hero sur YouTube, 44 minutes, en anglais)
    href: https://www.youtube.com/watch?v=hX7yG1KVYhI
  - label: My 7 phases of AI development (AI Hero, en anglais)
    href: https://www.aihero.dev/my-7-phases-of-ai-development
after: [coding-with-agents/plan-then-test]
shorts: [le chemin mince de bout en bout]
exercise:
  kind: do
  brief: >-
    À partir de la spécification de la page, donnez à l’agent la consigne du deuxième incrément
    seulement et livrez-le : d’abord le test avec les deux dates, puis le code, puis le critère
    vérifié à la main.
sources: [Academy ai-native-sdlc-playbook, Brilliant INC]
sources-checked: 2026-09-26
review-by: 2027-03-26
issue: 155
minutes: 15
notes: >-
  Sources: Brilliant INC, Academy ai-native-sdlc-playbook (spec as the source of truth, paraphrased
  in our own words, no text or example copied). The fixture is the plan-then-test to-do program
  after that lesson's fix landed, copied to its own directory with test_clear.py in the repo. The
  feature is due dates: a due command, a date in list, an overdue command with a TODO_TODAY override
  and date validation. The spec is SPEC.md next to the fixture scripts, and the fixtures copy it
  and the first increment (todo.py due command, render.py date suffix, test_due.py) into a copy of
  the repository. criteria.py runs every success criterion of the spec against the copy after the
  first increment, so the page's "3 of 5" comes from a fixture. The page leans on success
  criteria, which deciding-what-to-build introduces, so that lesson is the one assumes entry. That
  lesson specifies a smaller due-dates feature on the same fixture (date on add, overdue out of
  scope), and the page says in "Write the spec" that this spec changes both decisions on purpose.
  The lesson doesn't lean on plan-then-test's teaching (plan mode, failing test first). Decomposition
  into components is a separate planned lesson and isn't taught here.
