id: coding-with-agents/tests-and-docs-that-hold
title: Des tests qui prouvent un comportement et une documentation qui reste à jour
description: >-
  Cassez volontairement un petit module de tarification pour trouver les tests écrits par l’agent
  qui recopient le code, réécrivez-en un pour qu’il prouve le prix, gardez les tests rapides et
  complets dans la boucle de l’agent, et relisez une modification pour la documentation qu’elle a
  laissée vieillir.
mode: tutorial
covers: coding-with-agents/quality
serves:
  - coding-with-agents/verifies-agent-work/reviews-others-code
  - coding-with-agents/verifies-agent-work/automates-the-check
introduces: [testing, documentation, deep-modules]
assumes:
  - objective: safety/judges-agent-risk/names-blast-radius
    lesson: safety/agent-risk
    section: le-rayon-dimpact
extends-to:
  - label: Relire ce que l’agent a ajouté comme dépendances
    href: /coding-with-agents/dependency-review/
  - label: How to make codebases AI agents love (AI Hero, en anglais)
    href: https://www.aihero.dev/how-to-make-codebases-ai-agents-love
  - label: Your codebase is not ready for AI (AI Hero sur YouTube, 9 minutes, en anglais)
    href: https://www.youtube.com/watch?v=uC44zFz7JSM
after: [coding-with-agents/self-checking-loops]
shorts: [un test qui recopie l’implémentation]
exercise:
  kind: judge
  brief: >-
    Cassez volontairement l’exemple et lancez ses tests écrits par l’agent, gardez ceux qui
    échouent, réécrivez-en un qui passait, et vérifiez quelle documentation la modification a
    laissée vieillir.
sources: [Academy ai-native-sdlc-playbook, Claude Code best practices, Claude Code memory,
      Ousterhout 2021]
issue: 176
minutes: 20
sources-checked: 2026-10-02
review-by: 2027-04-02
notes: >-
  The plan named the topic safety/agent-risk as assumed; taken as the objective
  safety/judges-agent-risk/names-blast-radius, used where an agent that may edit the tests widens
  the blast radius of a wrong change to the check itself. DLAI-7 was planned as inspiration only;
  the page doesn't cite it, so it is dropped from sources (it stays on the topic). Sources: Academy
  ai-native-sdlc-playbook (the idea that review and testing become the slow steps when agents
  produce most of the code, from the public course page, in our own words and with no phrase of it kept),
  Claude Code best practices (prefer single tests to the
  whole suite for speed, in its example instructions file; link to detailed documentation instead of copying
  it into CLAUDE.md), Claude Code memory (instructions files are loaded each session as context,
  not enforced configuration). The fixtures under site/examples/coding-with-agents/tests-and-docs-that-hold/
  are self-contained: shop/ is a pricing module with five agent-written tests, two of which mirror
  the implementation. break_price.py sets SHIPPING to 5.95, rewrite_test.py also pins the small-order
  test to 4.95, and the_change.py raises the free-shipping threshold to 60.00 and greps the three
  documentation places the shop's AGENTS.md names. The page doesn't say "the previous lesson",
  because self-checking-loops serves automates-the-check, which this lesson also serves; the git
  tag steps are repeated on the page instead. The first checkpoints on reviews-others-code test three
  ideas (tests that mirror the code, documentation left stale, and deep modules), so a review
  alternate on one idea can be asked in place of a sibling on another. Each idea has at least one
  review alternate: a-test-that-passed-the-break and proves-or-mirrors, docs-left-out-of-the-diff,
  and the Sort kept-inside-or-leaked. The mismatch is accepted for now, as in
  self-checking-loops (issue #408), because the plan gives the lesson these two objectives
  and deep modules has no objective of its own.
  shop/.gitignore keeps __pycache__ out of the learner's git add -A after running the tests.
  Deep modules (Ousterhout 2021) was folded into this lesson on 2026-10-02 instead of getting a
  lesson of its own, because no objective fits it on its own. Issue #693 added the section "Test
  through a small interface", its checkpoint new-parameters-for-total and the review alternate
  kept-inside-or-leaked, both on reviews-others-code. Ousterhout 2021 is a proprietary book: the
  page uses two of its ideas in our own words (a module's interface as what callers learn against
  what the module does for them, deep against shallow modules; and the name information leakage,
  described on the page by its effect, a price written into several modules that a change has to
  edit in each), with no text copied. The page treats total(lines) as the interface and subtotal and
  shipping as public helpers, and says that the rewritten shipping test pins the right price but
  still calls a helper. The claim that a deep module needs less context in a later agent session
  follows from the concept definition in the quality topic and isn't cited to the book. The shop
  fixture is reused unchanged, and the section's test line is the key of rewrite-the-total-test. The
  section raises the estimate for reading and checkpoints from about 16.5 to 20.0 minutes (review
  alternates don't count), so minutes is 20. The three other sources were checked again on
  2026-10-02 and still state what the page cites.
