id: coding-with-agents/context
area: coding-with-agents
name: Ingénierie du contexte pour le code
definition: >-
  La qualité de ce que produit un agent suit la qualité de son contexte. Ce thème couvre ce qui a
  sa place dans les instructions permanentes d’un projet, la façon de cadrer une tâche pour que
  l’agent cherche aux bons endroits, la façon de lui désigner des fichiers précis, et la façon
  d’éviter qu’une session se dégrade à mesure que son contexte se remplit.
concepts:
  - id: project-instructions
    name: Instructions de projet
    definition: >-
      Un fichier du dépôt que l’agent lit au début de chaque session et qui contient ce qu’il doit
      savoir à chaque fois : comment construire et tester, quelles conventions suivre, quels endroits
      ne pas toucher. C’est là qu’une erreur récurrente de l’agent se corrige une fois pour toutes.
      Gardez-le court et factuel, car les longs fichiers d’instructions sont suivis de façon moins
      fiable que les courts.
  - id: scoping-a-task
    name: Cadrage d’une tâche
    definition: >-
      Dire à l’agent où se trouve une tâche et où elle s’arrête : quel module, quelle couche, quels
      fichiers sont concernés et lesquels sont interdits. Le cadrage économise du contexte, parce que
      l’agent n’explore pas du code sans rapport, et il évite la refonte bien intentionnée qui étend
      une petite modification à tout le dépôt. Une consigne cadrée donne aussi un diff plus facile à
      relire.
  - id: referencing-files
    name: Référencer des fichiers
    definition: >-
      Nommer les fichiers, les fonctions ou les documents exacts que l’agent doit lire, au lieu de les
      décrire, pour qu’il charge le bon contexte du premier coup. Un chemin et un numéro de ligne
      valent mieux que « le code de configuration ». Référencez l’exemple à imiter, le test à étendre
      et la spécification à suivre. Sans cela, l’agent prend le premier fichier ressemblant qu’il
      trouve.
  - id: avoiding-context-rot
    name: Éviter la dégradation du contexte
    definition: >-
      Garder le contexte de la session léger pour que l’agent continue de suivre les instructions et
      de se souvenir de l’objectif : une tâche par session, des résumés à la place des journaux bruts,
      une nouvelle session pour un nouveau travail, et aucun fichier entier collé alors que l’agent
      peut le lire lui-même. Quand les réponses dérivent ou que des règles données plus tôt sont
      ignorées, le contexte est plein. Compactez ou recommencez avant d’aller plus loin.
  - id: starting-context
    name: Contexte de départ
    definition: >-
      Tout ce qui se trouve dans la fenêtre de contexte avant le premier message : le prompt système
      et les descriptions d’outils du harnais, les serveurs connectés, les descriptions des skills,
      les fichiers d’instructions et la mémoire enregistrée. Il est renvoyé avec chaque requête, donc
      il coûte des jetons à chaque fois et laisse moins de place à la tâche. Une commande de contexte
      montre sa taille par catégorie. Il diminue quand on déplace les consignes rarement utiles dans
      des skills ou des règles chargées à la demande, et quand on déconnecte les serveurs inutilisés.
  - id: deciding-at-a-phase-boundary
    name: Décider en fin de phase
    definition: >-
      Choisir ce avec quoi la phase de travail suivante commence quand une phase se termine, par
      exemple après la planification. Les options sont de continuer dans la même session, d’effacer le
      contexte, de le compacter en un résumé, d’écrire une passation pour une nouvelle session, ou de
      confier la partie suivante à un sous-agent. Le choix dépend de ce dont la phase suivante a
      besoin : tout l’historique quand elle poursuit le même problème, et une spécification écrite
      dans une fenêtre vide quand elle en commence un nouveau.
