id: coding-with-agents/first-session
area: coding-with-agents
name: Lancer un agent de code
definition: >-
  Un agent de code travaille dans votre dépôt avec vos outils. Ce thème couvre une première
  session : installer et configurer l’agent, lui faire lire et expliquer le code, faire une
  première petite modification, comprendre ce pour quoi il demande une autorisation, savoir où
  s’arrête le bac à sable qui l’entoure, gérer les clés d’API qu’il utilise sans les divulguer, et
  conduire la session pour que son contexte reste utile.
concepts:
  - id: install-and-setup
    name: Installation et configuration
    definition: >-
      Faire fonctionner un agent de code dans un terminal ou un éditeur : installer l’outil,
      s’authentifier auprès d’un fournisseur de modèles, l’ouvrir dans un dépôt et vérifier qu’il peut
      lancer les commandes du projet. C’est aussi à l’installation que vous décidez de ce que l’agent
      peut atteindre. Faites-la donc dans un dépôt que l’agent peut modifier sans dommage, avec un
      arbre de travail propre.
  - id: codebase-understanding
    name: Compréhension du code
    definition: >-
      Utiliser l’agent pour s’orienter dans un code inconnu avant de le modifier : lui demander où se
      trouve une fonctionnalité, comment circule une requête, de quoi dépend un module. L’agent lit et
      cherche dans les fichiers plus vite que vous, et son explication donne une première carte
      rapide. Vérifiez cette carte dans le code pour tout ce sur quoi vous allez agir, car les agents
      résument avec assurance.
  - id: first-change
    name: Première modification
    definition: >-
      Une petite modification bien délimitée faite avec l’agent pour apprendre comment il travaille :
      une correction avec un test qui échoue, un renommage, une mise à jour de la documentation.
      Donnez-lui la consigne, regardez quels fichiers il lit, lisez le diff qu’il propose et lancez
      les tests vous-même. Le but est de mesurer son comportement dans votre projet avant de lui
      confier quelque chose de plus grand.
  - id: permissions
    name: Permissions
    definition: >-
      Ce que l’agent peut faire sans demander : lire des fichiers, modifier des fichiers, lancer des
      commandes, accéder au réseau. Par défaut, les agents de code demandent une approbation pour les
      actions risquées, et vous pouvez élargir ou restreindre ce réglage. Tout approuver par commodité
      transforme une erreur dans une commande en une erreur dans votre dépôt ou votre système.
      Élargissez donc l’accès projet par projet et tâche par tâche.
  - id: sandbox
    name: Bac à sable
    definition: >-
      Un environnement isolé dans lequel l’agent s’exécute, pour qu’une mauvaise commande n’abîme que
      ce qui s’y trouve : un conteneur, une machine virtuelle ou un compte utilisateur séparé. Le bac
      à sable limite les fichiers, les destinations réseau et les identifiants que l’agent peut
      atteindre. C’est un contrôle que vous mettez en place avant la session, et un agent de code sans
      bac à sable a exactement les accès que vous avez.
  - id: trust-boundary
    name: Frontière de confiance
    definition: >-
      La ligne qui sépare ce que l’agent peut décider seul de ce qui est imposé de l’extérieur. Les
      instructions d’un prompt sont des demandes que le modèle peut ignorer ou dont on peut le
      détourner, donc un contrôle important est imposé par le harnais, le système d’exploitation ou le
      réseau. Savoir ce que l’agent envoie à son fournisseur, du contenu des fichiers à la sortie des
      commandes, fait partie du tracé de cette ligne.
  - id: secrets-hygiene
    name: Hygiène des secrets
    definition: >-
      Gérer les clés d’API et les jetons dont un agent a besoin pour qu’une fuite reste limitée.
      Utilisez une clé personnelle, jamais une clé partagée, et gardez-la dans un gestionnaire de mots
      de passe ou une variable d’environnement. Une clé ne va jamais dans un fichier que l’agent peut
      committer. Si une clé a pu être exposée, révoquez-la d’abord et enquêtez ensuite, parce qu’une
      rotation coûte peu et qu’une clé divulguée est vite utilisée par quelqu’un d’autre.
  - id: session-and-context
    name: Session et contexte
    definition: >-
      Une session est une conversation avec l’agent, et sa fenêtre de contexte est la mémoire de la
      session. Chaque fichier lu et chaque sortie de commande y entre, donc les longues sessions se
      remplissent et l’agent commence à oublier des instructions données plus tôt. Gardez une tâche
      par session, recommencez à neuf pour un travail sans rapport, et demandez un résumé avant de
      compacter ou de passer la main.
