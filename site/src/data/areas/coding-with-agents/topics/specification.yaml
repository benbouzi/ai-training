id: coding-with-agents/specification
area: coding-with-agents
name: Décider et spécifier
definition: >-
  Quand un agent fait l’implémentation, le savoir-faire de l’ingénieur se concentre avant le
  code : juger si quelque chose vaut la peine d’être construit, définir ce que la réussite exige,
  découper le problème en composants aux dépendances claires, et concevoir la vérification du
  résultat avant qu’il existe.
concepts:
  - id: what-is-worth-building
    name: Ce qui vaut la peine d’être construit
    definition: >-
      Juger une idée avant de la construire : qui en a besoin, ce qu’elle coûte à construire et à
      entretenir, ce qu’elle remplace, et ce qui se passe si on ne la construit pas. Une
      implémentation peu coûteuse rend ce jugement plus important, parce que le coût d’une mauvaise
      construction est désormais surtout le coût de sa maintenance. Dites non, ou proposez plus petit,
      avant que l’agent commence.
  - id: success-criteria
    name: Critères de réussite
    definition: >-
      Des énoncés concrets et vérifiables de ce qu’un résultat terminé doit faire et ne doit pas
      faire, écrits avant le début du travail. De bons critères décrivent un comportement observable,
      nomment les cas limites qui comptent et fixent des limites, de performance ou de compatibilité
      par exemple. Ils deviennent la cible de l’agent et la liste de contrôle du relecteur, et ils
      empêchent d’accepter un résultat plausible comme un résultat correct.
  - id: decomposition-into-components
    name: Décomposition en composants
    definition: >-
      Découper un problème en parties aux responsabilités et aux interfaces claires, chacune assez
      petite pour être construite et vérifiée seule. De bons composants peuvent être implémentés dans
      n’importe quel ordre qui respecte leurs dépendances, testés isolément et remplacés sans toucher
      au reste. Le découpage est une décision de conception qui revient à l’ingénieur : les agents le
      suivent bien et l’inventent mal.
  - id: dependencies
    name: Dépendances
    definition: >-
      Les relations qui imposent un ordre : quel composant a besoin qu’un autre existe d’abord, quelle
      décision doit être prise avant qu’une partie puisse être spécifiée, quel système externe doit
      être disponible. Nommer les dépendances tôt fixe l’ordre du travail, montre ce qui peut avancer
      en parallèle et fait apparaître l’hypothèse risquée sur laquelle tout le reste repose.
  - id: designing-the-verification
    name: Conception de la vérification
    definition: >-
      Décider comment chaque partie du travail sera vérifiée avant de la construire : quels tests
      doivent passer, quoi observer dans le système en marche, quelles questions poser en revue.
      Concevoir la vérification d’abord rend les critères précis, donne à l’agent une cible qu’il peut
      exécuter lui-même, et évite que la vérification se réduise à un coup d’œil sur un diff qui a
      l’air juste.
  - id: design-interview
    name: Entretien de conception
    definition: >-
      Faire interroger l’ingénieur par l’agent sur une fonctionnalité avant d’écrire un plan. L’agent
      pose des questions sur l’implémentation, les cas limites, les inquiétudes et les compromis,
      passe sur l’évident, et continue jusqu’à ce que les points ouverts soient tranchés. Il écrit
      ensuite le résultat sous forme de spécification. Les questions font apparaître des décisions que
      l’ingénieur n’avait pas encore prises, à un moment où les changer ne coûte rien. La
      spécification écrite permet à une nouvelle session de construire la conception sans avoir
      l’entretien dans son contexte.
  - id: throwaway-prototype
    name: Prototype jetable
    definition: >-
      Un petit programme construit seulement pour répondre à une question de conception, par exemple
      si une bibliothèque supporte les données ou laquelle de deux interfaces se lit le mieux, et
      supprimé une fois la question tranchée. Il se passe de gestion d’erreurs, de tests et de
      structure, puisque aucune ligne de son code n’est gardée. Avec un agent, un prototype coûte peu,
      donc essayer une idée peut remplacer une longue discussion à son sujet. La réponse va dans la
      spécification, et le code du prototype reste hors du vrai système.
  - id: shared-vocabulary
    name: Vocabulaire commun
    definition: >-
      Un seul sens convenu pour chaque terme du domaine, employé de la même façon par les experts du
      domaine, les ingénieurs, les spécifications, le code et les instructions de l’agent. Quand la
      spécification dit « compte » et que le code dit « client » pour la même chose, un agent doit
      deviner si les deux diffèrent, et certaines de ses suppositions sont fausses. Un court glossaire
      que l’agent lit garde les termes alignés, et renommer un terme est une modification de la
      conception.
