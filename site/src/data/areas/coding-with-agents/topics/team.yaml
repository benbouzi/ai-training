id: coding-with-agents/team
area: coding-with-agents
name: Les agents dans une équipe
definition: >-
  Dès que plusieurs personnes et plusieurs agents travaillent sur un même dépôt, les habitudes
  individuelles doivent devenir une pratique d’équipe. Ce thème couvre les sessions d’agents en
  parallèle sans collisions, l’usage des worktrees, le branchement des agents sur la CI,
  l’application des règles par des hooks, les règles de revue convenues, et l’attribution honnête
  du travail des agents.
concepts:
  - id: parallel-sessions
    name: Sessions parallèles
    definition: >-
      Faire tourner plus d’une session d’agent à la fois, sur des tâches séparées, pour utiliser le
      temps d’attente. Cela multiplie la production, et aussi les risques : deux sessions qui
      modifient les mêmes fichiers, des modifications dont on ne sait plus à quelle tâche elles
      appartiennent, une attention épuisée au moment de relire. Le travail en parallèle demande une
      isolation par session et la discipline de terminer et de relire une tâche avant de fusionner la
      suivante.
  - id: worktrees
    name: Worktrees
    definition: >-
      Des copies extraites séparées d’un même dépôt, chacune sur sa propre branche, qui partagent un
      seul historique. Un worktree par session d’agent donne à chacune ses propres fichiers et son
      propre état de build, donc des sessions parallèles ne peuvent pas s’écraser et une session ratée
      peut être jetée sans toucher aux autres. C’est la façon habituelle d’isoler localement le
      travail simultané d’agents.
  - id: ci-integration
    name: Intégration à la CI
    definition: >-
      Faire de la chaîne d’intégration continue le contrôle commun des modifications d’agents : les
      mêmes contrôles de style, tests, build et sécurité s’appliquent à chaque pull request, quel que
      soit l’auteur, humain ou outil. La CI transforme une vérification individuelle en garantie
      d’équipe et donne aux agents une cible objective. On peut aussi confier aux agents des résultats
      de CI à corriger, dans les mêmes limites que toute boucle d’autovérification.
  - id: team-hooks
    name: Hooks d’équipe
    definition: >-
      Des scripts qui s’exécutent automatiquement à des moments fixes (avant un commit, après la
      modification d’un fichier par un agent, avant l’exécution d’une commande) pour appliquer une
      règle de façon mécanique : formater le code, bloquer un secret, refuser un chemin interdit. Les
      hooks imposent ce que les instructions peuvent seulement demander, et ils s’appliquent de la
      même façon à chaque session et à chaque membre de l’équipe. C’est ce qui en fait un outil
      d’équipe.
  - id: review-norms
    name: Règles de revue
    definition: >-
      Les accords de l’équipe sur la revue des modifications faites avec un agent : l’auteur lit et
      comprend chaque ligne avant de demander une revue, la pull request dit ce que l’agent a fait et
      ce qui a été vérifié, les relecteurs lisent le diff lui-même, et des limites de taille gardent
      les modifications relisibles. Ces règles maintiennent la responsabilité humaine que les agents
      peuvent éroder sans bruit.
  - id: attribution
    name: Attribution
    definition: >-
      Indiquer qu’un agent a contribué à une modification, en général par une ligne de fin (trailer)
      dans le message de commit et une note dans la pull request, à côté de la personne qui a dirigé
      et vérifié le travail. L’attribution permet aux relecteurs de doser leur attention, garde un
      historique honnête, et sépare ce qu’une personne certifie de ce qu’un outil a produit. La
      personne reste l’auteur officiel.
  - id: agent-reachable-backlog
    name: Backlog accessible à l’agent
    definition: >-
      Des spécifications et des tickets gardés dans l’outil de suivi de l’équipe, avec des liens qui
      indiquent quel ticket en bloque un autre, là où les personnes et les agents peuvent les lire et
      les mettre à jour. Un agent qui peut lister les tickets ouverts, en lire un en entier et voir ce
      qui le bloque peut prendre du travail et en rendre compte sans que personne ne colle de texte
      dans la session. Un outil en ligne de commande est l’accès le moins coûteux pour l’agent, avec
      des identifiants qui ne permettent que ce dont il a besoin, par exemple commenter sans pouvoir
      supprimer.
  - id: standards-file
    name: Fichier de normes
    definition: >-
      Une liste écrite des règles de code de l’équipe qu’aucun outil ne vérifie, lue par les
      relecteurs humains comme par les agents relecteurs. Les relecteurs comparent une modification au
      fichier, et un point qui n’y figure pas est une suggestion qui ne bloque pas la modification.
      Quand la même remarque revient dans plusieurs revues, elle est ajoutée au fichier. Quand un
      outil d’analyse ou un hook peut vérifier une règle, la règle y est déplacée, parce qu’un
      contrôle s’exécute sur chaque modification.
