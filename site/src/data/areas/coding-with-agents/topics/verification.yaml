id: coding-with-agents/verification
area: coding-with-agents
name: Vérifier le travail d’un agent
definition: >-
  Du code que vous n’avez pas écrit demande une autre façon de lire. Ce thème couvre la revue du
  diff d’un agent au regard de la spécification au lieu d’un jugement de vraisemblance,
  l’observation du système en marche, la réduction méthodique d’un défaut, la transformation des
  contrôles en boucles que l’agent exécute lui-même dans les limites que vous fixez, le recours à
  des barrières déterministes de préférence aux avis d’un modèle, et l’attaque de votre propre
  agent avant que quelqu’un d’autre ne s’en charge.
concepts:
  - id: reviewing-code-you-did-not-write
    name: Relire du code qu’on n’a pas écrit
    definition: >-
      Lire le diff d’un agent en relecteur, sans la mémoire de l’auteur : vous ne savez pas pourquoi
      chaque ligne existe, donc chaque ligne doit se justifier. Cherchez les modifications hors de la
      consigne, les changements de comportement silencieux, les tests supprimés, les schémas recopiés
      au mauvais endroit et les commentaires qui décrivent une intention à la place de ce que fait le
      code. Lisez le code lui-même, au-delà du résumé qu’en fait l’agent.
  - id: verifying-against-the-specification
    name: Vérification au regard de la spécification
    definition: >-
      Comparer le résultat aux critères de réussite écrits avant le travail, point par point, au lieu
      de juger si la modification a l’air raisonnable. Cela détecte le résultat plausible mais faux,
      le critère abandonné en silence et le cas limite oublié. Si un critère ne peut pas être vérifié,
      il faut corriger la spécification ou la conception de la vérification avant d’accepter la
      modification.
  - id: observing-a-running-system
    name: Observation d’un système en marche
    definition: >-
      Lancer le logiciel modifié et regarder ce qu’il fait vraiment : les journaux qu’il écrit, les
      requêtes qu’il envoie, l’état qu’il laisse, l’écran qu’il affiche. Les tests prouvent ce qu’ils
      couvrent, et l’observation détecte ce que personne n’a pensé à tester. Pour le travail d’un
      agent, le lancer vous-même vérifie aussi que son « les tests passent » est vrai.
  - id: isolating-a-fault
    name: Isoler un défaut
    definition: >-
      Réduire un échec jusqu’à sa cause par étapes méthodiques : le reproduire, réduire l’entrée,
      chercher par dichotomie la modification en cause, ajouter de l’observation à la frontière,
      confirmer l’hypothèse avant de corriger. Les agents peuvent aider à chaque étape, et ils
      devinent aussi des corrections. Exiger une cause reproduite et expliquée avant tout correctif
      évite que la correction devienne un nouveau bug.
  - id: bounded-self-checking-loops
    name: Boucles d’autovérification bornées
    definition: >-
      Donner à l’agent un contrôle qu’il peut exécuter lui-même, comme une suite de tests, un outil
      d’analyse ou un build, et le laisser itérer jusqu’à ce que le contrôle passe, avec une limite
      sur le nombre de tentatives et une règle sur ce qu’il peut modifier. La limite compte : une
      boucle sans limite finit par satisfaire le contrôle en l’affaiblissant. À la fin, la personne
      vérifie que le contrôle est toujours honnête.
  - id: deterministic-gates
    name: Barrières déterministes
    definition: >-
      Des contrôles dont le résultat ne dépend pas du jugement d’un modèle : tests, vérification des
      types, outils d’analyse, builds et validation de schéma. Ils donnent la même réponse pour la
      même entrée, donc ils peuvent bloquer une fusion. Une revue par un autre modèle ajoute un second
      avis et trouve des choses qu’une barrière ne voit pas, mais elle peut se tromper ou être
      convaincue de la même façon que le premier modèle, donc elle ne remplace jamais la barrière.
  - id: red-teaming-your-own-agent
    name: Attaquer son propre agent
    definition: >-
      Essayer délibérément de faire dérailler votre propre agent avant de compter sur lui (red
      teaming) : lui donner un fichier qui contient des instructions cachées, lui coller une page web
      que vous n’avez pas lue, lui demander une chose que ses permissions devraient empêcher, lui
      donner une consigne ambiguë et voir jusqu’où il va. Le but est d’apprendre ce qu’il fait sous
      pression, dans un bac à sable où rien de réel ne peut être abîmé. Ce que vous trouvez devient
      une modification des permissions, une instruction ou une barrière.
  - id: fresh-context-review
    name: Revue en contexte neuf
    definition: >-
      Une revue faite par une session d’agent qui n’a pas écrit la modification. Elle reçoit le diff,
      la spécification et les critères à vérifier, et aucun des raisonnements qui ont produit la
      modification, donc elle juge le résultat pour lui-même. Un relecteur à qui l’on demande des
      manques en trouve même dans un travail solide, donc on lui dit de ne signaler que ce qui touche
      la justesse ou les exigences énoncées. Ses remarques sont des avis qu’une personne pèse, à côté
      des barrières déterministes qui décident si une modification est fusionnée.
