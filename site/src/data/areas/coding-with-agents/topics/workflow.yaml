id: coding-with-agents/workflow
area: coding-with-agents
name: Planifier, implémenter, vérifier
definition: >-
  Un rythme reproductible pour livrer avec un agent de code : planifier avant de modifier, piloter
  la modification par une spécification ou un test qui échoue, la livrer en petits incréments
  fonctionnels ordonnés pour que les retours arrivent tôt, garder chaque étape réversible, et
  consigner le travail dans des commits et des pull requests qu’une équipe peut relire.
concepts:
  - id: plan-mode
    name: Mode plan
    definition: >-
      Faire explorer et proposer l’agent avant qu’il modifie quoi que ce soit. En mode plan, il lit le
      code, pose des questions et écrit les étapes qu’il compte suivre. Vous corrigez le plan tant que
      les corrections coûtent peu. La plupart des erreurs d’agent coûtent moins cher à détecter dans
      un plan que dans un diff, donc utilisez-le pour toute modification qui touche plus de deux ou
      trois fichiers.
  - id: spec-driven-change
    name: Modification guidée par la spécification
    definition: >-
      Écrire la spécification d’une modification, avec ses critères de réussite, dans un document à
      partir duquel l’agent travaille et auquel le relecteur compare le résultat. La spécification
      reste la référence pendant que l’agent itère. Quand le code et la spécification divergent, l’un
      des deux est mis à jour de façon délibérée. Cette méthode convient aux modifications où la
      conception compte plus qu’un test isolé.
  - id: test-driven-change
    name: Modification guidée par les tests
    definition: >-
      Écrire, ou faire écrire par l’agent, un test qui échoue et qui décrit le comportement voulu,
      puis implémenter jusqu’à ce qu’il passe, puis nettoyer. Le test donne à l’agent une cible sans
      ambiguïté qu’il peut exécuter seul, et vous donne la preuve que la modification fait ce qui
      était demandé. Cette méthode convient aux modifications de comportement délimitées et aux
      corrections de bugs.
  - id: working-increments
    name: Incréments fonctionnels
    definition: >-
      Livrer une modification sous forme d’une série de petites étapes qui laissent chacune le système
      fonctionnel et testé. Les incréments gardent le diff relisible, gardent le contexte de l’agent
      concentré et montrent clairement quelle étape a introduit un problème. Un agent produit
      volontiers une grosse modification d’un seul coup, donc demander des incréments fait partie de
      la consigne.
  - id: sequencing-for-early-feedback
    name: Ordonner pour un retour rapide
    definition: >-
      Ordonner les incréments pour tester en premier l’hypothèse la plus risquée ou le comportement le
      plus visible. Construisez le chemin de bout en bout, même mince, avant les détails,
      l’intégration avant les finitions, la partie dont vous êtes le moins sûr avant celle dont vous
      êtes certain. Un retour rapide transforme une réécriture possible en petite correction.
  - id: reversibility
    name: Réversibilité
    definition: >-
      Garder chaque modification facile à annuler : committée par petites étapes, sur une branche,
      sans opération destructrice mêlée au reste, et avec des migrations de données qu’on peut
      annuler. La réversibilité est ce qui rend sûr de laisser un agent essayer quelque chose. Si une
      étape ne peut pas être annulée, c’est celle qui demande qu’une personne la regarde avant son
      exécution.
  - id: commits-and-prs
    name: Commits et pull requests
    definition: >-
      Consigner le travail fait avec un agent dans les unités habituelles de l’équipe : des commits
      ciblés dont le message dit pourquoi, et des pull requests qui expliquent la modification,
      renvoient à la spécification et disent ce qui a été vérifié et comment. De bonnes limites de
      commit rendent la revue et l’annulation possibles, et une pull request qui décrit le rôle de
      l’agent permet aux relecteurs de doser leur attention.
