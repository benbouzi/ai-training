id: concepts/explains-models
area: concepts
statement: Explique comment un modèle de langage produit du texte et où il échoue
topics: [concepts/how-models-work, concepts/limits, concepts/grounding]
objectives:
  - id: concepts/explains-models/explains-generation
    statement: Explique en mots simples les jetons, le contexte et l’échantillonnage
    level: base
    behaviors:
      - claim: >-
          Un modèle produit du texte un jeton à la fois, chacun tiré d’une distribution de probabilités
          sur ce qui pourrait venir ensuite.
        why: >-
          Dès que l’apprenant voit la sortie comme une chaîne de morceaux suivants probables, le non-sens
          fluide comme les variations surprenantes cessent d’être mystérieux.
        example: >-
          Quand on lui demande pourquoi la même question a donné deux réponses différentes, l’apprenant
          dit que le modèle a choisi tôt un autre jeton probable et que la suite en a découlé, sans dire
          que le modèle « a changé d’avis ».
      - claim: >-
          La fenêtre de contexte est tout ce que le modèle peut voir pour une réponse, et ce qui est hors
          d’elle n’existe pas pour le modèle.
        why: >-
          La plupart des plaintes du type « il a oublié » ou « il a ignoré mon fichier » sont des
          problèmes de contexte, et leur correction diffère de celle d’un problème de prompt.
        example: >-
          Quand une longue conversation commence à se contredire, l’apprenant soupçonne que des messages
          anciens sont sortis de la fenêtre et reformule les faits clés au lieu de reprocher son oubli
          au
          modèle.
      - claim: >-
          La température et les réglages d’échantillonnage arbitrent entre variété et prévisibilité, et
          ils ne changent pas ce que sait le modèle.
        why: >-
          Sans cela, les apprenants se tournent vers la température pour corriger l’exactitude, ce qu’elle
          ne peut pas faire.
        example: >-
          Pour un résumé qui doit être le même à chaque essai, l’apprenant demande une température basse.
          Pour trouver des idées de noms, il l’augmente, et dans aucun des deux cas il n’attend qu’elle
          ajoute des faits.
  - id: concepts/explains-models/names-failure-modes
    statement: Nomme les façons courantes dont une sortie tourne mal, et pourquoi
    level: base
    behaviors:
      - claim: >-
          Une hallucination est une affirmation fluide et assurée qui ne repose sur rien, et l’aisance
          n’est pas un signe de vérité.
        why: >-
          Une formulation assurée est exactement ce que récompense l’entraînement : l’apprenant doit
          cesser d’utiliser le ton comme critère.
        example: >-
          Face à une référence avec un nom de revue, un auteur et une année d’apparence réelle,
          l’apprenant la cherche avant de s’y fier, et ne s’étonne pas quand elle n’existe pas.
      - claim: >-
          La date limite des connaissances signifie que les faits intégrés au modèle s’arrêtent à une
          date, et que tout ce qui est postérieur doit être fourni ou récupéré.
        why: >-
          Les questions sur des événements ou des versions récents obtiennent des réponses plausibles
          mais
          périmées, sauf si l’apprenant sait qu’il doit apporter les faits.
        example: >-
          Pour connaître la version actuelle d’une bibliothèque logicielle, l’apprenant colle le journal
          des modifications ou demande à l’outil de la chercher, au lieu d’accepter le numéro dont le
          modèle se souvient.
      - claim: >-
          La flagornerie est le modèle qui donne raison à la personne en face de lui : la formulation
          de
          l’apprenant façonne donc la réponse.
        why: >-
          Une question orientée produit une réponse orientée, qui ressemble à une confirmation sans en
          être une.
        example: >-
          Au lieu de « ce plan est solide, non ? », l’apprenant demande « quelles sont les trois
          objections les plus fortes à ce plan ? » et compare les deux réponses.
  - id: concepts/explains-models/explains-grounding
    statement: Explique ce qu’apportent l’ancrage et la récupération, et ce qu’ils ne corrigent pas
    level: base
    behaviors:
      - claim: >-
          La récupération place des documents pertinents dans la fenêtre de contexte au moment de la
          question : le modèle répond ainsi à partir d’un texte qu’il voit, au lieu de ce qu’il a
          mémorisé.
        why: >-
          Sans cela, les apprenants s’attendent à un modèle « entraîné sur nos documents », et la
          différence décide de ce qu’un document périmé ou manquant fait à la réponse.
        example: >-
          Quand un assistant produit donne un prix dépassé, l’apprenant demande quel document il a
          récupéré, au lieu de demander que le modèle soit réentraîné.
      - claim: >-
          L’ancrage réduit les faits inventés sur le matériau récupéré, sans empêcher le modèle de mal
          le
          lire ou de combler des vides en dehors de lui.
        why: >-
          Un système ancré produit toujours un texte fluide, et un résumé faux d’un vrai document
          ressemble à un résumé juste.
        example: >-
          L’apprenant compare le passage cité avec la réponse et découvre que le modèle a fusionné en
          une
          seule deux clauses de contrats différents.
      - claim: >-
          La récupération trouve un texte qui ressemble à la question : une question formulée avec
          d’autres mots que le document peut donc le manquer, et la recherche par mots-clés le manque
          le
          plus souvent.
        why: >-
          Le savoir transforme « l’assistant ne connaît pas notre politique » en « reformuler ou corriger
          l’index », un problème que l’on peut résoudre.
        example: >-
          L’assistant dit qu’il n’a pas de politique de déplacement : l’apprenant demande alors « règles
          de remboursement des frais de mission », obtient le document, et signale l’écart de vocabulaire.
