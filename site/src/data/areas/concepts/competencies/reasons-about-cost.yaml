id: concepts/reasons-about-cost
area: concepts
statement: Raisonne sur ce que coûte une requête à un modèle, et pourquoi
topics: [concepts/tokens-and-cost, concepts/what-is-an-agent]
objectives:
  - id: concepts/reasons-about-cost/reads-token-counts
    statement: Lit le nombre de jetons d’une requête et dit d’où vient son coût
    level: base
    behaviors:
      - claim: >-
          L’apprenant distingue les jetons d’entrée des jetons de sortie dans un rapport d’utilisation
          et
          sait qu’un jeton de sortie coûte plus cher.
        why: >-
          Les deux types n’ont pas le même prix : un même total peut donc correspondre à des factures
          très
          différentes (@Claude docs pricing).
        example: >-
          Une tâche de résumé indique 40 000 jetons d’entrée et 500 de sortie, et l’apprenant voit que
          c’est le long document, bien plus que le court résumé, qui fait l’essentiel du coût.
      - claim: L’apprenant trouve la partie de l’entrée qui a été lue depuis le cache.
        why: >-
          L’entrée lue depuis le cache est facturée à une petite fraction du prix normal : le nombre
          d’entrée seul surestime donc le coût (@Claude docs prompt-caching).
        example: >-
          Un rapport indique 30 000 jetons lus depuis le cache et 800 nouveaux jetons d’entrée, et
          l’apprenant explique que l’essentiel de la requête était identique à la précédente.
      - claim: L’apprenant regarde les nombres avant de deviner pourquoi une tâche a coûté cher.
        why: >-
          Les nombres montrent quelle partie de la requête a grandi, et une supposition accuse en général
          la mauvaise partie.
        example: >-
          L’apprenant pensait que les longues réponses posaient problème, et les nombres montrent que
          le
          coût vient d’un gros document joint à chaque message.
  - id: concepts/reasons-about-cost/explains-growing-cost
    statement: Explique pourquoi une session coûte plus cher par requête à mesure qu’elle s’allonge
    level: base
    behaviors:
      - claim: >-
          L’apprenant explique que l’outil envoie toute la conversation avec chaque requête, et que chaque
          requête transporte donc tout le texte qui la précède.
        why: >-
          Le modèle est sans état : un long historique est donc payé de nouveau à chaque requête (@Claude
          Code costs).
        example: >-
          Quand on lui demande pourquoi une question d’une ligne, tard dans une longue conversation, a
          utilisé autant de jetons, l’apprenant répond que la question a été envoyée avec une heure
          d’historique.
      - claim: L’apprenant ouvre une nouvelle conversation pour une tâche sans rapport.
        why: >-
          L’ancien historique s’ajoute au coût de chaque nouvelle requête et n’aide en rien la nouvelle
          tâche.
        example: >-
          Après avoir terminé le rapport, l’apprenant ouvre une nouvelle conversation pour le courriel
          sans rapport, au lieu de continuer dans la longue.
      - claim: >-
          L’apprenant compte les requêtes qu’envoie un agent, plus nombreuses que les prompts qu’il a
          tapés.
        why: >-
          Un agent envoie une nouvelle requête après chaque résultat d’outil, et chacune transporte
          l’historique (@Claude Code agent loop).
        example: >-
          L’apprenant voit une instruction déclencher une douzaine d’appels d’outils et s’attend à une
          douzaine de requêtes dans le rapport d’utilisation.
  - id: concepts/reasons-about-cost/chooses-effort-level
    statement: Choisit un niveau d’effort pour un type de travail et le garde fixe
    level: base
    behaviors:
      - claim: >-
          L’apprenant choisit un niveau d’effort bas pour un travail simple et bien défini, et un niveau
          plus élevé pour les problèmes difficiles ou ouverts.
        why: >-
          Un effort plus élevé dépense plus de jetons en réflexion et en usage d’outils, et un travail
          simple n’y gagne rien (@Claude docs effort).
        example: >-
          La remise en forme d’une liste d’adresses tourne à effort bas, et la comparaison des clauses
          de
          deux contrats à effort élevé.
      - claim: L’apprenant essaie un niveau sur quelques exemples réels du travail avant de
          l’adopter.
        why: >-
          Le bon niveau dépend de la tâche, et le fournisseur lui-même conseille de tester sur son propre
          travail.
        example: >-
          L’apprenant lance trois requêtes typiques à effort moyen et à effort élevé, ne voit aucune
          différence de qualité, et garde le niveau moyen.
      - claim: >-
          L’apprenant garde le niveau fixe au sein d’une conversation et ne le change qu’entre deux types
          de travail.
        why: >-
          Changer le niveau d’effort entre deux requêtes peut invalider le cache du prompt : la requête
          suivante réécrit alors tout l’historique dans le cache, à un prix supérieur au prix d’entrée
          normal (@Claude docs effort) (@Claude docs pricing).
        example: >-
          L’apprenant fixe le niveau au début de la session de relecture et n’y touche plus, et il utilise
          un autre niveau dans une session de rédaction distincte.
  - id: concepts/reasons-about-cost/explains-prompt-caching
    statement: Explique ce qu’économise la mise en cache du prompt et ce qui la casse
    level: expert
    behaviors:
      - claim: >-
          L’apprenant explique qu’une requête ne réutilise le cache que si elle commence par exactement
          les mêmes jetons qu’une requête récente.
        why: >-
          Le cache stocke la partie initiale d’une requête, et toute différence arrête la correspondance
          à
          cet endroit (@Claude docs prompt-caching).
        example: >-
          L’apprenant explique pourquoi deux requêtes avec le même long document, mais une première
          instruction différente, écrivent toutes deux le document dans le cache au lieu de le lire.
      - claim: >-
          L’apprenant place au début d’une requête ce qui reste identique, et à la fin ce qui change.
        why: >-
          Une modification invalide le cache à partir de ce point : changer un texte proche du début gâche
          donc tout ce qui suit.
        example: >-
          L’apprenant place le document de référence partagé avant la question, pour que la question
          suivante réutilise le document depuis le cache.
      - claim: >-
          L’apprenant nomme ce qui casse le cache : des instructions ou des outils modifiés, un réglage
          modifié comme le niveau d’effort, et une pause plus longue que la durée de vie du cache.
        why: >-
          Chacun de ces éléments fait payer de nouveau à la requête suivante tout ce qui suit la
          modification (@Claude Code costs).
        example: >-
          Après une longue pause déjeuner, le premier message de l’ancienne session coûte bien plus que
          celui d’avant la pause, et l’apprenant sait pourquoi.
