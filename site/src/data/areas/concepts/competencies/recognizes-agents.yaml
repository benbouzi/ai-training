id: concepts/recognizes-agents
area: concepts
statement: Reconnaît un agent, ses outils et son degré d’autonomie
topics: [concepts/what-is-an-agent, concepts/limits]
objectives:
  - id: concepts/recognizes-agents/tells-agent-from-assistant
    statement: >-
      Distingue un assistant conversationnel d’un agent par ce qu’il peut faire sans qu’on le lui
      demande
    level: base
    behaviors:
      - claim: >-
          Un assistant produit un texte sur lequel une personne agira, et un agent effectue des actions
          au
          moyen d’outils et décide seul de la suite.
        why: >-
          Les deux demandent un traitement différent, et traiter un agent comme une simple fenêtre de
          conversation, c’est ne pas remarquer ce qu’il a fait.
        example: >-
          Un robot conversationnel qui rédige un courriel est un assistant. Un outil qui lit la boîte
          de
          réception, rédige des réponses et les envoie sans nouveau prompt est un agent.
      - claim: >-
          L’apprenant fait la différence en demandant ce que le système peut faire sans nouveau prompt,
          quelle que soit son interface.
        why: >-
          Une fenêtre de conversation peut servir de façade à un agent, et un bouton peut déclencher un
          simple appel au modèle : l’interface ne dit donc rien.
        example: >-
          Deux produits affichent tous deux une fenêtre de conversation, et l’apprenant demande
          « exécute-t-il la requête lui-même, ou me donne-t-il la requête ? » et les classe différemment.
      - claim: L’apprenant nomme les outils d’un agent avant de juger ce qu’il peut faire.
        why: >-
          La portée d’un agent, c’est sa liste d’outils, et un agent de recherche doté d’un navigateur
          présente un autre risque qu’un agent doté d’un navigateur et d’un outil de courriel.
        example: >-
          En lisant la page de présentation du produit, l’apprenant liste « recherche web, lecture de
          fichiers, écriture dans l’agenda » et note que l’écriture dans l’agenda est l’outil qui agit
          sur
          les autres.
  - id: concepts/recognizes-agents/places-on-autonomy-scale
    statement: Place un produit ou un processus sur l’échelle d’autonomie
    level: base
    behaviors:
      - claim: >-
          L’apprenant place un processus d’après qui décide de l’étape suivante : une personne à chaque
          étape, le système avec approbation à certaines étapes, ou le système seul.
        why: >-
          L’autonomie porte sur qui prend les décisions, et la quantité de texte produite par le modèle
          n’en dit rien.
        example: >-
          L’autocomplétion d’un éditeur est peu autonome même quand elle écrit une fonction entière, parce
          que la personne accepte chaque suggestion.
      - claim: >-
          L’apprenant sait dire ce qui ferait monter ou descendre un processus d’un cran sur l’échelle.
        why: >-
          L’autonomie est un choix de conception, et voir le curseur rend ce choix visible au lieu
          d’accepter le réglage par défaut du produit.
        example: >-
          « Si l’agent fusionnait aussi la pull request au lieu de l’ouvrir, il passerait de supervisé
          à
          autonome. »
      - claim: L’apprenant place différemment le même produit selon sa configuration.
        why: >-
          La plupart des produits d’agents ont des réglages de permission, et c’est le réglage qui décide
          de l’autonomie.
        example: >-
          Un agent de code en mode « demander avant chaque modification » et le même agent en mode
          « accepter automatiquement » se placent à des points différents de l’échelle.
  - id: concepts/recognizes-agents/names-the-loop
    statement: Décrit la boucle observer, réfléchir, agir et les outils qu’elle contient
    level: base
    behaviors:
      - claim: >-
          L’apprenant décrit la boucle ainsi : l’agent observe (lit un résultat), réfléchit (décide de
          l’étape suivante), agit (appelle un outil), et recommence jusqu’à décider qu’il a terminé.
        why: >-
          Nommer la boucle rend le comportement de l’agent prévisible et indique où une étape peut mal
          tourner (@Academy claude-platform-101).
        example: >-
          En regardant un agent de code, l’apprenant commente : « il a lancé les tests, lu l’échec, et
          maintenant il modifie le fichier ».
      - claim: >-
          L’apprenant sait nommer les outils utilisés lors d’une exécution donnée et ce qu’a été chaque
          observation.
        why: >-
          Un appel d’outil est l’endroit où l’agent touche le monde : la liste des outils est donc la
          liste de ce qui peut avoir des effets de bord.
        example: >-
          À partir d’une transcription, l’apprenant liste « deux recherches web, un fichier lu, un fichier
          écrit » et note que l’écriture est l’étape à vérifier.
      - claim: >-
          L’apprenant sait que la boucle se termine soit parce que l’agent décide qu’il a fini, soit parce
          qu’une limite l’arrête, et il sait dire lequel des deux s’est produit.
        why: >-
          « Arrêté parce que le budget était épuisé » et « arrêté parce que c’est fini » appellent des
          suites différentes.
        example: >-
          Un agent qui se termine avec un fichier à moitié écrit et sans résumé a atteint une limite :
          l’apprenant vérifie donc le journal au lieu de se fier à la sortie.
  - id: concepts/recognizes-agents/follows-one-prompt
    statement: >-
      Suit un prompt à travers ses requêtes au modèle et nomme la partie de l’agent derrière chaque
      étape
    level: base
    behaviors:
      - claim: >-
          L’apprenant découpe le traitement d’un prompt en requêtes au modèle, une nouvelle après chaque
          résultat d’outil, et dit où se termine chaque requête.
        why: >-
          Chaque requête est un appel complet au modèle avec tout l’historique, et un prompt adressé à
          un
          agent en déclenche souvent beaucoup (@Claude Code agent loop).
        example: >-
          Pour « trouve les factures du mois dernier et fais-en le total », l’apprenant liste une requête
          qui demande une recherche, une autre qui demande d’ouvrir deux fichiers, et une dernière qui
          écrit la réponse.
      - claim: >-
          L’apprenant dit, pour chaque étape, si c’est le modèle, le harnais ou l’environnement qui l’a
          faite.
        why: >-
          Les trois parties échouent de façons différentes : savoir quelle partie a fait une étape montre
          où regarder quand l’étape tourne mal.
        example: >-
          « Le modèle a choisi de chercher, le harnais a vérifié la permission et exécuté la recherche,
          et
          le lecteur partagé a renvoyé trois fichiers. »
      - claim: >-
          L’apprenant explique que le modèle ne se souvient des étapes précédentes que parce que le
          harnais les renvoie avec chaque requête.
        why: >-
          Le modèle est sans état : tout ce que le harnais omet disparaît pour le modèle (@Claude docs
          messages).
        example: >-
          Quand on lui demande comment l’agent connaissait le contenu d’un fichier lu deux étapes plus
          tôt, l’apprenant répond que le texte du fichier faisait partie de l’historique de la requête
          suivante.
