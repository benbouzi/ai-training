id: concepts/assistant-or-agent
title: Assistant ou agent ?
description: >-
  Séparer le modèle du logiciel qui l’entoure, appliquer un test qui distingue un assistant d’un
  agent quelle que soit l’interface, nommer les parties du harnais, et lister les outils d’un
  agent avant de juger sa portée.
mode: explanation
covers: concepts/what-is-an-agent
serves: [concepts/recognizes-agents/tells-agent-from-assistant]
introduces: [model-vs-agent, harness]
assumes:
  - objective: concepts/recognizes-agents/names-the-loop
    lesson: concepts/agent-loop
    section: un-modèle-dans-une-boucle-avec-deux-outils
after: [concepts/agent-loop]
shorts: []
exercise:
  kind: judge
  brief: >-
    Trouver cinq produits ou fonctions d’IA que vous utilisez ou qu’on vous a proposés, classer
    chacun d’après ce qu’il peut faire sans nouveau prompt, et lister les outils de ceux qui sont
    des agents.
sources: [AEC-01, DLAI-11, Academy claude-platform-101]
issue: 143
minutes: 12
notes: >-
  Foundations page with no fixture: every example is prose about products, and the checkpoints
  classify product descriptions. The page opens with "In the last lesson" about concepts/agent-loop,
  which is live, so assumes names its first section. AEC-01 is cited for ideas in our own words, so
  THIRD_PARTY.md gets no new entry. DLAI-11 and Academy claude-platform-101 are linked and paraphrased
  only.
