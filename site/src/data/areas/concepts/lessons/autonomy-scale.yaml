id: concepts/autonomy-scale
title: Qui décide de l’étape suivante
description: >-
  Placer un produit ou un processus sur l’échelle d’autonomie en demandant qui décide de l’étape
  suivante, voir un même agent de code occuper trois points selon trois réglages de permission, et
  nommer l’étape qui fait monter ou descendre un processus.
