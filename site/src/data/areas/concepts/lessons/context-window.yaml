id: concepts/context-window
title: Ce que le modèle peut voir
description: >-
  Mesurer une page de texte en jetons et calculer combien de pages contient une fenêtre de
  contexte, pour qu’une longue conversation qui se contredit trouve son explication.
mode: tutorial
covers: concepts/how-models-work
serves: [concepts/explains-models/explains-generation]
introduces: [context-window]
assumes:
  - objective: concepts/explains-models/explains-generation
    lesson: concepts/how-models-work
    section: le-texte-devient-des-jetons
  - objective: concepts/explains-models/explains-generation
    lesson: concepts/how-models-work
    section: un-jeton-à-la-fois
  - objective: concepts/explains-models/explains-generation
    lesson: concepts/how-models-work
    section: doù-viennent-les-scores
  - objective: concepts/explains-models/names-failure-modes
    lesson: concepts/how-models-work
    section: les-défaillances-nommées
extends-to:
  - label: Ce que coûte chaque jeton
    href: /concepts/what-tokens-cost/
  - label: D’où vient la mémoire
    href: /concepts/memory/
after: [concepts/how-models-work]
shorts: [comment un tokeniseur découpe le texte (pourquoi compter les lettres échoue)]
exercise:
  kind: do
  brief: >-
    Compter les jetons d’une page de votre propre texte avec le compteur de la page, et lire combien
    de pages de ce type remplissent une fenêtre d’une taille donnée.
sources:
  - AEC-02
  - Academy ai-capabilities-and-limitations
minutes: 12
proofs:
  - concepts/context-window/count_tokens.py
  - concepts/context-window/pages_per_window.py
notes: >-
  The counter widget (TokenCounter) is a port of the two fixtures, and its text box starts with
  site/examples/concepts/context-window/sample/notes.txt, the file count_tokens.py counts. The
  fixtures are in proofs, so mise run examples fails when they print a line the two text fences
  don't show (#238).
