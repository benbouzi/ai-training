id: concepts/iterating-on-a-prompt
title: Changer le prompt avant de réessayer
description: >-
  Un résumé oublie les décisions d’une réunion. Nommer le manque, changer une ligne du prompt,
  comparer avec l’essai précédent, et faire entrer dans un gabarit enregistré la correction faite
  deux fois.
mode: tutorial
covers: concepts/prompting
serves: [concepts/prompts-reliably/iterates-on-output]
introduces: [iteration]
assumes:
  - objective: concepts/prompts-reliably/structures-a-prompt
    lesson: concepts/prompt-anatomy
    section: linstruction
  - objective: concepts/prompts-reliably/structures-a-prompt
    lesson: concepts/prompt-anatomy
    section: format-et-longueur
  - objective: concepts/explains-models/explains-generation
    lesson: concepts/how-models-work
    section: un-jeton-à-la-fois
extends-to:
  - label: Les endroits où un modèle invente
    href: /concepts/thin-path/
after: [concepts/structured-output]
shorts: [garder un gabarit de prompt]
exercise:
  kind: do
  brief: >-
    Faire passer un prompt de résumé par trois essais, en changeant une chose par essai, et tenir un
    journal de trois lignes sur ce que chaque changement a corrigé.
sources: [DLAI-1, DLAI-3, Academy ai-fluency-framework-foundations]
minutes: 15
