id: concepts/memory
title: D’où vient la mémoire
description: >-
  Décomposer l’expression « il s’en est souvenu » en ce qui a été stocké et ce qui a été relu,
  voir comment une longue session dérive à mesure que sa fenêtre se remplit, et choisir résumer,
  repartir de zéro ou récupérer pour en sortir.
mode: explanation
covers: concepts/grounding
serves:
  - concepts/explains-models/explains-grounding
  - concepts/explains-models/explains-generation
introduces: [short-and-long-term-memory, context-rot]
assumes:
  - objective: concepts/explains-models/explains-generation
    lesson: concepts/context-window
    section: ce-que-contient-la-fenêtre
  - objective: concepts/explains-models/explains-generation
    lesson: concepts/what-tokens-cost
    section: la-règle-enfouie
  - objective: concepts/explains-models/explains-grounding
    lesson: concepts/retrieval
    section: dabord-chercher-ensuite-répondre
after: [concepts/retrieval, concepts/what-tokens-cost]
shorts: []
exercise:
  kind: judge
  brief: >-
    Lire une longue transcription, marquer l’endroit où les réponses commencent à dériver, et dire
    lequel des trois remèdes (résumer, repartir de zéro ou récupérer) aurait aidé.
sources:
  - AEC-05
  - Academy ai-capabilities-and-limitations
  - Claude Code memory
  - Claude Code context window
  - Claude support memory
  - Liu 2024
sources-checked: 2026-09-26
review-by: 2027-03-26
issue: 152
minutes: 12
notes: >-
  Context rot is the session-level decline as the window fills with old turns and tool output;
  concepts/what-tokens-cost covers instruction dilution inside one prompt or file. Foundations page,
  so the learner runs nothing, and the exercise transcript is written for the lesson and marked
  illustrative on the page. No fixture backs it. The Claude Code claims (instruction files and auto
  memory loaded at the start of every session, auto memory on by default, automatic compaction near
  the limit that replaces the conversation with a summary) were checked against the two cited pages
  on 2026-09-24. No context size is quoted. The Claude chat memory claims (notes saved on topics while
  you chat, on by default on Free, Pro, and Max, off on Team and Enterprise until an owner turns it
  on, topics listed in settings to read, change, or delete) were checked against the cited help
  center page on 2026-09-26.
