id: concepts/one-example
title: Montrer un exemple
description: >-
  Remplacer un paragraphe de règles de mise en forme par une seule paire complète entrée-sortie,
  voir le modèle copier le motif, et apprendre quand montrer un exemple, quand décrire, et combien
  d’exemples donner.
mode: tutorial
covers: concepts/prompting
serves: [concepts/prompts-reliably/structures-a-prompt]
introduces: [few-shot-example]
assumes:
  - objective: concepts/explains-models/explains-generation
    lesson: concepts/how-models-work
    section: un-jeton-à-la-fois
  - objective: concepts/prompts-reliably/structures-a-prompt
    lesson: concepts/prompt-anatomy
    section: linstruction
  - objective: concepts/prompts-reliably/structures-a-prompt
    lesson: concepts/prompt-anatomy
    section: marquer-la-frontière
  - objective: concepts/prompts-reliably/structures-a-prompt
    lesson: concepts/prompt-anatomy
    section: format-et-longueur
extends-to:
  - label: Une sortie que l’étape suivante peut utiliser
    href: /concepts/structured-output/
  - label: Le prompt avant la conversation
    href: /concepts/system-prompt/
after: [concepts/prompt-anatomy]
shorts: [quand un exemple enseigne la mauvaise chose]
exercise:
  kind: do
  brief: >-
    Remplacer un paragraphe de règles de mise en forme par un seul exemple complet et comparer les
    deux sorties.
sources:
