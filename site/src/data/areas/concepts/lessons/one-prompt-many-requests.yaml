id: concepts/one-prompt-many-requests
title: Un prompt, de nombreuses requêtes
description: >-
  Suivre un prompt adressé à un agent à travers toutes les requêtes au modèle qu’il déclenche,
  voir ce qu’envoie le harnais à chaque fois et ce qui revient de l’environnement, et apprendre
  pourquoi le modèle a besoin de tout l’historique à chaque requête.
mode: explanation
covers: concepts/what-is-an-agent
serves: [concepts/recognizes-agents/follows-one-prompt]
introduces: [environment, model-request, stateless-model]
assumes:
  - objective: concepts/recognizes-agents/names-the-loop
    lesson: concepts/agent-loop
    section: observer-réfléchir-agir
extends-to:
  - label: Comment fonctionne la boucle d’agent
    href: https://code.claude.com/docs/en/agent-sdk/agent-loop
after: [concepts/agent-loop]
shorts: []
exercise:
  kind: judge
  brief: >-
    Suivre un prompt adressé à un agent à travers son journal, compter les requêtes au modèle qu’il
    a déclenchées, et dire pour chaque requête ce qu’a envoyé le harnais et ce qui est revenu de
    l’environnement.
sources: [Claude Code agent loop, Claude docs messages]
issue: 682
minutes: 12
sources-checked: 2026-10-07
review-by: 2027-04-07
notes: >-
  Picks up the loop where concepts/agent-loop leaves it and slows it down to single requests, so the
  tokens-and-cost lessons can rely on the model being stateless. "Turn" keeps the meaning the live
  lessons give it, one round trip inside the loop: a request, its reply and the tool run that follows.
  Where the Messages API says turn for one message, the page says message. Foundations page, so the
  learner runs nothing, and every log is a text fence. The first log is the first transcript of
  concepts/agent-loop rewritten as what the harness sent, and the page says it was written for the
  lesson. No fixture, because no number on the page is computed: the request and history counts are
  read off the logs. Sections later lessons can point at: what-is-in-each-request (the three parts of
  a request and the growing history, for concepts/reading-token-counts),
  the-model-keeps-nothing-between-requests (stateless-model) and model-harness-environment. The
  harness concept stays introduced by concepts/assistant-or-agent, the next lesson. This page names it
  as the software that sends the requests and runs the tools, and the back references in
  assistant-or-agent now name the toy agent lesson as the lesson before last. The objective covers
  three ideas (counting requests, statelessness, and which part did a step), so the three review
  alternates are all on one short run and together test all three ideas. Changed from the plan:
  extends-to links the vendor agent loop page.
