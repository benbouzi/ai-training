id: concepts/straight-answer
title: Obtenir une réponse franche
description: >-
  Pourquoi un modèle fait l’éloge de votre plan et cède quand on le conteste, comment une question
  orientée produit une réponse orientée, et trois façons de poser la question pour que la réponse
  vous apprenne quelque chose.
mode: tutorial
covers: concepts/limits
serves: [concepts/explains-models/names-failure-modes]
introduces: [sycophancy]
assumes:
  - objective: concepts/explains-models/explains-generation
    lesson: concepts/how-models-work
    section: un-jeton-à-la-fois
  - objective: concepts/explains-models/names-failure-modes
    lesson: concepts/how-models-work
    section: les-défaillances-nommées
extends-to:
  - label: Repérer une hallucination
    href: /safety/spotting-hallucination/
after: [concepts/thin-path]
shorts: []
exercise:
  kind: do
  brief: >-
    Poser une question orientée et une question neutre sur le même plan, puis demander les
    objections les plus fortes, et comparer les trois réponses.
sources: [Sharma 2023]
