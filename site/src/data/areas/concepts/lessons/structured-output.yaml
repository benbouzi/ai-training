id: concepts/structured-output
title: Une sortie que l’étape suivante peut utiliser
description: >-
  Demander à un assistant conversationnel des actions à mener sous forme de champs nommés avec des
  valeurs autorisées, vérifier le résultat avec le programme qui doit le lire, et corriger le
  prompt jusqu’à ce qu’il passe.
mode: tutorial
covers: concepts/prompting
serves: [concepts/prompts-reliably/asks-for-structure]
introduces: [structured-output]
assumes:
  - objective: concepts/prompts-reliably/structures-a-prompt
    lesson: concepts/prompt-anatomy
    section: linstruction
  - objective: concepts/prompts-reliably/structures-a-prompt
    lesson: concepts/prompt-anatomy
    section: marquer-la-frontière
  - objective: concepts/prompts-reliably/structures-a-prompt
    lesson: concepts/prompt-anatomy
    section: format-et-longueur
extends-to:
  - label: Changer le prompt avant de réessayer
    href: /concepts/iterating-on-a-prompt/
after: [concepts/prompt-anatomy]
shorts: []
exercise:
  kind: do
  brief: >-
    Demander des champs nommés avec des valeurs autorisées, coller le résultat dans le vérificateur
    de la page, et corriger le prompt jusqu’à ce qu’il passe.
sources:
  - Academy building-with-the-claude-api
  - DLAI-1
minutes: 12
proofs:
