id: concepts/thin-path
title: Les endroits où un modèle invente
description: >-
  Pourquoi un même modèle donne un résumé fiable et une référence inventée le même après-midi,
  quelles tâches méritent une vérification par sondage et lesquelles une vérification de chaque
  élément précis, et comment nommer les deux propriétés derrière une réponse fausse permet de
  choisir la correction.
mode: explanation
covers: concepts/limits
serves: [concepts/explains-models/names-failure-modes]
introduces: []
assumes:
  - objective: concepts/explains-models/explains-generation
    lesson: concepts/how-models-work
    section: un-jeton-à-la-fois
  - objective: concepts/explains-models/explains-generation
    lesson: concepts/how-models-work
    section: doù-viennent-les-scores
  - objective: concepts/explains-models/names-failure-modes
    lesson: concepts/how-models-work
    section: les-défaillances-nommées
after: [concepts/how-models-work]
shorts: [vérifier une référence]
exercise:
  kind: judge
  brief: >-
    Pour cinq tâches, décider s’il faut sonder ou vérifier chaque élément précis, et pour une
    réponse fausse, nommer les deux propriétés qui se sont rencontrées pour la produire.
sources: [Academy ai-capabilities-and-limitations, Academy ai-fluency-framework-foundations]
minutes: 15
notes: >-
  Introduces no concept: deepens hallucination and knowledge-cutoff, which how-models-work
  introduces and grades. Adds where fabrication concentrates (specifics, rare topics, recent
  events), the task-placing Sort decided in the triage of #86, and the two-properties Scenario.
  The citation in the second illustrative answer and in the pitfall is invented and was checked
  against the web on 2026-09-21 (twice, after a surname swap in review): no such authors, title or
  workshop exists.
