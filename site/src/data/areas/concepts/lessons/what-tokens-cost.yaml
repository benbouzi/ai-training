id: concepts/what-tokens-cost
title: Ce que coûte chaque jeton
description: >-
  Calculer le prix d’un prompt court et d’un prompt long sur un petit et un grand modèle, voir
  pourquoi la réponse et la taille du modèle fixent la facture et l’attente, et retrouver la règle
  qu’un long fichier d’instructions a enfouie.
mode: tutorial
covers: concepts/limits
serves: [concepts/explains-models/explains-generation]
introduces: [model-family-and-size, cost-and-latency, instruction-dilution]
assumes:
  - objective: concepts/explains-models/explains-generation
    lesson: concepts/how-models-work
    section: un-jeton-à-la-fois
  - objective: concepts/explains-models/names-failure-modes
    lesson: concepts/how-models-work
    section: les-défaillances-nommées
  - objective: concepts/explains-models/explains-generation
    lesson: concepts/context-window
    section: quand-les-premiers-faits-sortent-de-la-fenêtre
after: [concepts/context-window]
shorts: [pourquoi les longs fichiers d’instructions échouent]
exercise:
  kind: do
  brief: >-
    Calculer le prix d’un prompt long et d’un prompt court avec le compteur de jetons et une grille
    de prix pour un petit et un grand modèle, puis retrouver la règle qu’un long fichier
    d’instructions a enfouie.
sources:
  - Claude docs pricing
  - Claude docs models-overview
  - Academy ai-capabilities-and-limitations
  - AEC-02
  - Liu 2024
sources-checked: 2026-09-24
review-by: 2027-03-24
issue: 137
minutes: 15
proofs: [concepts/what-tokens-cost/price_prompts.py]
notes: >-
  Dilution here is about one instruction competing with the text after it, in one prompt or file.
  Context rot (concepts/memory) is the session-level effect of a filling window. The price table
  uses round example numbers for "a small model" and "a large model" and quotes no vendor price. The
  pricing structure it describes (per million tokens, one input price and a higher output price, a
  large model several times a small one) was checked against the Claude Platform pricing page on
  2026-09-24, and the example numbers match no price row on that page. The fixture
  site/examples/concepts/what-tokens-cost/price_prompts.py is the source of every number in the two
  text fences. It is listed in proofs, so mise run examples fails when it prints a line those
  fences don't show (#497). The instruction file and the meeting notes are illustrative.
