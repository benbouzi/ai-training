id: concepts/grounding
area: concepts
name: Ancrage et mémoire
definition: >-
  Un modèle ne connaît que ses données d’entraînement et ce qui se trouve dans sa fenêtre de
  contexte. L’ancrage fournit les faits dont une tâche a besoin au moment de la question, le plus
  souvent en récupérant des documents. La mémoire transporte l’information d’un tour et d’une
  session à l’autre. Ce thème explique les deux, ce qu’ils corrigent, ce qu’ils ne corrigent pas,
  et comment un contexte encombré se dégrade.
concepts:
  - id: retrieval-rag
    name: Récupération (RAG)
    definition: >-
      Génération augmentée par récupération (retrieval-augmented generation) : avant que le modèle
      réponde, une recherche trouve les passages les plus pertinents pour la question et les colle
      dans le prompt, pour que la réponse puisse s’appuyer sur des documents que le modèle n’a jamais
      vus à l’entraînement. C’est ainsi que les assistants répondent sur vos fichiers ou sur le wiki
      d’une entreprise. Sa qualité est bornée par la recherche, et des passages hors sujet produisent
      des réponses fausses et assurées.
  - id: grounding
    name: Ancrage
    definition: >-
      Le fait de rattacher la réponse d’un modèle aux sources qui lui ont été données, plutôt qu’à ce
      dont il se souvient. Une réponse ancrée cite le passage sur lequel elle s’appuie et le dit quand
      les sources ne couvrent pas la question. L’ancrage réduit l’hallucination sur le matériau
      fourni, sans pousser le modèle à vérifier les faits de lui-même, et il ne peut pas corriger une
      source fausse.
  - id: short-and-long-term-memory
    name: Mémoire à court et à long terme
    definition: >-
      La mémoire à court terme est la fenêtre de contexte en cours : tout ce qui a été dit et vu dans
      cette session, effacé à sa fin. La mémoire à long terme est tout ce qui est écrit hors de la
      fenêtre et relu plus tard, comme des fichiers de notes, des résumés ou une base de données que
      l’agent interroge. Les modèles n’ont pas d’autre mémoire : « il s’en est souvenu » signifie
      toujours que quelque chose a été stocké puis relu.
  - id: context-rot
    name: Dégradation du contexte
    definition: >-
      Le déclin des performances d’un modèle à mesure que sa fenêtre de contexte se remplit d’anciens
      tours, de sorties d’outils et d’instructions périmées. Les détails importants se perdent parmi
      les autres, les premières instructions sont suivies moins fidèlement et les réponses dérivent.
      Les longues sessions et les gros documents collés en sont la cause. Le remède consiste à garder
      un contexte court et choisi : résumer, repartir de zéro, ou ne récupérer que ce qui est
      nécessaire.
