id: concepts/how-models-work
area: concepts
name: Fonctionnement des modèles de langage
definition: >-
  Un modèle de langage transforme le texte en jetons, prédit le jeton suivant à partir de tout ce
  qu’il a vu jusque-là, et recommence jusqu’à s’arrêter. Ce thème couvre les éléments de cette
  boucle : les jetons, la fenêtre de contexte qui borne ce que le modèle peut voir, la séparation
  entre entraînement et inférence, les compromis entre familles et tailles de modèles, et la façon
  dont les réglages d’échantillonnage façonnent la sortie.
concepts:
  - id: token
    name: Jeton
    definition: >-
      L’unité qu’un modèle de langage lit et écrit (token en anglais). Un jeton est un morceau de
      texte, souvent un fragment de mot, un signe de ponctuation ou un mot courant, choisi par un
      tokeniseur fixe. Le prix, les limites et la durée des modèles se comptent en jetons, quel que
      soit le nombre de mots ou de caractères. Une règle approximative pour l’anglais est de trois à
      quatre caractères par jeton : une page de texte fait donc quelques centaines de jetons.
  - id: context-window
    name: Fenêtre de contexte
    definition: >-
      Le nombre maximal de jetons qu’un modèle peut prendre en compte à la fois, en comptant les
      instructions, la conversation jusque-là, les documents collés et la réponse en cours. Ce qui est
      hors de la fenêtre n’existe pas pour le modèle. Une fenêtre plus grande coûte plus cher par
      appel, et rien ne garantit que le modèle utilise aussi bien tout ce qu’elle contient.
  - id: training-vs-inference
    name: Entraînement et inférence
    definition: >-
      L’entraînement est la phase unique et coûteuse pendant laquelle les poids d’un modèle sont
      ajustés sur un vaste corpus de textes jusqu’à ce qu’il prédise bien. L’inférence est chaque
      utilisation ultérieure du modèle figé pour produire une sortie. Rien de ce que vous tapez
      pendant l’inférence ne modifie les poids : le modèle ne « se souvient » que de ce qui se trouve
      dans la fenêtre de contexte en cours.
  - id: model-family-and-size
    name: Famille et taille de modèle
    definition: >-
      Les fournisseurs publient leurs modèles par familles de plusieurs tailles. Les plus grands
      raisonnent en général mieux et suivent plus fidèlement des instructions complexes, mais ils
      coûtent plus cher et répondent plus lentement. Les plus petits sont moins chers et plus rapides,
      et ils suffisent souvent pour des tâches étroites et bien définies. Choisir un modèle, c’est
      adapter la taille à la difficulté du travail.
  - id: sampling-and-temperature
    name: Échantillonnage et température
    definition: >-
      À chaque étape, le modèle dispose d’une probabilité pour chaque jeton suivant possible et en
      choisit un par tirage. La température met ces probabilités à l’échelle : des valeurs basses font
      choisir presque à chaque fois le jeton le plus probable, des valeurs élevées répartissent le
      choix sur des options moins probables. Une température basse donne une sortie régulière et
      prudente, une température élevée donne de la variété au prix de davantage d’erreurs.
