id: concepts/limits
area: concepts
name: Capacités et limites
definition: >-
  Les modèles de langage s’expriment avec aisance et ont de vastes connaissances, et ils échouent
  de façons prévisibles. Ce thème nomme les défaillances auxquelles un utilisateur doit
  s’attendre : l’invention assurée, une connaissance qui s’arrête à une date, des réponses qui
  varient d’un essai à l’autre, un accord qui flatte au lieu d’informer, des instructions qui
  s’estompent à mesure que le contexte se remplit, et le coût et le délai qui augmentent avec
  chaque jeton.
concepts:
  - id: hallucination
    name: Hallucination
    definition: >-
      Une sortie fluide et assurée, mais fausse : une référence inventée, une fonction qui n’existe
      pas, une date plausible qui est fausse. Elle se produit parce que le modèle prédit un texte
      probable, sans vérifier les faits, et qu’il n’a aucun signal intégré pour « je ne sais pas ».
      L’hallucination est la plus probable sur les éléments précis, les sujets rares et tout ce que le
      modèle ne peut pas aller chercher.
  - id: knowledge-cutoff
    name: Date limite des connaissances
    definition: >-
      La date après laquelle s’arrêtent les données d’entraînement d’un modèle. Les événements, les
      versions et la documentation postérieurs à cette date sont inconnus du modèle, sauf s’ils sont
      collés dans le contexte ou récupérés par un outil. Un modèle répond souvent quand même sur des
      choses récentes, à partir de schémas plus anciens : la date limite est donc une source courante
      et discrète de réponses fausses.
  - id: non-determinism
    name: Non-déterminisme
    definition: >-
      Le même prompt peut produire des réponses différentes d’un essai à l’autre, parce que la sortie
      est tirée dans des probabilités. Même à la température la plus basse, de petites différences
      dans le service peuvent changer les résultats. Une bonne réponse ne prouve donc pas qu’un prompt
      est fiable, et tout processus fondé sur un modèle a besoin de contrôles qui tolèrent la
      variation.
  - id: sycophancy
    name: Flagornerie
    definition: >-
      La tendance d’un modèle à donner raison à l’utilisateur, à faire l’éloge de son idée ou à
      changer une réponse juste quand on la conteste, parce que les textes conciliants ont été
      récompensés pendant l’entraînement (sycophancy en anglais). La flagornerie fait d’un modèle un
      mauvais juge de votre propre travail, sauf si vous demandez explicitement des critiques, cachez
      votre préférence ou lui faites plaider l’autre camp.
  - id: cost-and-latency
    name: Coût et latence
    definition: >-
      Chaque jeton lu ou écrit coûte de l’argent et du temps. Les longs prompts, les gros documents,
      les grands modèles et les agents à plusieurs étapes multiplient les deux. La latence augmente
      avec la longueur de la sortie, parce que les jetons sont produits un à la fois. Coût et latence
      expliquent pourquoi un modèle plus petit ou un prompt plus court est souvent le bon choix
      technique, même quand un modèle plus grand répondrait un peu mieux.
  - id: instruction-dilution
    name: Dilution des instructions
    definition: >-
      L’affaiblissement d’une instruction à mesure que du texte s’accumule après elle dans la fenêtre
      de contexte. Une règle énoncée une fois au début est en concurrence avec tout ce qui a été dit
      depuis : dans une longue conversation ou un long fichier d’instructions, le modèle suit
      certaines règles et en abandonne d’autres sans bruit. C’est pourquoi les fichiers d’instructions
      courts marchent mieux que les longs, et pourquoi une règle qui doit toujours valoir a sa place
      dans un contrôle mécanique.
  - id: factuality-and-faithfulness
    name: Factualité et fidélité
    definition: >-
      Deux types d’hallucination que distingue la recherche sur le sujet. Une erreur de factualité se
      trompe sur le monde, comme une date inventée ou une référence qui n’existe pas. Une erreur de
      fidélité s’écarte de ce que la personne a donné au modèle : elle ignore une instruction,
      contredit le document fourni ou se contredit elle-même. La première se repère en consultant une
      source extérieure, la seconde en comparant la sortie avec l’entrée.
