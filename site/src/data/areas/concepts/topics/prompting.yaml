id: concepts/prompting
area: concepts
name: Rédaction de prompts
definition: >-
  Rédiger un prompt, c’est écrire le texte auquel un modèle répond. Un bon prompt énonce
  clairement l’instruction, fournit des exemples quand le format compte, fixe un rôle ou un prompt
  système qui encadre toute la conversation, demande une sortie dans une forme utilisable, et
  s’améliore par une itération réfléchie plutôt que par des essais répétés.
concepts:
  - id: instruction
    name: Instruction
    definition: >-
      La partie d’un prompt qui dit quoi faire. Une instruction claire nomme la tâche, l’entrée à
      laquelle elle s’applique, les contraintes à respecter et ce à quoi ressemble un bon résultat. Le
      modèle comble une instruction vague avec des valeurs par défaut plausibles : la plupart des
      échecs d’un prompt remontent donc à quelque chose que l’instruction n’a pas dit.
  - id: few-shot-example
    name: Exemple (few-shot)
    definition: >-
      Une ou plusieurs paires complètes entrée-sortie placées dans le prompt pour que le modèle puisse
      en copier le motif. Les exemples few-shot sont le moyen le plus fiable de fixer un format, un
      ton ou un comportement face à un cas particulier difficile à décrire avec des mots. Deux ou
      trois exemples bien choisis valent en général mieux qu’un long paragraphe de règles, et un
      mauvais exemple enseigne l’erreur tout aussi bien.
  - id: role-and-system-prompt
    name: Rôle et prompt système
    definition: >-
      Un texte placé avant le début de la conversation, qui encadre chaque tour suivant. Un prompt
      système attribue en général un rôle, fixe un ton, énonce des règles permanentes et liste ce que
      le modèle ne doit jamais faire. Dans les produits conversationnels, c’est le fournisseur qui
      l’écrit, sans que vous le voyiez. Dans les agents et les applications sur mesure, c’est le
      développeur qui l’écrit, et c’est là que l’on corrige un comportement récurrent.
  - id: iteration
    name: Itération
    definition: >-
      Améliorer un résultat en modifiant le prompt après avoir lu la sortie, au lieu de renvoyer le
      même prompt dans l’espoir d’un meilleur tirage. Chaque essai ajoute une contrainte manquante, un
      exemple de l’échec, ou une définition plus précise de ce qui est attendu. L’itération est la
      façon normale d’obtenir un prompt fiable, et une première tentative qui marche est l’exception.
  - id: structured-output
    name: Sortie structurée
    definition: >-
      Demander au modèle de répondre dans une forme fixe, comme un tableau, une liste numérotée avec
      des champs nommés, ou un format lisible par une machine comme JSON, pour que l’étape suivante
      puisse utiliser le résultat sans qu’une personne le remette en forme. Nommer les champs et
      donner un exemple de la forme rend la sortie bien plus régulière et rend visibles les
      informations manquantes.
