id: concepts/tokens-and-cost
area: concepts
name: Jetons, coût et effort
definition: >-
  Chaque requête à un modèle est comptée et facturée en jetons. Ce thème couvre les nombres
  qu’indique une requête, la raison pour laquelle chaque requête d’une longue session coûte plus
  que la précédente, la façon dont la mise en cache du prompt rend peu coûteux le début inchangé
  d’une requête, et la façon dont un réglage d’effort arbitre entre minutie et nombre de jetons.
concepts:
  - id: input-and-output-tokens
    name: Jetons d’entrée et de sortie
    definition: >-
      Les deux nombres qu’indique chaque réponse. Les jetons d’entrée couvrent tout ce que la requête
      a envoyé : instructions, descriptions d’outils, historique et nouveau message. Les jetons de
      sortie couvrent ce que le modèle a écrit, demandes d’outils et réflexion comprises, et chacun
      coûte plusieurs fois le prix d’un jeton d’entrée. Avec la mise en cache du prompt, le nombre
      d’entrée se découpe encore en jetons écrits dans le cache, jetons lus depuis le cache, et le
      reste. Lire ces nombres montre d’où vient le coût d’une requête.
  - id: growing-session-cost
    name: Coût croissant d’une session
    definition: >-
      Comme le modèle est sans état, chaque requête d’une session renvoie toute la conversation, et un
      agent envoie une nouvelle requête après chaque lot de résultats d’outils. Chaque requête
      transporte donc tout ce qui la précède, et une question posée tard dans une longue session coûte
      plus cher que la même question dans une nouvelle session. Repartir de zéro pour une tâche sans
      rapport remet l’historique à zéro, et le compactage le réduit au prix d’une grosse requête de
      résumé.
  - id: prompt-caching
    name: Mise en cache du prompt
    definition: >-
      La réutilisation du traitement de la partie initiale d’une requête quand une requête ultérieure
      commence par exactement les mêmes jetons. La partie réutilisée est facturée à une petite
      fraction du prix d’entrée normal. La partie initiale suit un ordre fixe : descriptions d’outils,
      puis prompt système, puis messages. Après une modification, tout ce qui suit ce point est remis
      en cache, à un prix supérieur au prix d’entrée normal. Un cache inutilisé expire au bout de cinq
      minutes, ou au bout d’une heure à un prix d’écriture plus élevé.
  - id: effort-level
    name: Niveau d’effort
    definition: >-
      Un réglage qui indique au modèle combien de jetons consacrer à une réponse, de bas à max. Un
      effort plus élevé donne plus de réflexion et un usage des outils plus minutieux, et il coûte
      plus de jetons et de temps. Un effort plus bas est plus rapide et moins cher, et il convient au
      travail simple. Le réglage oriente le modèle sans fixer de limite stricte, et sur au moins un
      modèle il ne change pas de façon fiable la longueur de la réponse. Le modifier au cours d’une
      conversation peut invalider le cache du prompt.
