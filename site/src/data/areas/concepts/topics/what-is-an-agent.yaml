id: concepts/what-is-an-agent
area: concepts
name: Ce qu’est un agent
definition: >-
  Un agent est un modèle placé dans une boucle avec des outils : au-delà de répondre, il peut
  chercher des informations, agir, observer le résultat et décider de la suite. Ce thème distingue
  le modèle de l’agent construit autour de lui, explique les outils et la boucle, et présente
  l’échelle qui va de « il suggère » à « il agit sans surveillance ».
concepts:
  - id: model-vs-agent
    name: Modèle ou agent
    definition: >-
      Un modèle reçoit du texte et produit du texte, une fois. Un agent est un logiciel qui appelle un
      modèle à plusieurs reprises, lui donne des outils, lui renvoie les résultats des outils et
      s’arrête quand un objectif est atteint. Le modèle apporte le jugement, et l’agent apporte les
      mains, la mémoire et la boucle. L’essentiel de ce qui rend un agent utile ou dangereux se trouve
      dans le logiciel qui entoure le modèle.
  - id: tool
    name: Outil
    definition: >-
      Une fonction que l’agent peut demander à exécuter, décrite au modèle par son nom, son usage et
      ses paramètres. Lire un fichier, chercher sur le web, lancer une commande ou appeler une API
      sont des outils. Le modèle n’exécute rien lui-même : il émet une demande, l’agent l’exécute et
      renvoie le résultat. Les outils permettent à un agent d’atteindre ce qui se trouve au-delà de sa
      fenêtre de contexte.
  - id: agent-loop
    name: Boucle d’agent
    definition: >-
      Le cycle que suit un agent : observer l’état actuel, réfléchir à ce qu’il faut faire, agir au
      moyen d’un outil, observer le résultat, recommencer. La boucle se termine quand le modèle dit
      avoir terminé, quand une limite d’étapes est atteinte ou quand une personne intervient. Tout ce
      que fait un agent, en bien ou en mal, est un certain nombre de tours de cette boucle.
  - id: degree-of-autonomy
    name: Degré d’autonomie
    definition: >-
      Ce qu’un agent peut faire avant qu’une personne ne le voie. À une extrémité, il ne fait que
      suggérer. Plus loin, il agit mais demande avant tout ce qui est irréversible. À l’autre
      extrémité, il tourne sans surveillance. L’autonomie est un réglage choisi pour une tâche, et le
      bon niveau dépend du coût d’une erreur et de la facilité avec laquelle on peut l’annuler.
  - id: harness
    name: Harnais
    definition: >-
      Le logiciel qui entoure le modèle et en fait un agent : la boucle, les définitions d’outils, les
      vérifications de permissions, le prompt système, la gestion du contexte et les règles d’arrêt.
      Deux agents qui utilisent le même modèle peuvent se comporter très différemment parce que leurs
      harnais diffèrent. Quand un agent se comporte mal, la correction se trouve le plus souvent dans
      le harnais.
  - id: environment
    name: Environnement
    definition: >-
      Les fichiers, programmes, services et données sur lesquels agissent les outils d’un agent. Le
      modèle choisit une action, le harnais l’exécute, et l’effet se produit dans l’environnement : un
      fichier change, une commande s’exécute, un message part. L’environnement est la troisième partie
      d’un agent, à côté du modèle et du harnais. Ce qu’il contient décide de ce que l’agent peut
      atteindre et de ce qu’une erreur peut endommager : une copie de test limite donc les deux.
  - id: model-request
    name: Requête au modèle
    definition: >-
      Un appel du harnais au modèle, qui transporte les instructions, les descriptions d’outils et
      l’historique jusque-là, et qui reçoit une réponse. Un seul prompt d’une personne déclenche
      souvent de nombreuses requêtes. Le modèle demande un outil, le harnais l’exécute et envoie le
      résultat dans une nouvelle requête, et cela se répète jusqu’à ce que le modèle réponde sans
      demander d’outil. Chacun de ces allers-retours est un tour de la boucle d’agent.
  - id: stateless-model
    name: Modèle sans état
    definition: >-
      Le modèle ne garde rien d’une requête à l’autre. Chaque requête doit transporter tout ce que le
      modèle doit prendre en compte : le harnais renvoie donc toute la conversation à chaque fois. Ce
      qui ressemble à la mémoire de l’agent est du texte que le harnais stocke et renvoie, ou des
      notes qu’il écrit dans des fichiers et relit plus tard. Effacer ou raccourcir ce texte change
      immédiatement ce que sait le modèle.
