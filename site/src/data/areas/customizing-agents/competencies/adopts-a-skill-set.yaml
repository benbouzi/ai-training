id: customizing-agents/adopts-a-skill-set
area: customizing-agents
statement: Adopte un jeu de skills publié sans perdre le contrôle du projet
topics: [customizing-agents/skills, customizing-agents/instructions,
      customizing-agents/hooks-permissions]
notes: >-
  A later lesson on picking and taking up a skills framework would serve this
  competency.
objectives:
  - id: customizing-agents/adopts-a-skill-set/vets-a-skill-set
    statement: >-
      Examine un jeu de skills publié avant de l’installer, comme il le ferait pour une dépendance
    level: base
    behaviors:
      - claim: L’apprenant vérifie la licence du jeu et de chaque skill qu’il compte utiliser.
        why: >-
          Une même collection peut mélanger les licences, avec des skills open source à côté de skills
          dont le code est seulement consultable (@anthropics skills).
        example: >-
          L’apprenant découvre que les skills de documents d’une collection ont un code seulement
          consultable, et n’utilise que celles sous licence Apache dans le dépôt de l’équipe.
      - claim: >-
          L’apprenant regarde qui maintient le jeu, quand il a changé pour la dernière fois et comment
          ses
          modifications sont publiées.
        why: >-
          Un jeu de skills est du code qui s’exécute à chaque session, et un jeu que personne ne maintient
          s’éloigne de l’agent pour lequel il a été écrit.
        example: >-
          L’apprenant voit des versions régulières avec un journal des modifications et un suivi des
          tickets ouvert, et note la version qu’il a relue.
      - claim: L’apprenant lit chaque skill, chaque script et chaque hook du jeu avant de
          l’installer.
        why: >-
          Les hooks et les scripts d’un plugin s’exécutent dans les sessions de l’apprenant avec les
          permissions de la session (@Claude Code plugins).
        example: >-
          Une skill lance un script d’installation qui écrit dans le dossier personnel, donc l’apprenant
          lit le script avant de décider.
      - claim: >-
          L’apprenant compare le jeu aux autres possibilités, y compris écrire lui-même les quelques
          skills dont il a besoin.
        why: >-
          Un jeu de trente skills apporte trente descriptions et trente choses à tenir à jour, et l’équipe
          n’a peut-être besoin que de trois d’entre elles.
        example: >-
          L’apprenant écrit sa propre skill de revue à partir des deux idées qui lui ont plu, et
          n’installe pas toute la collection.
  - id: customizing-agents/adopts-a-skill-set/adopts-skills-gradually
    statement: Adopte quelques skills à la fois et vérifie l’effet et le coût en contexte de chacune
    level: base
    behaviors:
      - claim: >-
          L’apprenant active une ou deux skills à la fois et les utilise sur un vrai travail avant d’en
          ajouter d’autres.
        why: >-
          Avec un seul changement à la fois, un résultat meilleur ou pire peut être relié à la skill qui
          l’a causé.
        example: >-
          L’apprenant utilise la skill de planification pendant une semaine de tickets avant d’essayer
          la
          skill de revue du même jeu.
      - claim: L’apprenant vérifie combien de contexte les skills installées ajoutent à chaque
          session.
        why: >-
          La description de chaque skill invoquée par le modèle est chargée dans chaque session, que la
          skill serve ou non (@Claude Code skills).
        example: >-
          Le détail du contexte montre que les descriptions de skills ont grossi après l’installation,
          donc l’apprenant rend deux skills rarement utilisées invocables par l’utilisateur seulement.
      - claim: L’apprenant retire une skill qui n’a pas changé les résultats.
        why: Une skill sans effet coûte quand même du contexte et doit quand même être tenue à jour.
        example: >-
          Au bout de deux semaines, la skill de messages de commit produisait les mêmes messages qu’avant,
          donc l’apprenant la désinstalle.
  - id: customizing-agents/adopts-a-skill-set/keeps-the-project-in-charge
    statement: >-
      Garde les instructions, les hooks et les permissions du projet aux commandes quand un jeu de
      skills les contredit
    level: base
    behaviors:
      - claim: >-
          Quand une skill contredit les instructions du projet, l’apprenant modifie ou abandonne la skill
          et laisse les instructions telles qu’elles sont.
        why: >-
          Quand deux instructions se contredisent, l’agent peut suivre l’une ou l’autre, donc la
          contradiction doit être supprimée (@Claude Code memory).
        example: >-
          Une skill dit de committer après chaque modification, le projet dit de committer une fois par
          tâche, et l’apprenant retire cette étape de sa copie de la skill.
      - claim: >-
          L’apprenant garde l’application des règles dans les hooks et les permissions du projet, et
          aucune skill ne les élargit.
        why: >-
          Une skill est un texte que l’agent lit, et seuls les hooks et les règles de permission imposent
          quoi que ce soit (@Claude Code best practices).
        example: >-
          Une skill demande la permission de lancer n’importe quelle commande shell, et l’apprenant garde
          la liste d’autorisation étroite en n’y ajoutant que la commande dont la skill a besoin.
      - claim: L’apprenant fige la version du jeu et relit chaque mise à jour avant de la prendre.
        why: >-
          Une mise à jour change ce qui s’exécute dans chaque session, et une version figée ne change
          que
          quand quelqu’un décide qu’elle doit changer (@Claude Code plugin install).
        example: >-
          L’équipe désactive les mises à jour automatiques de la place de marché et lit les modifications
          de chaque nouvelle version avant de déplacer la version figée.
