id: customizing-agents/connects-tools-safely
area: customizing-agents
statement: Connecte un agent à des outils et à des données en sécurité
topics: [customizing-agents/mcp, customizing-agents/hooks-permissions, safety/agent-risk,
      customizing-agents/inspecting-the-agent]
objectives:
  - id: customizing-agents/connects-tools-safely/adds-a-tool
    statement: Ajoute un outil par MCP ou par une CLI avec le moindre privilège
    level: base
    behaviors:
      - claim: >-
          L’apprenant ajoute le plus petit outil qui fait le travail, avec un accès en lecture seule quand
          la tâche ne fait que lire.
        why: >-
          Les permissions d’un outil sont ce que l’agent, ou une instruction injectée, peut faire avec
          lui.
        example: >-
          Le suivi des tickets est connecté avec un jeton qui peut lire et commenter, mais ne peut ni
          fermer ni supprimer.
      - claim: >-
          L’apprenant choisit entre un serveur MCP et une CLI selon ce dont l’agent a besoin et ce que
          coûte chacun.
        why: >-
          La liste d’outils d’un serveur MCP est dans le contexte à chaque tour, et une CLI n’est appelée
          que quand elle sert et demande un shell.
        example: >-
          Pour deux requêtes occasionnelles, l’apprenant utilise la CLI. Pour un outil que l’agent appelle
          sans cesse avec des entrées structurées, il utilise un serveur MCP.
      - claim: >-
          L’outil est ajouté avec une tâche de test, et la transcription est lue avant de l’utiliser sur
          un vrai travail.
        why: >-
          La première utilisation montre ce que l’agent croit que fait l’outil, qui peut différer de ce
          qu’il fait.
        example: >-
          L’apprenant demande à l’agent de « lister les tickets ouverts », le voit appeler l’outil avec
          le
          mauvais filtre, puis corrige la description.
  - id: customizing-agents/connects-tools-safely/weighs-tool-cost
    statement: Explique le coût en jetons et le risque d’un outil avant de l’ajouter
    level: base
    behaviors:
      - claim: >-
          Avant d’ajouter un outil, l’apprenant sait dire combien de jetons prennent ses définitions et
          sur combien de tours elles sont payées.
        why: >-
          Les définitions d’outils voyagent avec chaque requête, et un outil utilisé une fois coûte à
          chaque tour où il est présent.
        example: >-
          L’apprenant mesure que les quarante schémas d’outils d’un serveur ajoutent plusieurs milliers
          de
          jetons par tour, et ne garde que les trois outils dont la tâche se sert.
      - claim: >-
          L’apprenant nomme ce que l’outil permet à l’agent de faire qu’il ne pouvait pas faire avant,
          et
          ce qu’une instruction injectée pourrait en faire.
        why: >-
          Le risque d’un outil, ce sont ses capacités entre de mauvaises mains, et toute page web que
          lit
          l’agent peut contenir une instruction injectée.
        example: >-
          Un outil qui publie dans une discussion est ce qui transforme un résumeur en lecture seule en
          voie d’exfiltration, donc il n’est ajouté que là où publier est la tâche.
      - claim: L’apprenant compare l’outil à la possibilité de n’avoir aucun outil.
        why: >-
          Beaucoup d’outils enveloppent quelque chose que l’agent pourrait lire dans un fichier ou par
          une
          commande.
        example: >-
          À la place d’un serveur MCP de documentation, la documentation est versionnée dans le dépôt
          et
          l’agent la lit.
  - id: customizing-agents/connects-tools-safely/hardens-a-connection
    statement: Protège une connexion d’outil contre l’injection et l’exfiltration
    level: expert
    behaviors:
      - claim: >-
          L’apprenant traite chaque résultat d’outil comme une entrée non fiable pour le modèle, et
          conçoit la connexion en supposant qu’un résultat contiendra un jour des instructions.
        why: >-
          Tout ce que l’outil lit dans le monde peut porter une instruction injectée, et le modèle ne
          peut
          pas le savoir.
        example: >-
          L’outil de récupération web retire les scripts et marque sa sortie comme « contenu de la page
          »,
          et les outils sensibles de l’agent demandent une approbation quand une récupération a eu lieu
          dans le même tour.
      - claim: >-
          Les capacités d’envoi vers l’extérieur sont soumises à approbation ou retirées sur tout agent
          qui lit du contenu non fiable.
        why: >-
          L’exfiltration, c’est lire puis envoyer, et l’envoi est la partie que vous pouvez contrôler.
        example: >-
          L’agent de recherche a la récupération web et l’écriture de fichiers, sans outil de courriel
          ni
          de discussion, et l’écriture de fichiers est limitée à un dossier.
      - claim: >-
          Les identifiants donnés à un outil sont limités, de courte durée et séparés de ceux de la
          personne.
        why: Un jeton d’agent divulgué ne devrait coûter qu’une révocation, rien de plus.
        example: >-
          Le serveur MCP tourne avec un compte de service qui peut lire les tickets d’un seul projet,
          et
          le jeton expire chaque jour.
      - claim: >-
          L’apprenant journalise les appels d’outil et leurs arguments, et les relit pendant les premières
          semaines de l’outil.
        why: >-
          Une injection se voit comme un appel qui n’avait aucun sens pour la tâche, et seul un journal
          le
          montre.
        example: >-
          Le journal montre que l’agent a essayé de récupérer une URL qui contenait le contenu d’un
          fichier, et l’apprenant remonte jusqu’à un commentaire planté dans un README.
  - id: customizing-agents/connects-tools-safely/inspects-requests
    statement: >-
      Inspecte les requêtes pour voir ce que coûtent les outils et le contexte, et garde les journaux
      de requêtes en local
    level: expert
    behaviors:
      - claim: >-
          L’apprenant journalise les requêtes d’une session et mesure ce qu’ajoutent chaque description
          d’outil, chaque fichier et chaque instruction.
        why: >-
          Une supposition sur ce qui remplit le contexte est souvent fausse, et la requête journalisée
          le
          montre exactement (@Claude Code llm gateway).
        example: >-
          Le journal montre que les descriptions d’outils d’un serveur font un cinquième de chaque
          requête, donc l’apprenant le déconnecte dans les projets qui ne s’en servent pas.
      - claim: >-
          L’apprenant garde les journaux de requêtes et les journaux de session sur des machines que
          l’équipe contrôle, et les supprime quand ils ne servent plus.
        why: >-
          Ils contiennent tout ce que l’agent a lu, y compris le contenu des fichiers et tout secret qu’il
          a affiché (@Claude Code claude directory).
        example: >-
          L’apprenant fait tourner la passerelle de journalisation sur sa propre machine, et efface ses
          journaux à la fin de l’enquête.
      - claim: >-
          L’apprenant n’active la journalisation complète des requêtes que pour l’enquête, et la désactive
          ensuite.
        why: >-
          C’est pour cette raison que la supervision omet par défaut le contenu des prompts et des
          requêtes (@Claude Code monitoring).
        example: >-
          L’apprenant règle la variable qui exporte le corps brut des requêtes pour un après-midi, et
          la
          retire de ses réglages le soir même.
