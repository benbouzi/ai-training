id: customizing-agents/allowlists
title: Autoriser les commandes dont la tâche a besoin
description: >-
  Faites deux fois une petite tâche avec un agent de code, d’abord sans rien de préapprouvé, puis
  avec une liste d’autorisation pour la commande de test et les fichiers qu’elle modifie, et
  retirez ensuite chaque règle que l’exécution n’a jamais utilisée.
mode: tutorial
covers: customizing-agents/hooks-permissions
serves: [customizing-agents/configures-agent/sets-permissions]
introduces: [allowlists]
assumes:
  - objective: safety/judges-agent-risk/names-blast-radius
    lesson: safety/agent-risk
    section: le-rayon-dimpact
sources-checked: 2026-09-23
review-by: 2027-03-23
after: [customizing-agents/permission-modes]
shorts: ["Comment un motif joker élargit une liste d’autorisation au-delà de la commande qui a provoqué
      la\a demande"]
exercise:
  kind: do
  brief: >-
    Partez de zéro autorisation, autorisez la commande de test et les commandes de gestion de
    versions en lecture seule, terminez la tâche de l’exemple, puis retirez chaque entrée dont la
    transcription montre qu’elle n’a pas servi.
sources: [Claude Code permissions, Claude Code permission modes]
minutes: 15
notes: >-
  The fixture task reuses the first-session to-do directory, copied and given its own first commit,
  with a new `clear` command so a learner who did the permission-modes lesson starts from a fresh
  change. Both runs are in Manual mode: "deny by default" in the plan brief means an empty allowlist,
  because a mode that denies instead of prompting would hide the prompts the first section is about.
  The read-only git entries in the allowlist are on purpose redundant (Claude Code runs read-only git
  without a prompt in every mode), so the prune step removes them from the learner's own tally. Rule
  syntax, matching and precedence come from code.claude.com/docs/en/permissions and must be
  re-checked by review-by.
