id: customizing-agents/logging-from-a-stdio-server
title: Journaliser depuis un serveur stdio
description: >-
  Cassez un serveur d’outils stdio avec une seule ligne de débogage sur la sortie standard,
  regardez le client échouer à analyser la première ligne, déplacez la ligne vers la sortie
  d’erreur standard, et lisez le journal du serveur de fichiers de référence pendant qu’un agent
  l’appelle.
mode: tutorial
covers: customizing-agents/mcp
serves: [customizing-agents/connects-tools-safely/adds-a-tool]
introduces: [stdio-logging]
assumes:
  - objective: customizing-agents/connects-tools-safely/adds-a-tool
    lesson: customizing-agents/mcp-first-server
    section: what-the-client-asks-the-server
extends-to: []
sources-checked: 2026-10-07
review-by: 2027-04-07
after: [customizing-agents/mcp-first-server]
shorts: []
exercise:
  kind: do
  brief: >-
    Trouvez pourquoi un serveur stdio casse quand il affiche une ligne de débogage, déplacez sa
    journalisation vers la sortie d’erreur standard, et lisez le journal pendant que l’agent
    l’appelle.
sources: [MCP specification, MCP deprecated features, MCP filesystem server, Claude Code mcp]
issue: 687
minutes: 10
notes: >-
  Short on purpose. The plan allowed folding it into mcp-first-server as a section, and the wave lead
  decided on a separate short lesson, because the plan file, the course position and the issue exist
  for it. mcp-first-server gets only a one-line link forward. The fixtures under
  site/examples/customizing-agents/logging-from-a-stdio-server/ reuse the stand-in of mcp-first-server
  (server.py imports stand_in.handle from ../mcp-first-server), so the broken and the fixed server
  differ in one line of their log function, and check.py is a client that reads one line of standard
  output, tries to parse it and prints standard error. The stdout and stderr rules come from the stdio
  page of MCP revision 2026-07-28 (basic/transports/stdio), and the deprecation of the in-protocol
  logging feature with its stderr replacement from the deprecated-features registry. The exercise
  connects the real reference server rather than the stand-in, because the stand-in answers neither
  initialize nor server/discover. The page cites the server's README only for roots replacing the
  allowed directories, and the recorded run is the evidence for the two log lines. Those lines were
  read from dist/index.js of @modelcontextprotocol/server-filesystem@2026.8.31 and recorded on
  2026-10-07 with a small test client that sent initialize with the roots capability and one root,
  then called a tool, and the server logged nothing for that call. The npm notice lines come from npx
  on that run, so the page says "may". No vendor page says where Claude Code shows a server's stderr,
  so the exercise redirects it to a file with sh -c and makes no claim about the client. All must be
  re-checked by review-by, the spec revision included.
