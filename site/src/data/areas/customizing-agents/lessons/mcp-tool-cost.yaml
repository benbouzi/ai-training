id: customizing-agents/mcp-tool-cost
title: Mesurer ce que coûte un serveur d’outils
description: >-
  Comptez ce que les définitions d’un serveur à vingt outils prennent à la fenêtre de contexte,
  faites passer une requête par le serveur puis par une CLI, et décidez quels outils et quels
  serveurs restent connectés.
mode: tutorial
covers: customizing-agents/mcp
serves: [customizing-agents/connects-tools-safely/weighs-tool-cost]
introduces: []
assumes:
  - objective: concepts/explains-models/explains-generation
    lesson: concepts/what-tokens-cost
    section: ce-que-coûte-un-jeton
  - objective: customizing-agents/connects-tools-safely/adds-a-tool
    lesson: customizing-agents/mcp-first-server
    section: connect-the-real-server
extends-to:
  - label: How to kill the bloat in Claude Code's system prompt (AI Hero, en anglais)
    href: https://www.aihero.dev/how-to-kill-the-bloat-in-claude-codes-system-prompt
sources-checked: 2026-10-07
review-by: 2027-04-07
after: [customizing-agents/mcp-first-server]
shorts:
  - >-
    Le chargement des outils à la demande, et pourquoi désactiver les serveurs inutilisés reste le
    bon contrôle (Academy claude-code-101)
exercise:
  kind: judge
  brief: >-
    Connectez un serveur qui a beaucoup d’outils, lisez dans le client le nombre de jetons de ses
    définitions, comparez ensuite une requête faite par le serveur avec la même requête faite par la
    CLI, et notez les deux coûts dans un court tableau.
sources:
  - MCP specification
  - MCP filesystem server
  - MCP deprecated features
  - AEC-16
  - Claude Code mcp
  - Claude Code costs
  - Claude Code context window
  - Claude Code commands
  - Claude Code permissions
  - Claude docs tool-search-tool
  - Claude Code llm gateway protocol
issue: 173
minutes: 15
notes: >-
  Introduces no concept: hands-on for tool-cost and mcp-vs-cli. The fixtures under
  site/examples/customizing-agents/mcp-tool-cost/ are a stdlib stand-in issue-tracker server over stdio
  with twenty tools (only search_issues and get_issue answer), a CLI over the same issues file, and
  three measurement scripts that estimate tokens at four characters per token, the rule of thumb from
  concepts/context-window. The second assumes entry is there because the page names the mcp-first-server
  lesson and its exercise copies that lesson's handbook fixture and server command. The tool search
  default, its upfront fallbacks and ENABLE_TOOL_SEARCH come from code.claude.com/docs/en/mcp; that every
  definition, deferred or not, is sent in the request's tools array, that defer_loading decides only
  what enters the context, and that a loaded definition stays in the conversation and counts as input
  tokens from the API's tool search page; that Claude Code sends defer_loading tool fields with tool
  search on from code.claude.com/docs/en/llm-gateway-protocol; /context from the context-window and
  commands pages; /clear from the commands page; prefer the
  CLI and disable unused servers, and prompt caching, from code.claude.com/docs/en/costs; the bare
  deny rule that removes a tool from context from code.claude.com/docs/en/permissions. The tools/list
  fields were re-checked against MCP specification revision 2026-07-28, and the deprecation of roots in
  that revision comes from its deprecated-features registry. All must be re-checked by review-by.
