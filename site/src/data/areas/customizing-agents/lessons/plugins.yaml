id: customizing-agents/plugins
title: Lire un plugin avant de l’installer
description: >-
  Lisez élément par élément un plugin de publication inventé, nommez ce que fait chaque skill,
  chaque hook, chaque sous-agent et chaque serveur dans vos sessions, et décidez de l’installer,
  d’en copier une skill ou d’y renoncer.
mode: explanation
covers: customizing-agents/skills
serves: [customizing-agents/writes-skill/evaluates-a-plugin]
introduces: [plugins]
assumes:
  - objective: coding-with-agents/verifies-agent-work/screens-for-security
    lesson: coding-with-agents/dependency-review
    section: des-principes-qui-gardent-la-revue-abordable
  - objective: customizing-agents/writes-skill/discloses-progressively
    lesson: customizing-agents/progressive-disclosure
    section: what-the-agent-reads-and-when
sources-checked: 2026-09-25
review-by: 2027-03-25
after: [customizing-agents/first-skill]
shorts: [Les places de marché et les versions figées des plugins (Academy claude-code-in-action)]
exercise:
  kind: judge
  brief: >-
    Lisez le contenu d’un plugin public et listez ce qu’il ajoute à la session : des skills, des
    hooks qui vont s’exécuter, des sous-agents, et des serveurs avec les accès qu’ils demandent,
    puis dites s’il faut l’installer ou en copier une skill.
sources:
  - Claude Code plugins
  - Claude Code plugin security
  - Claude Code plugin parts
  - Claude Code plugin install
  - Claude Code plugin manifest
  - Claude Code hooks
  - Claude Code subagents
issue: 170
minutes: 10
notes: >-
  The plugin read on the page is invented, in `site/examples/customizing-agents/plugins/release-kit/`:
  a release skill, a release-notes subagent with Bash, a PreToolUse hook on Bash that blocks a
  `git commit` without a staged CHANGELOG.md, and an HTTP MCP server at tracker.example.com with a
  bearer token. Nothing in the course runs its hook script. `inventory.py` only reads files and
  prints what a plugin directory adds, and `release_kit.py` runs it for `mise run examples`. The
  exercise plugin is hookify in the public anthropics/claude-code repository, read at commit
  e1bb7b065bc29117ab5923f8772fee16a4630a0d: one skill, four commands, one agent with Read and Grep,
  four hooks without a matcher (PreToolUse, PostToolUse, Stop, UserPromptSubmit) that read
  `.claude/hookify.*.local.md` rule files and can block, and no servers. The repository has no open
  license, so the page links it and quotes none of its text. Vendor facts to re-check by review-by:
  what a plugin holds, marketplaces, install scopes and what an enabled plugin adds to every session
  (code.claude.com/docs/en/plugins), what a plugin can run and that permission rules and the sandbox
  don't cover hooks and server processes, the review steps and `plugin details`
  (code.claude.com/docs/en/plugins/security), hook firing and namespaced skill names
  (plugins/components), auto-update defaults (plugins/install), the `version` pin
  (plugins/manifest-reference), matchers (hooks) and the default tool list of a subagent
  (sub-agents). The Academy course named in the short is not cited on the page. Since #409 the lesson
  serves `evaluates-a-plugin`. Its checkpoints and alternates share one idea: only the plugin's own
  files show what it brings into each session where it is enabled, and its hooks and server
  processes run outside the permission rules, so the reader decides from each part what to take.
