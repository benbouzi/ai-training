id: customizing-agents/project-stays-in-charge
title: Garder le projet aux commandes
description: >-
  Quand une skill installée demande un push que le projet interdit, retirez la contradiction de
  votre copie de la skill, refusez le push avec un hook PreToolUse dont la raison nomme le chemin
  permis, et voyez pourquoi un refus sans explication laisse ouvertes d’autres écritures de la
  même commande.
mode: tutorial
covers: customizing-agents/hooks-permissions
serves: [customizing-agents/adopts-a-skill-set/keeps-the-project-in-charge]
introduces: [steering-by-rejection]
assumes:
  - objective: customizing-agents/configures-agent/adds-a-hook
    lesson: customizing-agents/first-hook
    section: write-the-lockfile-check
  - objective: customizing-agents/adopts-a-skill-set/adopts-skills-gradually
    lesson: customizing-agents/adopting-a-skill-set
    section: take-two-skills-at-a-time
extends-to: []
sources-checked: 2026-10-07
review-by: 2027-04-07
after: [customizing-agents/first-hook, customizing-agents/adopting-a-skill-set]
shorts: []
exercise:
  kind: do
  brief: >-
    Quand une skill installée demande quelque chose que le projet interdit, écrivez un hook ou une
    règle de permission qui le refuse avec une raison, et vérifiez que l’agent change d’approche.
sources: [Claude Code hooks, Claude Code permissions, Claude Code skills, Claude Code memory]
issue: 689
minutes: 15
notes: >-
  Comes before subagents, which closes the part. The sources say a deny reason reaches the model
  (hooks: permissionDecisionReason for deny is shown to Claude, exit 2 routes the same way;
  permissions: a No with a Tab comment is sent as the reason, a No without one stops the turn). That
  a bare refusal invites workarounds is inferred from the "What a Bash rule doesn't match" table on
  the permissions page, and the page says so in prose and in the recap. Changes from the plan: the
  forbidden action is git push, because the permissions page's table lists three push spellings a
  Bash(git push *) rule misses. The skill `ship-branch` and the project are invented and live under
  site/examples/customizing-agents/project-stays-in-charge/; the project's instruction file is
  committed as CLAUDE.sample.md so that agents working in the course repository don't load it, and
  the skill sits outside any .claude/ folder for the same reason. The exercise adds a local bare
  repository as the remote, so a push that gets past the hook goes nowhere else. The hook uses the
  JSON deny form, which first-hook only mentions, and has no `if` field because it starts no other
  program. Besides the vendor's three spellings, the hook joins backslash-continued lines, skips
  prefix words such as env and exec, and denies when a shell expansion such as {push,} could yield
  push; sh -c, backticks, $(...), a push word held in a variable and scripts get past it, and the
  page says so. No recorded agent run is shown: the exercise has the learner compare a run with the
  reason and a stretch run with a bare "Blocked". Sources added: Claude Code skills (allowed-tools
  and that deny and ask rules win over it) and Claude Code memory (conflicting instructions). The
  event names, JSON fields and rule syntax must be re-checked by review-by.
