id: customizing-agents/settings-layering
title: D’où vient un réglage
description: >-
  Pourquoi un réglage d’agent de code semble ignoré : les fichiers de réglages dans leur ordre de
  priorité, un exemple détaillé où quatre couches divergent et où les permissions effectives sont
  déduites entrée par entrée, et ce qu’une équipe committe et ce que chacun garde en local.
mode: explanation
covers: customizing-agents/hooks-permissions
serves: [customizing-agents/configures-agent/sets-permissions]
introduces: [settings-layering]
assumes:
  - objective: customizing-agents/configures-agent/sets-permissions
    lesson: customizing-agents/allowlists
    section: run-two-write-the-allowlist
sources-checked: 2026-09-23
review-by: 2027-03-23
after: [customizing-agents/allowlists]
shorts: []
exercise:
  kind: judge
  brief: >-
    À partir d’un fichier utilisateur, d’un fichier de projet committé, d’un remplacement local et
    d’une option de session qui divergent, écrivez les permissions effectives et la couche qui a
    décidé de chaque entrée.
sources: [Claude Code settings, Claude Code permissions]
minutes: 10
notes: >-
  Explanation mode. The fixture `effective.py` is a model of two documented rules (single-value key
  takes the highest layer; rule lists merge and are read deny, ask, allow) over four layers, and the
  page says so. It reuses the trailing-wildcard Bash matching from the allowlists fixture. Nothing on
  the page claims a local file overrides a committed allow entry: the pitfall is a wider local allow
  rule merged into the effective set, which is what the settings page documents. File names,
  precedence and merging come from code.claude.com/docs/en/settings and /permissions and must be
  re-checked by review-by.
