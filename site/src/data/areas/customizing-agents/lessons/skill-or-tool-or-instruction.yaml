id: customizing-agents/skill-or-tool-or-instruction
title: Instruction, skill ou outil ?
description: >-
  Trois façons de changer ce que fait un agent, la question à se poser avant d’en choisir une, et
  ce que chacune coûte en contexte et en accès.
mode: explanation
covers: customizing-agents/skills
serves: [customizing-agents/writes-skill/chooses-skill-over-tool]
