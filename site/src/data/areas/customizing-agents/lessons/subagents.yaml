id: customizing-agents/subagents
title: Déléguer à un sous-agent avec des permissions plus étroites
description: >-
  Définissez un sous-agent relecteur en lecture seule avec ses propres instructions et sa liste
  d’outils, faites-lui déléguer par un agent de code la revue d’un petit diff, et comparez ce que
  contient le contexte principal avant et après.
mode: tutorial
covers: customizing-agents/hooks-permissions
serves: [customizing-agents/configures-agent/sets-permissions]
introduces: [subagents]
assumes:
  - objective: safety/judges-agent-risk/names-blast-radius
    lesson: safety/agent-risk
    section: le-rayon-dimpact
sources-checked: 2026-09-24
review-by: 2027-03-24
after: [customizing-agents/allowlists]
shorts:
  - >-
    Les sous-agents en parallèle, et ce que le parent voit de leur travail (Academy
    introduction-to-subagents)
exercise:
  kind: do
  brief: >-
    Définissez un sous-agent relecteur en lecture seule avec ses propres instructions et son jeu
    d’outils, faites-lui déléguer par l’agent principal la revue du diff de l’exemple, et comparez
    le contexte principal avant et après.
sources:
  - Claude Code subagents
  - Claude Code context window
  - Academy introduction-to-subagents
issue: 187
minutes: 15
notes: >-
  The diff under review is the `clear` command from the allowlists lesson, saved as
  `site/examples/customizing-agents/subagents/clear.diff` so the lesson has one fixed change to review
  and the fixture can count its lines. The reviewer file `reviewer.md` next to it is the subagent
  definition the learner copies. The reviewer has no Bash on purpose, so the learner writes the diff
  to a file for it to read. File locations, frontmatter fields, tool inheritance and what a subagent
  sees at startup come from code.claude.com/docs/en/sub-agents, and `/context` from
  code.claude.com/docs/en/context-window. Both must be re-checked by review-by. The report shown on
  the page is illustrative and the page says so.
