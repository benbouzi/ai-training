id: customizing-agents/testing-a-skill
title: Tester une skill depuis une session neuve
description: >-
  Lancez la skill de publication de la leçon sur la première skill dans un clone propre et une
  nouvelle session, lisez dans la transcription les endroits où l’agent a hésité, demandé ou
  deviné, transformez chacun en contrôle, en étape d’échec ou en test de réussite plus précis, et
  relancez-la.
mode: tutorial
covers: customizing-agents/skills
serves: [customizing-agents/writes-skill/packages-a-procedure]
introduces: []
assumes:
  - objective: coding-with-agents/ships-with-agent/runs-a-session
    lesson: coding-with-agents/first-session
    section: les-sessions-et-le-contexte
  - objective: customizing-agents/writes-skill/packages-a-procedure
    lesson: customizing-agents/first-skill
    section: pass-three-when-a-step-fails
sources-checked: 2026-09-25
review-by: 2027-03-25
extends-to:
  - label: >-
      Extend Codex Workflows, l’atelier : tester qu’une skill se lance sur la bonne demande et pas sur
      la mauvaise (OpenAI Academy, compte gratuit)
    href: https://academy.openai.com/public/courses/extend-codex-workflows-4e61p
after: [customizing-agents/first-skill]
shorts: []
exercise:
  kind: do
  brief: >-
    Lancez la skill de publication depuis une session neuve dans un clone propre, notez où l’agent a
    hésité ou demandé, et ajoutez le contrôle ou l’étape d’échec qui manquait.
sources:
  - Claude docs best-practices
  - Claude Code skills
  - Claude Code memory
issue: 165
minutes: 20
notes: >-
  Introduces no concept: deepens writing-a-good-skill: watch an agent use the skill on a real task
  and revise where it went wrong. The fixtures in `site/examples/customizing-agents/testing-a-skill/`
  build git repositories from the first-skill fixture package, which they never change, with an
  allow-list git environment. The revised skill is committed there at `release/SKILL.md`, and the
  page shows its new sections. The transcript on the page is illustrative, written by the course.
  Vendor facts to re-check by review-by: the Claude A / Claude B testing loop and the advice not to
  assume tools are installed (platform skill best-practices page), skill edits picked up in the
  running session (code.claude.com skills), and CLAUDE.md loading from parent directories and auto
  memory on by default and per repository (code.claude.com memory).
