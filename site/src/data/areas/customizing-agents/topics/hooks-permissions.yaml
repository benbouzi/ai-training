id: customizing-agents/hooks-permissions
area: customizing-agents
name: Hooks, permissions et réglages
definition: >-
  Les contrôles mécaniques autour d’un agent de code : les modes de permission qui décident de ce
  qu’il peut faire sans demander, les listes d’autorisation qui élargissent ou restreignent ce
  choix commande par commande, les hooks qui lancent vos propres scripts à des moments fixes, les
  sous-agents qui isolent du travail, et la superposition des réglages entre l’utilisateur, le
  projet et la session.
concepts:
  - id: permission-modes
    name: Modes de permission
    definition: >-
      Des niveaux prédéfinis de ce qu’un agent peut faire sans demander, de l’approbation de chaque
      modification et de chaque commande à l’exécution de tout sans surveillance, en passant par
      l’acceptation automatique des modifications avec une demande pour les commandes. Le mode fixe le
      comportement par défaut, et les listes d’autorisation l’affinent. Choisissez le mode pour chaque
      tâche selon ce que coûterait une erreur, et ne montez d’un niveau qu’à l’intérieur d’un bac à
      sable ou d’un worktree jetable.
  - id: allowlists
    name: Listes d’autorisation
    definition: >-
      Des listes explicites d’outils, de commandes ou de chemins que l’agent peut utiliser sans
      demande d’autorisation, et des listes d’interdiction qu’il ne peut jamais utiliser. Elles
      transforment une suite de demandes d’approbation en une décision prise une fois, et rendent
      cette décision relisible dans la configuration. Gardez-les étroites et précises, car un joker
      large accorde bien plus que la commande qui a provoqué la demande.
  - id: hooks
    name: Hooks
    definition: >-
      Des scripts définis par l’utilisateur que l’agent lance à des moments de son cycle de vie :
      avant ou après un appel d’outil, au début d’une session, quand l’agent termine. Un hook peut
      bloquer une action, la transformer, ou lancer un contrôle comme une mise en forme ou une
      recherche de secrets. Les hooks imposent des règles de façon déterministe là où les instructions
      ne font que demander, et leur sortie revient à l’agent pour qu’il puisse réagir.
  - id: subagents
    name: Sous-agents
    definition: >-
      Des instances d’agent séparées auxquelles l’agent principal délègue du travail, chacune avec sa
      propre fenêtre de contexte, son propre jeu d’outils et souvent ses propres instructions. Ils
      gardent hors du contexte principal le travail volumineux comme la recherche ou la revue,
      permettent de travailler en parallèle et laissent une tâche tourner avec des permissions plus
      étroites que celles de l’agent parent. Le parent ne voit que le rapport du sous-agent.
  - id: settings-layering
    name: Superposition des réglages
    definition: >-
      La configuration vient de plusieurs endroits qui se remplacent dans un ordre fixe : les réglages
      par défaut de l’utilisateur, les réglages partagés du projet committés dans le dépôt, les
      réglages locaux du projet qui ne sont pas committés, et les options d’une session. Connaître cet
      ordre explique pourquoi un réglage semble ignoré, et permet à une équipe de fournir des réglages
      par défaut sûrs pendant que chacun garde ses préférences personnelles.
  - id: steering-by-rejection
    name: Guider par le refus
    definition: >-
      Se servir d’un refus pour changer ce que l’agent fait ensuite. Quand un hook ou une personne
      bloque une action et donne une raison, la raison revient au modèle, qui peut s’adapter et
      continuer. Une raison qui nomme l’alternative permise, comme « lance la tâche de test »,
      l’oriente vers le bon chemin. Un refus sans explication le laisse deviner, et comme une règle
      sur une commande ne couvre pas les autres commandes qui ont le même effet, une supposition peut
      atteindre le résultat bloqué par un autre chemin.
