id: customizing-agents/inspecting-the-agent
area: customizing-agents
name: Voir ce que l’agent envoie
definition: >-
  Ce qu’un agent envoie au modèle est caché par défaut. Ce thème couvre la surveillance du
  remplissage du contexte pendant le travail, la lecture du journal qu’un harnais garde de chaque
  session, et la journalisation des requêtes exactes que l’agent envoie au fournisseur du modèle,
  ainsi que la raison pour laquelle chacun de ces enregistrements contient des données sensibles.
concepts:
  - id: context-meter
    name: Jauge de contexte
    definition: >-
      Une vue en direct de la part de la fenêtre de contexte qu’utilise une session. Une ligne d’état
      peut afficher la part utilisée et les jetons consommés au fil de la session, et une commande de
      contexte détaille l’usage par catégorie, comme les instructions, les outils, la mémoire et les
      messages. La surveiller montre quand une session se remplit et quels outils ou fichiers coûtent
      cher, pour que l’apprenant compacte ou recommence à neuf avant que l’agent commence à laisser
      tomber des instructions.
  - id: session-record
    name: Journal de session
    definition: >-
      Le fichier dans lequel un harnais enregistre une session, avec chaque message, chaque appel
      d’outil et chaque résultat d’outil, pour que la session puisse être reprise plus tard. C’est le
      compte rendu le plus complet de ce que l’agent a vu et fait, et l’endroit où trouver le moment
      où une exécution a mal tourné. C’est aussi du texte brut sur le disque, gardé pendant un nombre
      de jours fixé, et il contient tout ce qui est passé par un outil, y compris le contenu des
      fichiers et tout secret que l’agent a affiché.
  - id: request-logging
    name: Journalisation des requêtes
    definition: >-
      Enregistrer les requêtes exactes qu’un agent envoie au fournisseur du modèle et les réponses
      qu’il reçoit. On peut diriger l’agent vers une passerelle placée entre lui et le fournisseur,
      qui journalise chaque requête, ou régler un export de supervision pour qu’il inclue le corps
      complet des requêtes, qu’il omet par défaut. Le journal montre ce que coûte chaque description
      d’outil, chaque fichier et chaque instruction. Il contient tout ce que l’agent a lu, donc il
      reste sur des systèmes que l’équipe contrôle.
