id: customizing-agents/instructions
area: customizing-agents
name: Instructions de projet
definition: >-
  Les instructions de projet sont la consigne permanente qu’un agent lit au début de chaque
  session dans un dépôt. Ce thème couvre le fichier d’instructions et ses conventions, les
  sections qui méritent leur place, la superposition des instructions dans un monorepo, et le
  moment où une règle a besoin d’un hook ou d’un outil à la place d’une phrase.
concepts:
  - id: agents-md-claude-md
    name: AGENTS.md / CLAUDE.md
    definition: >-
      Le fichier d’instructions que les agents de code chargent automatiquement depuis la racine d’un
      dépôt. Plusieurs outils lisent un nom commun et d’autres lisent le leur, et un lien symbolique
      permet à un seul fichier de servir aux deux. Il contient ce que l’agent doit savoir à chaque
      session : les commandes, les conventions, les limites. Ce n’est pas une documentation pour les
      personnes, et il est lu à chaque tour, donc chaque ligne coûte du contexte.
  - id: sections
    name: Sections
    definition: >-
      Les parties récurrentes d’un bon fichier d’instructions : ce qu’est le projet, comment
      construire, tester et vérifier le style, l’organisation du code, les conventions à suivre, ce
      qu’il ne faut jamais faire, et comment terminer un travail. Chaque section répond à une question
      sur laquelle l’agent devinerait sinon. Retirez tout ce que l’agent peut découvrir lui-même à peu
      de frais, et gardez des exemples concrets.
  - id: monorepo-hierarchy
    name: Hiérarchie dans un monorepo
    definition: >-
      Dans un dépôt qui contient beaucoup de paquets, des fichiers d’instructions peuvent se trouver à
      la racine et dans des sous-dossiers, et l’agent lit ceux qui sont sur le chemin des fichiers sur
      lesquels il travaille. La racine contient ce qui est vrai partout, et les fichiers des
      sous-dossiers contiennent ce qui diffère. La hiérarchie garde chaque fichier court et permet aux
      équipes d’avoir leurs propres règles sans conflit.
  - id: when-instructions-are-not-enough
    name: Quand les instructions ne suffisent pas
    definition: >-
      Les instructions sont des demandes : un modèle les suit la plupart du temps et les oublie à
      mesure que le contexte se remplit. Une règle qui doit tenir à chaque fois, comme ne jamais
      committer de secrets ou toujours lancer l’outil de mise en forme, va dans un hook ou dans un
      réglage de permission qui l’impose mécaniquement. Une capacité qui manque à l’agent va dans un
      outil ou dans une skill, et un paragraphe plus long ne la lui donne pas.
  - id: loading-versus-pointing
    name: Charger ou renvoyer
    definition: >-
      Deux façons de guider un agent. Charger met le texte dans le fichier d’instructions, donc il est
      dans le contexte de chaque session, que la tâche en ait besoin ou non. Renvoyer y met une ligne
      qui dit où se trouve le détail, comme un chemin de fichier ou une skill, et l’agent le lit quand
      une tâche le demande. Chargez ce dont presque chaque tâche a besoin et renvoyez au reste. Une
      importation qui inclut un fichier au démarrage le charge quand même.
  - id: pruning-instructions
    name: Élaguer les instructions
    definition: >-
      Retirer les lignes d’un fichier d’instructions qui ne méritent plus leur place : une règle que
      l’agent suit déjà sans qu’on la lui dise, un fait qu’il peut déduire du code, une ligne qui en
      contredit une autre, une règle pour un problème qui a disparu. Le test pour chaque ligne est de
      savoir si la retirer causerait une erreur. Les règles d’un long fichier sont ignorées, donc
      élaguer fait mieux fonctionner les règles qui restent.
