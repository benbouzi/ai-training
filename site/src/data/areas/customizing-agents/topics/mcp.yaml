id: customizing-agents/mcp
area: customizing-agents
name: Connecter des outils avec MCP
definition: >-
  Le Model Context Protocol (MCP) est une façon standard d’exposer des outils et des données à un
  agent par un serveur auquel se connecte le client de l’agent. Ce thème couvre les rôles de
  serveur et de client, les transports qui les relient, les primitives qu’un serveur ou un client
  peut offrir, les cas où un simple outil en ligne de commande est le meilleur choix, ce que coûte
  un outil en jetons, et les conséquences de sécurité de sa connexion.
concepts:
  - id: server
    name: Serveur
    definition: >-
      Le processus qui expose des outils, des ressources et des prompts par le protocole. Un serveur
      enveloppe quelque chose, une base de données, une API, un système de fichiers, un navigateur, et
      décrit chaque outil avec un nom, un but et un schéma de paramètres que le modèle peut lire.
      Écrivez ou installez un serveur une fois, et tout agent conforme peut l’utiliser : c’est le but
      du protocole.
  - id: client
    name: Client
    definition: >-
      La partie de l’application de l’agent qui se connecte aux serveurs, liste les outils qu’ils
      offrent, transmet leurs descriptions au modèle, exécute les appels d’outil du modèle auprès du
      bon serveur et renvoie les résultats. Le client et l’application hôte qui l’entoure contiennent
      la configuration des connexions, les demandes d’approbation et les vérifications de permissions,
      donc c’est là qu’un utilisateur contrôle ce qu’un serveur peut faire.
  - id: transport
    name: Transport
    definition: >-
      La façon dont le client et le serveur échangent des messages. Un serveur local tourne en général
      comme un processus enfant qui communique par l’entrée et la sortie standard. Un serveur distant
      est joint en HTTP, souvent en flux continu. Le transport décide où s’exécute le code du serveur
      et quels identifiants il détient, ce qui en fait une décision de sécurité autant qu’une question
      de tuyauterie.
  - id: mcp-primitives
    name: Primitives MCP
    definition: >-
      Les fonctionnalités qu’un serveur ou un client peut offrir. Dans la révision 2026-07-28, un
      serveur offre des outils que le modèle appelle, des ressources avec un URI que l’utilisateur ou
      le modèle lit comme contexte, et des prompts que l’utilisateur choisit par leur nom. Un client
      peut offrir l’élicitation, pour qu’un serveur puisse demander plus d’informations à
      l’utilisateur. Cette révision rend obsolètes les racines (roots) et l’échantillonnage
      (sampling). Les racines nomment les dossiers qu’un client juge pertinents, et le protocole ne
      les impose pas. L’échantillonnage permet à un serveur de demander une complétion au modèle du
      client.
  - id: mcp-vs-cli
    name: MCP ou CLI
    definition: >-
      Un agent peut souvent atteindre le même système par un serveur du protocole ou en lançant un
      outil en ligne de commande (CLI) qu’il connaît déjà. Un serveur donne des outils typés, faciles
      à découvrir, et une interface stable d’un agent à l’autre. Une CLI est déjà installée, ne coûte
      aucune description d’outil dans le contexte et se vérifie facilement. Préférez la CLI quand elle
      existe et qu’elle est bonne. Ajoutez un serveur quand l’interface a besoin d’être façonnée.
  - id: tool-cost
    name: Coût d’un outil
    definition: >-
      Chaque outil connecté s’ajoute au contexte à chaque tour. Sans recherche d’outils, c’est sa
      description complète. Avec la recherche d’outils, que Claude Code utilise par défaut, seuls le
      nom de l’outil et les instructions de son serveur sont chargés jusqu’à ce que le modèle cherche
      l’outil. Chaque appel ajoute son résultat, et des résultats verbeux évincent la conversation. Ne
      connectez que les serveurs dont un projet a besoin, préférez les serveurs qui ont peu d’outils
      bien décrits, et surveillez la taille des résultats.
  - id: mcp-security
    name: Sécurité de MCP
    definition: >-
      Connecter un serveur permet à l’agent d’atteindre tout ce que le serveur peut atteindre. Les
      risques comprennent des serveurs de sources non fiables, des descriptions d’outils qui portent
      des instructions injectées, des outils qui renvoient un contenu contrôlé par un attaquant, et
      des outils qui peuvent envoyer des données vers l’extérieur. Vérifiez la source, exécutez avec
      le moindre privilège, approuvez les outils risqués appel par appel et relisez ce qui sort.
      Connectez un serveur avec votre propre identité, jamais avec un compte de service partagé, pour
      qu’il ne puisse faire que ce que vous avez le droit de faire et que ses actions remontent
      jusqu’à vous.
  - id: stdio-logging
    name: Journalisation en stdio
    definition: >-
      Sur le transport par l’entrée et la sortie standard (stdio), la sortie standard du serveur ne
      transporte que les messages du protocole, et la spécification interdit d’y écrire quoi que ce
      soit d’autre. Une instruction print égarée ou une ligne de journal d’une bibliothèque corrompt
      le flux de messages, et le client échoue de façons difficiles à retracer. Les journaux vont sur
      la sortie d’erreur standard, que le client peut capturer, afficher ou ignorer, et qu’il ne
      traite pas comme un signe d’échec.
