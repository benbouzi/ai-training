id: customizing-agents/memory
area: customizing-agents
name: Mémoire et contexte de session
definition: >-
  Un agent oublie tout à la fin d’une session, sauf si quelque chose est écrit. Ce thème couvre
  les notes de mémoire automatique, les fichiers de contexte tenus à la main, le compactage d’une
  longue session, la passation du travail d’une session à la suivante, et la transformation du
  travail que l’agent répète en savoir qu’il peut réutiliser.
concepts:
  - id: auto-memory
    name: Mémoire automatique
    definition: >-
      Des notes qu’un agent écrit pour lui-même pendant une session et relit dans les suivantes : des
      préférences qu’il a apprises, des faits sur le projet, des décisions prises. Elle évite de
      réexpliquer, mais personne ne la relit par défaut, donc elle peut transporter une hypothèse
      fausse pendant des semaines. Lisez de temps en temps ce dont l’agent se souvient, et corrigez ou
      supprimez les entrées devenues périmées.
  - id: context-files
    name: Fichiers de contexte
    definition: >-
      Des fichiers qu’une personne tient à jour pour que l’agent les lise : les instructions du
      projet, des notes de conception, un plan, un glossaire des termes du domaine. Contrairement à la
      mémoire automatique, ils sont délibérés, versionnés et relus comme du code. C’est le bon endroit
      pour tout ce que l’équipe entière veut que chaque session sache, et l’endroit où déplacer un
      fait une fois que la mémoire automatique a montré qu’il était utile.
  - id: compaction
    name: Compactage
    definition: >-
      Remplacer l’historique d’une longue session par un résumé pour que le travail continue dans la
      fenêtre de contexte. Le compactage garde l’objectif et l’état récent et laisse tomber le détail
      brut, donc tout ce qui n’est pas dans le résumé est perdu. Demandez un résumé qui nomme les
      points ouverts et les décisions avant de compacter, et enregistrez-le dans un fichier quand le
      travail s’étendra sur plusieurs sessions.
  - id: session-handoff
    name: Passation de session
    definition: >-
      Terminer une session pour que la suivante reprenne sans perte : un état écrit de ce qui a été
      fait, de ce qui reste, de ce qui a été décidé et pourquoi, et de l’endroit où se trouvent les
      fichiers concernés, enregistré dans le dépôt ou dans un fichier de plan. Une bonne passation
      permet à une session neuve, ou à celle d’un collègue, d’être productive dès le premier tour,
      sans redécouvrir le travail.
  - id: turning-repeated-work-into-reusable-knowledge
    name: Transformer le travail répété en savoir réutilisable
    definition: >-
      Remarquer quand on explique deux fois la même chose à l’agent, ou qu’on lui fait suivre deux
      fois les mêmes étapes, et la déplacer vers un endroit durable : un fait dans les instructions du
      projet, une procédure dans une skill, un contrôle dans un hook, un exemple dans un fichier de
      contexte. Chaque déplacement supprime une explication future et une erreur future. C’est la
      partie du travail avec des agents dont les gains s’accumulent.
  - id: primary-and-secondary-sources
    name: Sources primaires et secondaires
    definition: >-
      Le code, les tests et l’historique d’un dépôt sont la source primaire de ce qui est vrai sur un
      projet aujourd’hui. Les notes, les passations, les plans et les mémoires enregistrées sont
      secondaires : chacun enregistre ce que quelqu’un croyait à un moment donné, et il devient périmé
      à mesure que le code avance. Un agent traite une source secondaire comme une piste et la vérifie
      par rapport à la source primaire avant d’agir. Quand les deux divergent, le code l’emporte et la
      note est corrigée ou supprimée.
