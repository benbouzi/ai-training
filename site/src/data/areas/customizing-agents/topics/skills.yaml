id: customizing-agents/skills
area: customizing-agents
name: Skills d’agent
definition: >-
  Une skill regroupe une procédure pour qu’un agent puisse la charger et la suivre à la demande :
  une description du moment où elle s’applique, des instructions à suivre et les fichiers dont
  elle a besoin. Ce thème distingue les skills des outils et des instructions, présente la
  spécification des skills, explique la divulgation progressive et couvre ce qui fait qu’une skill
  vaut la peine d’être réutilisée.
concepts:
  - id: skill-vs-tool-vs-instruction
    name: Skill, outil ou instruction
    definition: >-
      Trois façons de changer ce que fait un agent. Une instruction est un texte permanent chargé à
      chaque session, pour les règles qui s’appliquent toujours. Un outil est une fonction que l’agent
      peut appeler, pour les capacités qui lui manquent. Une skill est une procédure chargée seulement
      quand elle est utile, pour un travail répétable en plusieurs étapes que l’agent saurait faire
      mais fait de façon irrégulière. Choisissez selon la fréquence, selon que le besoin est un savoir
      ou une capacité, et selon le coût en contexte.
  - id: skill-spec
    name: Spécification des skills
    definition: >-
      Le format ouvert d’une skill d’agent : un dossier avec un fichier de métadonnées qui nomme la
      skill, décrit quand l’utiliser et contient les instructions, accompagné de scripts et de
      fichiers de référence facultatifs. La description est ce que l’agent lit pour décider de charger
      la skill ou non, donc elle porte le déclencheur, et le corps porte la procédure. Comme le format
      est partagé, les skills passent d’un agent à l’autre.
  - id: progressive-disclosure
    name: Divulgation progressive
    definition: >-
      Organiser une skill pour que l’agent ne lise que ce dont l’étape en cours a besoin : une courte
      description toujours visible, les instructions principales chargées quand la skill est choisie,
      et des références détaillées ou des scripts ouverts seulement quand une étape les demande. Cela
      garde la fenêtre de contexte petite même avec beaucoup de skills disponibles, et place le détail
      là où il sert, au moment où il sert.
  - id: writing-a-good-skill
    name: Écrire une bonne skill
    definition: >-
      Une bonne skill a une description qui se déclenche sur les bonnes demandes et sur aucune autre,
      des étapes assez concrètes pour être suivies sans deviner, un moyen pour l’agent de vérifier son
      propre résultat, et des scripts pour tout ce qui est déterministe. On la teste en regardant un
      agent l’utiliser sur une vraie tâche et en la révisant là où il a hésité ou s’est trompé, avec
      la même boucle d’itération que pour un prompt.
  - id: plugins
    name: Plugins
    definition: >-
      L’unité de distribution des personnalisations regroupées : un plugin rassemble des skills, des
      hooks, des sous-agents et des connexions à des serveurs dans un seul paquet installable avec une
      version. Une place de marché (marketplace) est un catalogue de plugins qu’une équipe ou un
      éditeur publie pour que d’autres puissent les installer par leur nom. Installer un plugin laisse
      ses hooks s’exécuter dans vos sessions et donne à ses serveurs l’accès que vous accordez, donc
      traitez-le comme toute autre dépendance et lisez ce qu’il contient.
  - id: invocation-mode
    name: Mode d’invocation
    definition: >-
      Qui peut lancer une skill : le modèle, quand une demande correspond à la description de la
      skill, ou seulement la personne, en tapant son nom. Une skill invoquée par le modèle s’applique
      d’elle-même quand elle convient, et sa description occupe du contexte dans chaque session. Une
      skill invoquée par l’utilisateur ne coûte aucun contexte tant qu’elle n’est pas appelée et ne
      s’exécute que quand la personne le décide, ce qui convient aux procédures qui ont des effets de
      bord, comme un déploiement. Une skill peut aussi être cachée à la personne et réservée au
      modèle.
  - id: skill-scope
    name: Portée d’une skill
    definition: >-
      L’endroit où une skill est installée décide de qui l’a. Une skill personnelle se trouve dans la
      configuration de l’utilisateur et suit cette personne dans chaque projet. Une skill de projet
      est committée dans le dépôt, donc tous ceux qui y travaillent ont la même version et peuvent en
      relire les modifications. Une organisation peut aussi installer des skills pour tous ses
      utilisateurs. Quand deux skills ont le même nom, un ordre fixe décide laquelle l’emporte, et une
      skill personnelle masque une skill de projet du même nom.
  - id: published-skill-sets
    name: Jeux de skills publiés
    definition: >-
      Des collections de skills qu’un éditeur ou un développeur maintient pour que d’autres les
      installent, souvent sous forme de plugin. Les éditeurs de modèles, les fabricants d’outils et
      des développeurs indépendants en publient tous. Un jeu de ce genre est une dépendance : il
      s’exécute dans vos sessions, il change quand son auteur le met à jour, et sa licence peut varier
      d’une skill à l’autre. Jugez-le comme une bibliothèque, selon qui le maintient, son activité, ce
      qu’il contient et ce que coûterait de l’abandonner.
