id: safety/handles-data-safely
area: safety
statement: Utilise l’IA en sécurité avec des données confidentielles et personnelles
topics: [safety/responsible-use]
objectives:
  - id: safety/handles-data-safely/decides-what-to-share
    statement: Décide de ce qui peut entrer dans un prompt et de ce qui ne le peut pas
    level: base
    behaviors:
      - claim: >-
          Avant de coller, l’apprenant se demande qui peut voir le prompt, combien de temps il est
          conservé, et s’il peut servir à entraîner un modèle.
        why: >-
          Les réponses diffèrent entre un produit de conversation grand public, une offre entreprise et
          un
          modèle local, et le même copier-coller est sans risque dans l’un et constitue une fuite dans
          l’autre.
        example: >-
          Avant de coller une liste de clients, l’apprenant vérifie que les conditions de l’outil approuvé
          par l’entreprise prévoient « aucun entraînement sur les entrées », et utilise cet outil plutôt
          qu’un compte personnel.
      - claim: >-
          L’apprenant retire ou remplace les données personnelles et les secrets dont la tâche n’a pas
          besoin avant de partager le reste.
        why: >-
          La plupart des tâches fonctionnent aussi bien sur des données masquées, et ce qui n’est pas
          envoyé ne peut pas fuiter.
        example: >-
          Pour demander de l’aide sur une formule de tableur, l’apprenant remplace la colonne des noms
          par
          « Personne 1, Personne 2 » et garde les nombres.
      - claim: En cas de doute, l’apprenant traite le prompt comme un e-mail à une entreprise
          extérieure.
        why: >-
          La règle est simple à appliquer et correspond à la façon dont la plupart des organisations
          classent leurs données.
        example: >-
          L’apprenant n’enverrait pas par e-mail les chiffres trimestriels non publiés à un fournisseur,
          donc il ne les colle pas non plus, et il demande au propriétaire des données.
  - id: safety/handles-data-safely/discloses-ai-use
    statement: Mentionne l’usage de l’IA quand le public s’y attend
    level: base
    behaviors:
      - claim: >-
          L’apprenant dit que l’IA a aidé quand le public jugerait le travail autrement en le sachant.
        why: La mention sert à ne pas tromper, et le test est ce que le lecteur voudrait savoir.
        example: >-
          Un contrat traduit porte « traduit automatiquement, relu par X », et un e-mail passé au
          correcteur orthographique n’en porte pas.
      - claim: >-
          L’apprenant suit la règle de mention du lieu où va le travail, et pose la question quand il
          n’y
          en a pas.
        why: >-
          Revues, employeurs, écoles et projets open source ont des règles différentes, et en enfreindre
          une coûte plus cher que la mention.
        example: >-
          Avant de soumettre à une conférence, l’apprenant lit sa politique sur l’IA et ajoute la
          déclaration demandée.
      - claim: La mention dit ce que l’IA a fait et ce que la personne a vérifié.
        why: >-
          « Écrit avec l’IA » ne dit rien au lecteur sur ce à quoi se fier. « Rédigé par l’IA, faits
          vérifiés par moi » le lui dit.
        example: >-
          Un message de commit indique quel agent a écrit le code, et que l’auteur a lancé et lu les
          tests.
  - id: safety/handles-data-safely/respects-licenses
    statement: Respecte les licences et l’attribution dans une production assistée par l’IA
    level: base
    behaviors:
      - claim: >-
          L’apprenant traite une sortie d’IA qui reproduit une source reconnaissable comme une copie de
          cette source.
        why: >-
          Un modèle peut répéter un texte ou du code vu pendant son entraînement, et la licence de
          l’original s’applique toujours à la copie.
        example: >-
          Une fonction générée qui reprend presque mot pour mot une bibliothèque connue reçoit
          l’attribution de cette bibliothèque, ou est réécrite.
      - claim: >-
          Quand il adapte un contenu sous licence avec l’aide de l’IA, l’apprenant garde les conditions
          de
          licence et l’attribution de l’original.
        why: La transformation laisse l’obligation intacte, et l’œuvre dérivée la porte.
        example: >-
          En réécrivant un tutoriel sous CC BY-SA avec un assistant, l’apprenant garde l’attribution et
          publie le résultat sous la même licence.
      - claim: >-
          L’apprenant connaît les conditions de l’outil qu’il utilise : à qui appartient la sortie, et
          ce
          que l’outil peut faire de l’entrée.
        why: >-
          Les conditions diffèrent selon les outils et les offres, et la réponse décide si la sortie peut
          entrer dans un produit.
        example: >-
          Avant de publier des images générées dans une brochure, l’apprenant vérifie les conditions
          d’usage commercial de l’outil d’images.
