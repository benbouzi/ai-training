id: safety/judges-agent-risk
area: safety
statement: Juge le risque de laisser un agent agir
topics: [safety/agent-risk, safety/governance]
objectives:
  - id: safety/judges-agent-risk/names-blast-radius
    statement: Nomme ce que l’action d’un agent peut atteindre et casser
    level: base
    behaviors:
      - claim: >-
          Avant de laisser un agent agir, l’apprenant liste tout ce que les outils et les identifiants
          de
          l’agent peuvent atteindre, au-delà de ce dont la tâche a besoin.
        why: >-
          Un agent agit avec tout ce qu’on lui a donné, et une mauvaise étape frappe partout où cet accès
          s’étend.
        example: >-
          Quand on lui demande de laisser un agent ranger un dossier, l’apprenant remarque que l’agent
          a
          un accès en écriture à tout le lecteur partagé, et restreint cet accès d’abord.
      - claim: L’apprenant sépare les actions qu’on peut annuler de celles qu’on ne peut pas
          annuler.
        why: >-
          Une erreur réversible coûte un nouvel essai. Une erreur irréversible coûte tout ce qui a été
          envoyé, supprimé ou payé.
        example: >-
          Rédiger un e-mail est réversible, l’envoyer ne l’est pas, donc l’apprenant laisse l’agent
          rédiger et garde l’envoi pour lui.
      - claim: L’apprenant nomme les autres personnes touchées quand l’agent se trompe.
        why: >-
          Le rayon d’impact se mesure en personnes et en systèmes, et la taille de la tâche n’en dit rien.
        example: >-
          Un script qui renomme des fichiers dans un dossier personnel touche une personne. Le même script
          sur un agenda partagé touche tous les invités, et l’apprenant traite les deux cas différemment.
  - id: safety/judges-agent-risk/chooses-human-in-loop
    statement: Choisit où une personne doit approuver
    level: base
    behaviors:
      - claim: >-
          L’approbation se place juste avant l’étape irréversible ou visible de l’extérieur, et
          l’approbation d’un plan au départ ne la remplace pas.
        why: Approuver le plan au départ ne détecte pas l’erreur que l’agent fait à mi-parcours.
        example: >-
          L’agent peut lire le ticket, rédiger la réponse et proposer une étiquette, mais c’est une
          personne qui clique sur Envoyer et ferme le ticket.
      - claim: >-
          Une étape approuvée sans être lue ne contrôle rien, donc l’apprenant garde le nombre
          d’approbations assez petit pour qu’elles soient lues.
        why: >-
          Vingt demandes par minute apprennent à une personne à cliquer sur oui, ce qui revient à n’avoir
          aucune approbation, avec un coût en plus.
        example: >-
          Au lieu d’approuver chaque modification de fichier, l’apprenant approuve une fois sur le diff,
          où toutes les modifications se lisent ensemble.
      - claim: >-
          L’apprenant sait dire de quels éléments la personne qui approuve a besoin à chaque point de
          contrôle.
        why: Une personne qui approuve sans avoir les bonnes informations sous les yeux devine.
        example: >-
          À l’étape « envoyer les factures », la personne qui approuve voit le nombre, le total et trois
          lignes d’exemple, à la place d’une simple question « continuer ? ».
  - id: safety/judges-agent-risk/recognizes-injection
    statement: Reconnaît les voies d’injection de prompt et d’exfiltration de données
    level: base
    behaviors:
      - claim: >-
          L’apprenant traite tout ce que lit un agent (pages web, e-mails, fichiers, entrées d’agenda)
          comme un texte que le modèle peut suivre comme une instruction.
        why: >-
          Un modèle a un seul flux de texte et aucun canal séparé pour les « ordres de mon utilisateur
          »,
          donc une phrase placée là ressemble à n’importe quelle autre instruction.
        example: >-
          Avant de diriger un agent vers une page enregistrée en favori, l’apprenant se demande ce que
          la
          page pourrait dire à l’agent de faire avec l’accès qu’il a.
      - claim: >-
          À partir des permissions d’un agent, l’apprenant sait nommer la voie qu’une instruction placée
          là utiliserait pour faire sortir des données.
        why: >-
          L’exfiltration n’a besoin que de deux capacités ordinaires, lire et envoyer, et l’attaque est
          la
          combinaison des deux.
        example: >-
          Un agent qui peut lire le courrier et charger des URL peut recevoir l’ordre de mettre un mot
          de
          passe dans une URL, et l’apprenant repère que le chargement est la porte de sortie.
      - claim: >-
          L’apprenant réduit ou soumet à approbation la capacité d’envoi vers l’extérieur, au lieu
          d’essayer de filtrer ce que lit l’agent.
        why: >-
          On ne peut pas contrôler chaque entrée, mais un agent qui ne peut pas envoyer, ou doit demander
          avant d’envoyer, ne peut pas faire sortir de données sans qu’on le voie.
        example: >-
          Pour une tâche de résumé, l’apprenant retire à l’agent ses outils de courrier et d’envoi réseau,
          et lui laisse un accès en lecture seule.
  - id: safety/judges-agent-risk/sets-oversight
    statement: >-
      Établit la politique, la journalisation et la remontée des incidents pour les agents d’une
      organisation
    level: expert
    behaviors:
      - claim: >-
          L’apprenant rédige une politique qui dit quelles tâches un agent peut faire, avec quelles
          données et quelles approbations, en des termes qu’une équipe peut appliquer.
        why: >-
          Une politique qui dit « utilisez l’IA de façon responsable » ne décide rien, et chaque équipe
          décide alors pour elle-même.
        example: >-
          « Les agents peuvent ouvrir des pull requests dans n’importe quel dépôt ; la fusion exige une
          relecture humaine ; aucun identifiant de production n’est jamais donné à un agent. »
      - claim: >-
          Les actions des agents sont journalisées là où une personne peut les lire plus tard, et
          quelqu’un est désigné pour les lire.
        why: >-
          Sans journal, impossible de savoir ce qui s’est passé après un problème, et un journal que
          personne ne lit n’attrape rien.
        example: >-
          Chaque message envoyé par un agent porte une étiquette, les messages étiquetés vont dans un
          canal d’audit, et le chef d’équipe en relit un échantillon chaque semaine.
      - claim: >-
          La politique nomme la voie de remontée : ce qui arrête l’agent, qui est prévenu, et qui décide
          s’il redémarre.
        why: >-
          Le premier incident est le mauvais moment pour découvrir qui peut retirer l’accès de l’agent.
        example: >-
          « Toute action d’un agent sur des données clients en dehors des heures de bureau déclenche une
          alerte à la personne d’astreinte, qui peut révoquer le jeton. »
      - claim: >-
          L’apprenant traite une mise à jour du modèle ou de l’outil comme un changement qui demande de
          revérifier le comportement de l’agent.
        why: >-
          Le même prompt sur une nouvelle version du modèle peut agir autrement, et une politique qui
          supposait l’ancien comportement ne tient plus.
        example: >-
          Après la mise à niveau du modèle par le fournisseur, l’apprenant relance l’agent sur les tâches
          du mois précédent avant de le remettre sur du travail réel.
