id: safety/verifies-output
area: safety
statement: Vérifie la sortie de l’IA avant de s’y fier
topics: [safety/failure-modes, safety/verification]
objectives:
  - id: safety/verifies-output/checks-claims
    statement: Vérifie les affirmations et les sources de tout ce qui quitte son bureau
    level: base
    behaviors:
      - claim: >-
          Chaque affirmation précise d’une sortie d’IA qui quitte le bureau de l’apprenant (un nombre,
          une
          date, un nom, une citation, une référence) est vérifiée dans une source.
        why: >-
          Les détails précis sont ce que le modèle invente de la façon la plus convaincante, et ce sur
          quoi le lecteur agit.
        example: >-
          Avant d’envoyer une note d’information, l’apprenant ouvre chacun des trois rapports cités et
          découvre que l’un d’eux ne dit pas ce qu’affirme le résumé.
      - claim: >-
          L’apprenant lit la source elle-même et la compare avec la description qu’en fait le modèle.
        why: Un modèle peut produire un vrai titre accompagné d’un résultat inventé.
        example: >-
          L’article existe, mais l’apprenant lit son résumé et voit qu’il a étudié une autre population
          que celle qu’indique la synthèse.
      - claim: >-
          Quand une affirmation ne peut pas être vérifiée, l’apprenant la marque comme non vérifiée ou
          la
          retire.
        why: >-
          Une affirmation non vérifiée qui reste dans le texte ressemble à une affirmation vérifiée pour
          le lecteur suivant.
        example: >-
          Le rapport garde le chiffre de la taille du marché mais ajoute « (non vérifié, fourni par
          l’assistant) » jusqu’à ce que l’analyste le confirme.
  - id: safety/verifies-output/spots-sycophancy
    statement: Repère un accord qui ne prouve rien
    level: base
    behaviors:
      - claim: >-
          L’apprenant reconnaît qu’un modèle qui lui donne raison ne constitue pas une preuve, parce que
          l’accord est ce qu’un modèle tend à produire.
        why: >-
          La confirmation du modèle ressemble à un deuxième avis, alors qu’elle vient du cadrage que
          l’apprenant lui a donné.
        example: >-
          Après un oui à « mon analyse montre qu’il faut annuler le projet, n’est-ce pas ? », l’apprenant
          pose la question inverse et obtient aussi un oui.
      - claim: L’apprenant demande le contre-argument le plus fort avant de demander une
          confirmation.
        why: >-
          Un modèle à qui l’on demande d’être en désaccord l’est vraiment, et sa réponse montre ce que
          la
          confirmation avait laissé de côté.
        example: >-
          « Donne-moi les trois meilleures raisons pour lesquelles ce plan échoue » vient avant « ce plan
          est-il bon ? ».
      - claim: L’apprenant retire sa propre opinion de la question quand il veut une évaluation.
        why: >-
          Une question orientée produit une réponse orientée, et la correction se fait dans la question.
        example: >-
          « Voici deux options, compare-les sur le coût et le risque » à la place de « l’option A est
          meilleure, d’accord ? ».
  - id: safety/verifies-output/calibrates-trust
    statement: Adapte la profondeur de la vérification au coût d’une erreur
    level: base
    behaviors:
      - claim: >-
          L’apprenant fixe la profondeur de la vérification d’après ce qui se passe si la sortie est
          fausse.
        why: >-
          La fluidité reste constante et les conséquences varient, donc le coût d’une erreur est la seule
          chose qui devrait changer l’effort.
        example: >-
          Une liste issue d’un remue-méninges n’est pas vérifiée. Un tableau de posologie dans une notice
          pour patients voit chaque valeur vérifiée par une deuxième personne.
      - claim: >-
          L’apprenant vérifie davantage quand la sortie ne peut pas être annulée ou va à des personnes
          qui
          ne la vérifieront pas elles-mêmes.
        why: >-
          Un brouillon interne a des lecteurs qui repèrent les erreurs, et une page publiée ou un e-mail
          envoyé n’en a pas.
        example: >-
          Un résumé interne est parcouru, et le même résumé envoyé à un client est lu ligne par ligne.
      - claim: >-
          L’apprenant traite un domaine qu’il ne sait pas juger comme à haut risque, quelle que soit la
          taille de la tâche.
        why: >-
          Dans un domaine qu’il connaît mal, l’apprenant ne voit pas les erreurs, donc la vérification
          doit venir d’une source ou d’une personne qui les voit.
        example: >-
          Une clause juridique d’un paragraphe part chez l’équipe juridique, même si elle est courte et
          se
          lit bien.
  - id: safety/verifies-output/keeps-a-check-habit
    statement: Intègre la vérification à la routine de l’équipe
    level: expert
    behaviors:
      - claim: >-
          L’apprenant place la vérification dans le processus (un champ de modèle de document, une étape
          de relecture, un point d’une liste de contrôle) pour qu’elle ait lieu que quelqu’un y pense
          ou
          non.
        why: Une habitude portée par une seule personne part avec elle et cède un jour de rush.
        example: >-
          Le modèle de rapport de l’équipe reçoit une ligne « sources vérifiées par » que remplit le
          relecteur.
      - claim: >-
          La vérification est assez légère pour que l’équipe la fasse, et l’apprenant mesure si elle est
          faite.
        why: >-
          Une vérification lourde est sautée, et une vérification sautée est pire qu’une vérification
          légère parce que tout le monde suppose qu’elle a eu lieu.
        example: >-
          L’apprenant prend chaque mois trois documents faits avec l’aide de l’IA et regarde si la case
          est cochée et une source nommée.
      - claim: L’apprenant rend normal le fait de signaler une erreur de l’IA qui a été repérée.
        why: >-
          Une équipe qui cache les erreurs repérées n’apprend rien, et une équipe qui les partage affine
          ses vérifications.
        example: >-
          Une note hebdomadaire indique « repéré cette semaine : un numéro de loi inventé, une conversion
          de devise fausse » sans nommer qui les a laissés passer.
