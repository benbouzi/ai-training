id: safety/asking-a-model-to-disagree
title: Demander à un modèle d’être en désaccord
description: >-
  Pourquoi le oui d’un modèle à votre projet ne vérifie rien, comment demander le contre-argument
  le plus fort avant de demander une confirmation, et comment retirer votre propre opinion de la
  question quand vous voulez une évaluation.
mode: tutorial
covers: safety/verification
serves: [safety/verifies-output/spots-sycophancy]
introduces: []
assumes:
  - objective: concepts/explains-models/names-failure-modes
    lesson: concepts/straight-answer
    section: pourquoi-laccord-est-un-texte-probable
after: [safety/checking-habits]
shorts: []
exercise:
  kind: do
  brief: >-
    Demander deux fois à un modèle le contre-argument le plus fort à l’un de vos projets : une fois
    après qu’il a déjà dit oui à une question orientée dans la même conversation, et une fois comme
    premier message d’une nouvelle conversation. Comparer les deux contre-arguments.
sources: [Sharma 2023, Academy ai-fluency-framework-foundations]
issue: 124
minutes: 15
notes: >-
  Sycophancy, as a limit of the model. Introduces no concept: deepens checking-habits with prompts
  the learner types into their own chat tool, and every exchange on the page is illustrative and
  marked so. The plan named concepts/how-models-work as the teacher of names-failure-modes, and the
  live lesson concepts/straight-answer teaches sycophancy and its cause in depth, so the assumes
  entry points there and the page links it for the why. The plan listed CS50 as a source, and the
  page does not cite it, because the endorsed-answers idea is already used in checking-habits and
  a second use here would repeat it. Sharma 2023 backs every claim about what sycophancy looks
  like in deployed assistants. The plan's exercise (ask the plan three ways and compare) is the
  exercise of the live lesson concepts/straight-answer, so the review of #124 moved it to
  what this lesson adds: the order of yes and counter-argument within one conversation.
