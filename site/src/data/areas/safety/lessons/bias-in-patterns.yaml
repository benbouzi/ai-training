id: safety/bias-in-patterns
title: Voir le biais sur de nombreuses réponses
description: >-
  Lire deux présélections d’un outil de classement simulé sur la page, qui paraissent chacune
  justes prises seules, compter qui est retenu quand les noms sont échangés, et décider quel
  niveau de vérification mérite une tâche qui touche des personnes.
mode: tutorial
covers: safety/failure-modes
serves: [safety/verifies-output/calibrates-trust]
introduces: [bias]
assumes:
  - objective: concepts/explains-models/names-failure-modes
    lesson: concepts/how-models-work
    section: les-défaillances-nommées
extends-to:
  - label: Vérifier les sorties
    href: /safety/verification/
after: [safety/spotting-hallucination]
shorts: [Le biais venu des données d’entraînement et le biais venu du réglage]
exercise:
  kind: judge
  brief: >-
    Pour une tâche de votre travail où la sortie d’un modèle touche des personnes, noter quels
    groupes vous compareriez, combien d’échantillons il vous faut avant de vous fier à une tendance,
    et, selon les personnes que touche la sortie, quel niveau de vérification mérite cette tâche et
    qui la fait.
sources: [Wilson 2024, Bertrand 2004, Academy ai-capabilities-and-limitations]
sources-checked: 2026-09-24
review-by: 2027-03-24
minutes: 15
proofs:
  - safety/bias-in-patterns/both_runs.py
  - safety/bias-in-patterns/totals.py
notes: >-
  The fixture is a constructed simulation of a slanted ranker, and the page says so twice: it ranks
  twelve made-up records under two invented name lists, swaps the lists, and tallies the shortlist
  per list over both runs. Under a fair ranker the totals are equal by construction, so any
  difference is the slant. The bonus is two points and the records are chosen so that at 2 points no
  tie decides the shortlist line in either run. At 1 point (both runs) and 5 points (run 1) a tie at
  places 6 and 7 is decided by record order, so the stretch exercise asks only about 3 and 4, where
  no tie decides the count, and the page says a tie goes to the earlier record. The names are
  invented, and the given names and surnames are mixed across the two lists so that neither list
  reads as one group. The claim that real models slant by name rests on Wilson and Caliskan 2024
  (resume retrieval, checked 2026-09-24) and the swapped-name method on Bertrand and Mullainathan
  2004. Bloomberg's 2024 GPT ranking analysis was not cited because its page is behind a paywall and
  could not be checked. The widget (BiasInPatternsRanker) is a port of rank.py with the bonus on a
  slider from 0 to 6, starting at the 2 that rank.py fixes. Ties keep record order at every bonus,
  as in rank.py. The text fence on the page is the output of both_runs.py, which holds the totals
  line totals.py prints, so mise run examples fails when either prints a line the page doesn't show
  (#284). The graded predict-the-totals became a Choice with the same id and objective.
