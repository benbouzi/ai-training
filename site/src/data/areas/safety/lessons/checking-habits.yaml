id: safety/checking-habits
title: Des habitudes de vérification qui tiennent quand vous êtes pressé
description: >-
  Trouver la ligne dont le total est faux dans un tableau rédigé par un assistant conversationnel,
  apprendre les quatre vérifications à faire sur tout ce qui quitte votre bureau, et fixer leur
  profondeur d’après le coût d’une erreur.
mode: tutorial
covers: safety/verification
serves: [safety/verifies-output/checks-claims, safety/verifies-output/calibrates-trust]
introduces: [checking-habits]
assumes:
  - objective: safety/verifies-output/checks-claims
    lesson: safety/spotting-hallucination
    section: la-précision-est-lindice
  - objective: safety/verifies-output/calibrates-trust
    lesson: safety/when-the-tool-is-usually-right
    section: intégrer-la-vérification
after: [safety/spotting-hallucination, safety/when-the-tool-is-usually-right]
shorts: []
exercise:
  kind: do
  brief: >-
    Appliquer les quatre vérifications à un document de votre semaine rédigé par l’IA : le relire en
    regard de la demande, trouver les affirmations que vous n’avez pas fournies, ouvrir un lien,
    refaire un calcul.
sources: [CS50x, Liu 2024b, Academy ai-fluency-framework-foundations]
sources-checked: 2026-09-26
review-by: 2027-03-26
issue: 120
minutes: 15
proofs: [safety/checking-habits/totals.py]
notes: >-
  The fixture site/examples/safety/checking-habits/totals.py recomputes the totals in a
  model-written summary table and flags the row that does not add up. The page shows its output in a
  text fence and carries no Predict run, because safety is a foundations area. The fixture is CI
  proof only: it is in proofs, so mise run examples fails when it prints a line no text fence on the
  page shows (#311). The teams and the ticket counts are invented, and the page holds no person
  names. CS50 is cited for the endorsed-answers idea, in our own words, and Liu 2024b (section 3.4)
  for how staff can endorse, amend or delete the tutor's forum answers. The Academy course is linked
  and its Discernment framing paraphrased, with no text copied.
