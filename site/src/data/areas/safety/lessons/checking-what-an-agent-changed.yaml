id: safety/checking-what-an-agent-changed
title: Vérifier ce qu’un agent a changé
description: >-
  Comparer ce qu’un agent a fait avec ce que vous avez demandé, trouver le fichier supprimé et le
  message envoyé que son résumé a omis, et placer la seule pause avant l’étape irréversible.
mode: tutorial
covers: safety/verification
serves: [safety/verifies-output/calibrates-trust]
introduces: [trust-but-verify-for-agents]
assumes:
  - objective: concepts/recognizes-agents/tells-agent-from-assistant
    lesson: concepts/assistant-or-agent
    section: un-seul-test--que-peut-il-faire-sans-nouveau-prompt-
  - objective: safety/verifies-output/checks-claims
    lesson: safety/checking-habits
    section: la-routine
after: [safety/checking-habits]
shorts: []
exercise:
  kind: do
  brief: >-
    Pour une tâche d’agent que vous avez vue ou lue, lister les effets à inspecter après coup (ce
    qui a changé et ce qui a été envoyé) et la seule étape qui demande d’abord une pause.
sources: [CS50x, Liu 2024b, Academy ai-fluency-framework-foundations]
issue: 128
minutes: 15
proofs: [safety/checking-what-an-agent-changed/replay.py]
notes: >-
  The fixture site/examples/safety/checking-what-an-agent-changed/replay.py replays an invented
  agent session as changes to an in-memory folder, prints the folder before and after, and marks
  each effect as asked for or not against the request. The page shows its output in text fences and
  carries no Predict run, because safety is a foundations area. The fixture is CI proof only: it is
  in proofs, so mise run examples fails when it prints a line no text fence on the page shows
  (#311). It doesn't print the request, because the page quotes it wrapped over two lines. The
  folder, files, session and summary are invented, and the page holds no person names. The CS50x
  course page and Liu 2024b are cited for the AI helper, and Liu 2024b (section 3.4, Figure 3) for
  the endorsed forum answers, in our own words. The recap line about the summary is the lesson's own
  advice and carries no citation. The Academy course is linked and its Discernment framing
  paraphrased, with no text copied.
