id: safety/eu-ai-act
title: Introduction au règlement européen sur l’IA
description: >-
  Ce que le règlement de l’Union européenne sur l’IA demande à ceux qui construisent et utilisent
  l’IA au travail. Savoir si un outil est un système d’IA, à quel niveau de risque appartient un
  usage, si vous êtes fournisseur ou déployeur, et quelles obligations de transparence touchent le
  travail quotidien.
mode: explanation
covers: safety/governance
serves: [safety/judges-agent-risk/sets-oversight, safety/handles-data-safely/discloses-ai-use]
introduces: [regulation]
assumes:
  - objective: safety/judges-agent-risk/chooses-human-in-loop
    lesson: safety/agent-risk
    section: lhumain-dans-la-boucle
extends-to:
  - label: Gouvernance et supervision
    href: /topics/safety/governance/
sources-checked: 2026-09-20
review-by: 2027-03-20
after: [safety/agent-risk]
shorts: [Les identifiants de contenu (C2PA), D’où vient l’obligation de maîtrise de l’IA]
exercise:
  kind: judge
  brief: >-
    Pour un outil d’IA utilisé dans votre travail, décider si votre organisation en est le
    fournisseur ou le déployeur et nommer la seule obligation de transparence qui s’applique.
    Réflexion : lesquelles des obligations du règlement touchent votre propre travail quotidien ?
sources: [AI Act, AI Act OJ, EC AI Act, EC AI Office]
minutes: 15
notes: >-
  The AI literacy pointer that issue #10 asked for lands here, and the transparency duties connect
  back to disclosure in safety/responsible-use. It assumes nothing beyond the Concepts area, per the
  brief on issue #19, and inside this course only agent-risk, the governance topic's S02
  prerequisite. It is last in the course because issue #19 puts it last in build order.
