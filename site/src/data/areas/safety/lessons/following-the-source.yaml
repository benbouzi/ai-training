id: safety/following-the-source
title: Remonter une affirmation jusqu’à sa source
description: >-
  Remonter deux références d’un paragraphe rédigé par l’IA jusqu’aux rapports qu’elles nomment,
  trouver celle qui n’existe pas et celle qui dit autre chose, et apprendre quoi faire d’une
  affirmation qu’on ne peut pas vérifier à temps.
mode: tutorial
covers: safety/verification
serves: [safety/verifies-output/checks-claims]
introduces: [source-checking]
assumes:
  - objective: safety/verifies-output/checks-claims
    lesson: safety/checking-habits
    section: la-routine
after: [safety/checking-habits]
shorts:
  - Vrai titre, constat inventé
exercise:
  kind: judge
  brief: >-
    Le texte de l’exemple cite un vrai rapport avec un constat inventé. Ouvrir le rapport (la leçon
    donne le lien), écrire en une phrase chacun ce que dit le rapport et ce que le texte lui fait
    dire, et marquer l’écart.
sources: [AI Index 2025, CS50x, Liu 2024b, Academy ai-fluency-framework-foundations]
issue: 122
minutes: 15
proofs: [safety/following-the-source/resolve_citations.py]
notes: >-
  The fixture site/examples/safety/following-the-source/resolve_citations.py resolves the two
  citations in a model-written paragraph against an offline bibliography kept in the file, and
  prints one report that exists with a different finding and one that does not exist. The page
  shows its output in a text fence and carries no Predict run, because safety is a foundations
  area. The fixture is CI proof only: it is listed in proofs, and `mise run examples` fails when it
  prints a line no text fence on the page shows (#497, #311). The real report is the 2025 AI Index Report
  by Stanford HAI, and the finding
  recorded for it (78% of organizations reported using AI in 2024, up from 55%) was read from its
  public page on 2026-09-24. The productivity finding the paragraph attributes to it is invented,
  and the page says so. The Nordholm Institute and its survey are invented, and a web search found
  neither. CS50x is cited for the course, and Liu 2024b (section 3.4) for how staff can endorse, amend
  or
  delete the AI helper's forum answers, in our own words. The Academy course
  is linked and its Discernment framing paraphrased, with no text copied.
