id: safety/reading-agent-logs
title: Lire les journaux d’un agent et relancer après un changement de modèle
description: >-
  Reconstituer à partir de son journal ce qu’on a demandé à un agent, ce qu’il a appelé et ce
  qu’il a modifié, conserver le journal là où l’agent ne peut pas le modifier avec un lecteur
  désigné, et relancer un jeu de tâches quand le fournisseur change de modèle.
mode: tutorial
covers: safety/governance
serves: [safety/judges-agent-risk/sets-oversight]
introduces: [logging-and-audit, model-change-risk]
assumes: []
after: [safety/writing-an-ai-policy]
shorts: [Une mise à jour du modèle vue comme une mise à jour de dépendance]
exercise:
  kind: do
  brief: >-
    Prendre un agent ou un assistant que votre équipe utilise et noter ce qu’il journalise, où, qui
    en lit un échantillon, et ce que vous relanceriez après la prochaine mise à jour du modèle par
    le fournisseur.
sources: [AEC-09, AEC-10, AEC-11, Claude Code monitoring, Claude docs model-ids-and-versions, Claude
      docs model-deprecations]
sources-checked: 2026-09-25
review-by: 2027-03-25
issue: 138
minutes: 15
proofs: [safety/reading-agent-logs/read_log.py, safety/reading-agent-logs/compare_versions.py]
notes: >-
  The fixtures site/examples/safety/reading-agent-logs/read_log.py (reads session.log and checks each
  change against the request) and compare_versions.py (one task set on two model versions,
  printing the rows that differ) are CI proof only. The page shows their output in text fences and
  carries no Predict run, because safety is a foundations area. Both are listed in proofs, and
  `mise run examples` fails when one prints a line no text fence on the page shows (#497, #311). The support
  team, emails, orders and model names are invented, and the page
  holds no person names. The planned Academy deploying-claude-enterprise-with-confidence framing
  (no audit trail means the wrong tool for a regulated workflow) is not attributed to the course,
  after the review note on issue #138 found the course does not state it. The page states it as the
  lesson's own rule, and the Academy course is not cited. Vendor claims on logging, model IDs and
  retirement come from public Anthropic documentation pages. The "A model update as a dependency
  upgrade" short is the section "Treat a model change like any other upgrade".
