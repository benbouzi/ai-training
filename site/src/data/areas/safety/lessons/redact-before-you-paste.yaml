id: safety/redact-before-you-paste
title: Masquer un document avant de le coller
description: >-
  Retirer d’un document les noms, les numéros et les adresses dont la tâche n’a pas besoin avant
  qu’il entre dans un outil d’IA, vérifier que la tâche fonctionne toujours sur ce qui reste, et
  remettre les valeurs grâce à une table de correspondance qui n’a jamais quitté votre ordinateur.
mode: tutorial
covers: safety/responsible-use
serves: [safety/handles-data-safely/decides-what-to-share]
introduces: []
assumes:
  - objective: safety/handles-data-safely/decides-what-to-share
    lesson: safety/responsible-use
    section: ce-qui-peut-y-entrer--quatre-niveaux
extends-to:
  - label: >-
      AI Foundations, module 5 : les conseils courts d’OpenAI sur ce qu’il ne faut pas partager avec
      ChatGPT (OpenAI Academy, compte gratuit, en anglais)
    href: https://academy.openai.com/public/courses/ai-foundations-dnq5w
after: [safety/responsible-use]
shorts: [Responsable du traitement et sous-traitant en une page, Des données anonymisées peuvent
      être réidentifiées]
exercise:
  kind: do
  brief: >-
    Masquez le ticket complet d’où vient l’e-mail de la leçon jusqu’à ne garder que ce dont la tâche
    a besoin, dans la zone de masquage de la page, et comparez votre table avec une table qui y
    parvient. Pour aller plus loin : faites la même chose pour un document à vous, sur papier, sans
    le coller nulle part.
sources: [Academy ai-fluency-framework-foundations]
minutes: 15
proofs:
  - safety/redact-before-you-paste/redact.py
  - safety/redact-before-you-paste/check_partial.py
  - safety/redact-before-you-paste/restore.py
notes: >-
  Introduces no concept: deepens data-privacy and confidentiality with a redaction box (the Redactor
  widget, #238) that replaces names and account numbers with placeholders and shows the task still
  works on the result. The widget is a port of the fixtures in
  site/examples/safety/redact-before-you-paste/, which read the same sample files and stay in CI as
  proofs, so mise run examples fails when the text fences on the page and the fixtures disagree. The
  page never names the fixtures. DLAI-2 was inspiration only and is not cited on the page.
