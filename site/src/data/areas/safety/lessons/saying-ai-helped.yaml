id: safety/saying-ai-helped
title: Dire que l’IA a aidé, et créditer ce qu’elle a copié
description: >-
  Écrire la ligne de mention en trois parties, ce que l’IA a fait, ce que vous avez vérifié et qui
  répond du résultat, utiliser un comparateur qui montre quelle part d’une fonction générée vient
  d’une bibliothèque, et chercher la règle de mention du lieu où va le travail.
mode: tutorial
covers: safety/responsible-use
serves:
  - safety/handles-data-safely/discloses-ai-use
  - safety/handles-data-safely/respects-licenses
introduces: []
assumes:
  - objective: safety/handles-data-safely/discloses-ai-use
    lesson: safety/responsible-use
    section: dire-que-lia-a-aidé
  - objective: safety/handles-data-safely/respects-licenses
    lesson: safety/responsible-use
    section: doù-vient-la-sortie
extends-to:
  - label: Les obligations de transparence du règlement européen sur l’IA
    href: /safety/eu-ai-act/
after: [safety/responsible-use]
shorts: ['Certificats de contenu (content credentials, C2PA)', La question du filtre de licences
      pour le code généré]
exercise:
  kind: do
  brief: >-
    Écrivez la ligne de mention de trois travaux produits ce mois-ci, et pour l’un d’eux, cherchez
    la règle du lieu où il est allé.
proofs:
  - safety/saying-ai-helped/compare.py
  - safety/saying-ai-helped/compare_rewrite.py
sources: [ICMJE authorship, curl contribute, AI Act, Academy ai-fluency-framework-foundations]
sources-checked: 2026-09-23
review-by: 2027-03-23
minutes: 15
notes: >-
  Introduces no concept: deepens disclosure and licensing-and-attribution with a line comparer
  widget (#284) that compares a generated function with a known library source and reports the
  near-verbatim match. The widget is a port of compare.py, which stays in CI as the proof through
  compare.py and compare_rewrite.py.
  The library and its author in the fixture are invented. DLAI-2 was inspiration only and is not
  cited on the page. The ICMJE and curl rules move, so review-by covers them.
