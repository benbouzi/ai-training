id: safety/spotting-hallucination
title: À quoi ressemble un fait inventé
description: >-
  Lire le résumé fluide qu’un modèle a fait d’un rapport, prédire lesquels de ses chiffres,
  citations et références n’ont pas de source, et vérifier chacun dans le rapport avec un
  vérificateur sur la page.
mode: tutorial
covers: safety/failure-modes
serves: [safety/verifies-output/checks-claims]
introduces: [hallucination-in-practice]
assumes:
  - objective: concepts/explains-models/names-failure-modes
    lesson: concepts/how-models-work
    section: les-défaillances-nommées
extends-to:
  - label: Vérifier les sorties
    href: /safety/verification/
after: []
shorts: [Pourquoi la précision est l’indice]
exercise:
  kind: judge
  brief: >-
    Lire le second résumé de la leçon avant de lancer la vérification, prédire d’après leur
    précision lesquelles de ses affirmations sont inventées, puis le vérifier dans le vérificateur
    d’affirmations de la page et noter où la prédiction a tenu et où elle a échoué.
sources: [Academy ai-capabilities-and-limitations]
minutes: 15
proofs:
  - safety/spotting-hallucination/missing_claims.py
  - safety/spotting-hallucination/all_claims.py
notes: >-
  The claim checker widget (#238) checks a summary's citations and figures against a small offline
  source set and prints which ones have no source. It is a port of
  site/examples/safety/spotting-hallucination/check_claims.py, which stays in CI as a proof through
  missing_claims.py and all_claims.py, so mise run examples fails when the text fences on the page
  and the fixture disagree. The page never names the fixtures. The report, minutes, ordinance,
  council chair and quotes are fictional and were searched for before publishing.
