id: safety/tracing-a-planted-instruction
title: Suivre une instruction placée jusqu’à l’outil qui fuit
description: >-
  Suivre une ligne placée sur une page web à travers trois ensembles de permissions, et découvrir
  que l’outil qui peut envoyer est celui qui fuit.
mode: tutorial
covers: safety/agent-risk
serves: [safety/judges-agent-risk/recognizes-injection]
introduces: []
assumes:
  - objective: safety/judges-agent-risk/names-blast-radius
    lesson: safety/agent-risk
    section: permissions-et-moindre-privilège
sources-checked: 2026-09-26
review-by: 2027-03-26
after: [safety/agent-risk]
shorts: [Pourquoi un modèle ne sait pas distinguer les données des commandes]
exercise:
  kind: judge
  brief: >-
    Pour un assistant que vous utilisez et qui lit des contenus que vous n’avez pas écrits, nommer
    ses capacités sortantes et celle que vous retireriez ou soumettriez à approbation pour une tâche
    de résumé.
sources:
  - AEC-10
  - Academy introduction-to-claude-cowork
  - Claude support get-started-with-claude-cowork
issue: 132
minutes: 15
proofs: [safety/tracing-a-planted-instruction/planted_line.py]
notes: >-
  Introduces no concept: deepens prompt-injection and exfiltration from agent-risk. The page shows the
  output of the fixture site/examples/safety/tracing-a-planted-instruction/planted_line.py in text
  fences, because safety is a foundations area and the page carries no Predict run. The fixture is
  CI proof only: it is listed in proofs, and `mise run examples` fails when it prints a line no text
  fence on the page shows (#497, #311).
  The recipe site bramble-kitchen.example
  is under the reserved .example domain, and the page holds no person names.
