id: safety/when-the-tool-is-usually-right
title: Quand l’outil a en général raison
description: >-
  Pourquoi l’attention portée à la sortie d’un outil baisse le plus vite quand l’outil est bon, ce
  que l’aviation et la médecine en ont appris, et comment intégrer la vérification au processus au
  lieu de la confier à la volonté.
mode: explanation
covers: safety/failure-modes
serves: [safety/verifies-output/calibrates-trust]
introduces: [overreliance, automation-complacency]
assumes:
  - objective: concepts/explains-models/names-failure-modes
    lesson: concepts/how-models-work
    section: les-défaillances-nommées
extends-to:
  - label: Vérifier les sorties
    href: /safety/verification/
after: [safety/spotting-hallucination]
shorts: [La complaisance envers l’automatisation dans l’aviation et la médecine]
exercise:
  kind: judge
  brief: >-
    Choisir une tâche que vous avez cessé de vérifier, et noter ce qu’aurait coûté la dernière
    erreur non vérifiée et qui l’aurait trouvée.
sources: [Academy ai-capabilities-and-limitations, Parasuraman 2010, Goddard 2012, Bainbridge 1983,
      NTSB Asiana 214]
sources-checked: 2026-09-24
review-by: 2027-03-24
minutes: 10
notes: >-
  The opening story of the invoicing team is invented and the page says so. The claims about
  aviation and medicine rest on Parasuraman and Manzey 2010 (attention account of complacency and
  automation bias), Goddard, Roudsari and Wyatt 2012 (clinicians following wrong decision-support
  advice, and the mitigators), Bainbridge 1983 (skill decay in operators who only monitor) and the
  NTSB report on Asiana 214 (the complexity of the autothrottle and autopilot systems as a
  contributing factor, and automation reliance as a reason for the unmonitored airspeed in finding
  8), all
  checked 2026-09-24. Figures from Goddard 2012 are given as the range the review reports, not as a
  single number.
