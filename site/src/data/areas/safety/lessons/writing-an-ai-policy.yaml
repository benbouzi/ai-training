id: safety/writing-an-ai-policy
title: Écrire une politique d’IA qu’une équipe peut appliquer
description: >-
  Transformer « utilisez l’IA de façon responsable » en une politique d’une page avec les tâches
  permises, les données, les approbations, la journalisation et une voie de remontée avec des
  noms, en traitant la lecture et l’écriture comme deux niveaux d’autorisation.
mode: tutorial
covers: safety/governance
serves: [safety/judges-agent-risk/sets-oversight]
introduces: [policy, escalation]
assumes:
  - objective: safety/judges-agent-risk/names-blast-radius
    lesson: safety/agent-risk
    section: permissions-et-moindre-privilège
  - objective: safety/judges-agent-risk/chooses-human-in-loop
    lesson: safety/agent-risk
    section: lhumain-dans-la-boucle
extends-to:
  - label: >-
      AI Leadership, module 5 : rôles, droits de décision et remontée transformés en accord de
      fonctionnement (OpenAI Academy, compte gratuit)
    href: https://academy.openai.com/public/courses/ai-leadership-kaf7k
after: [safety/agent-risk]
shorts: [Les offres entreprise vendent de la gouvernance, Les huit questions à poser à un
      fournisseur]
exercise:
  kind: do
  brief: >-
    Remplir le gabarit de politique d’une page pour votre propre équipe : tâches permises, données,
    approbations, et voie de remontée avec des noms.
sources: [Academy deploying-claude-enterprise-with-confidence, AEC-11]
sources-checked: 2026-09-24
review-by: 2027-03-24
issue: 135
minutes: 15
notes: >-
  Paraphrases, in our own words, the framing from Academy deploying-claude-enterprise-with-confidence
  noted on issue #31: read access and write access as two levels of sign-off (start read-only, grant
  write per workflow with the risk owner's approval), an agent inheriting the user's own permissions
  through a connector (stated as a boundary: the agent sees what the member sees, no more). The
  audit-trail rule and the separate-account advice are the lesson's own and are not attributed to
  the course. The "Enterprise tiers sell governance" short is a section of the page and quotes no plan
  feature, limit or price. The "eight questions for a vendor" short is a link to the section of
  responsible-use that already lists them. The claims team is invented and the page holds no person
  names. Both assumes entries point at agent-risk, which the page links as the agent risk lesson.
