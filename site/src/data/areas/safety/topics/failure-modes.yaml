id: safety/failure-modes
area: safety
name: Reconnaître les défaillances
definition: >-
  Les défaillances d’un modèle s’annoncent rarement : elles arrivent sous forme de texte fluide et
  assuré. Ce thème montre à quoi ressemble l’hallucination dans de vrais documents et du vrai
  code, comment un biais entre et se répète, et comment on glisse vers la dépendance excessive
  (overreliance) et la complaisance envers l’automatisation (automation complacency) quand un
  outil a en général raison.
concepts:
  - id: hallucination-in-practice
    name: L’hallucination en pratique
    definition: >-
      À quoi ressemble une sortie inventée dans le travail quotidien : un texte de loi avec un vrai
      numéro et un contenu faux, une méthode de bibliothèque qui existe presque, une citation
      attribuée à la bonne personne et tirée d’un discours jamais prononcé, un résumé qui ajoute un
      point absent de la source. L’indice est une précision sans source vérifiable. Traitez les
      détails précis donnés par un modèle comme des affirmations à vérifier.
  - id: bias
    name: Biais
    definition: >-
      Une inclinaison systématique de la sortie d’un modèle, héritée de ses données d’entraînement et
      de son réglage : quels noms il suppose être ceux de cadres, quel parler il juge professionnel,
      quels candidats il classe plus haut à dossier égal. Un biais se voit mal dans une réponse isolée
      et apparaît dans les tendances sur beaucoup de réponses. Tout ce que fait un modèle et qui
      touche des personnes doit être échantillonné et comparé entre groupes.
  - id: overreliance
    name: Dépendance excessive
    definition: >-
      Faire confiance à la sortie d’un modèle au-delà de ce que vous avez vérifié ou pourriez
      vérifier. Elle commence avec des tâches que vous connaissez bien, puis s’étend à celles que vous
      connaissez mal, où vous ne savez plus distinguer une bonne réponse d’une réponse plausible. Le
      remède est de continuer à vérifier en proportion des enjeux, et de garder assez de compétence
      propre pour reconnaître quand l’outil se trompe.
  - id: automation-complacency
    name: Complaisance envers l’automatisation
    definition: >-
      L’habitude de laisser passer la sortie d’un outil parce qu’il a eu raison de nombreuses fois.
      L’attention baisse le plus vite quand l’outil est bon, si bien que la rare défaillance passe
      sans contrôle. C’est un effet connu de l’aviation et de la médecine, sans rapport avec une
      faiblesse personnelle, et on le contre par le processus : des vérifications prévues,
      l’échantillonnage et la rotation des relecteurs.
