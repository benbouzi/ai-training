id: safety/governance
area: safety
name: Gouvernance et supervision
definition: >-
  Une fois que des agents travaillent dans une organisation, la vigilance individuelle ne suffit
  plus. Ce thème couvre les contrôles partagés : une politique qui dit ce qui est permis, des
  journaux qui rendent les actions des agents vérifiables, la conscience qu’une mise à jour du
  modèle peut changer son comportement du jour au lendemain, une voie claire pour faire remonter
  un problème, la réglementation qui s’applique à l’usage de l’IA, et une méthode pour évaluer le
  risque d’un cas d’usage avant qu’il démarre.
concepts:
  - id: policy
    name: Politique
    definition: >-
      Un texte écrit qui dit quels outils d’IA peuvent être utilisés, avec quelles données, pour
      quelles tâches, et avec quelles vérifications avant de se fier aux résultats. Une bonne
      politique est courte, nomme des responsables et donne des exemples d’usages permis et interdits.
      Sans politique, chacun invente ses propres règles, et l’exposition de l’organisation est la
      somme des choix les plus imprudents.
  - id: logging-and-audit
    name: Journalisation et audit
    definition: >-
      Enregistrer ce qu’on a demandé à un agent, ce qu’il a fait, quels outils il a appelés et ce qui
      a changé, pour qu’une personne puisse plus tard reconstituer et juger ses actions. Les journaux
      (logs) transforment un incident opaque en incident traçable et rendent visibles les tendances
      sur de nombreuses sessions. Stockez-les là où l’agent lui-même ne peut pas les modifier, et
      relisez-en un échantillon même quand rien ne s’est mal passé.
  - id: model-change-risk
    name: Risque lié au changement de modèle
    definition: >-
      Les fournisseurs mettent leurs modèles à jour, et un flux de travail qui fonctionnait bien peut
      se comporter autrement après une mise à jour : un format change, un refus apparaît, un raccourci
      est pris. Comme le modèle échappe à votre contrôle, traitez chaque changement comme la mise à
      jour d’une dépendance : figez les versions quand c’est possible, gardez un jeu de tests
      représentatif de vos tâches, et relancez-le quand le modèle change.
  - id: escalation
    name: Remontée des incidents
    definition: >-
      La voie convenue pour signaler un problème lié à l’IA : un document qui a fuité, un agent qui a
      fait une mauvaise action, une sortie qui a nui à quelqu’un. Elle dit qui prévenir, dans quel
      délai et quoi conserver. Les gens signalent plus vite quand la voie est connue et sans recherche
      de coupable, et l’organisation apprend des incidents évités de justesse, avant d’avoir à
      apprendre des catastrophes.
  - id: regulation
    name: Réglementation
    definition: >-
      Le droit qui s’applique à la façon dont une organisation construit et utilise l’IA, avec le
      règlement européen sur l’IA (EU AI Act) comme principal exemple. Il définit ce qui compte comme
      un système d’IA, classe les usages en niveaux de risque, de l’interdit au minimal, et impose des
      obligations différentes au fournisseur (provider) qui construit un système et au déployeur
      (deployer) qui l’utilise. Les déployeurs doivent la transparence aux personnes concernées et
      doivent s’assurer que leur personnel a une maîtrise de l’IA suffisante pour les outils qu’il
      utilise.
  - id: risk-assessment
    name: Évaluation des risques
    definition: >-
      Une méthode courte et écrite pour juger un cas d’usage de l’IA avant qu’il démarre. Nommez les
      domaines qu’il touche, comme les données personnelles, l’argent, la sécurité ou la réputation,
      puis notez l’impact et la probabilité sur des échelles convenues, et combinez-les en un niveau.
      Un niveau au-dessus du seuil convenu exige des contrôles supplémentaires ou une décision écrite
      d’une personne habilitée à accepter le risque. Ce compte rendu est ce qui permet de réexaminer
      la décision plus tard.
