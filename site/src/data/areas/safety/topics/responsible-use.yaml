id: safety/responsible-use
area: safety
name: Usage responsable
definition: >-
  Utiliser l’IA de façon responsable, c’est savoir ce qui peut entrer dans un prompt et ce qui ne
  le peut pas, respecter la confidentialité des informations des autres, honorer les licences de
  ce que vous fournissez et produisez, et dire à votre public que l’IA a aidé quand il s’attend à
  le savoir.
concepts:
  - id: data-privacy
    name: Protection des données
    definition: >-
      Les données personnelles ou le code source collés dans un prompt échappent à votre contrôle.
      Leur destination dépend des conditions de l’outil : combien de temps le fournisseur les
      conserve, s’il peut s’entraîner dessus, où elles sont stockées et où elles sont traitées, et par
      quels sous-traitants elles passent. Un outil bâti sur une passerelle, elle-même bâtie sur un
      fournisseur de modèle, a trois politiques de ce type. Retirez ou remplacez les noms, les
      coordonnées, les informations de santé ou financières et tout ce que couvre le droit des données
      personnelles, sauf si l’outil est approuvé pour cela.
  - id: confidentiality
    name: Confidentialité
    definition: >-
      Les informations qu’on vous confie à condition qu’elles restent dans un périmètre : contrats
      clients, projets non annoncés, code source, conversations entre collègues. Les coller dans un
      outil d’IA revient à les communiquer à un tiers, même si personne ne les lit. Le test :
      enverriez-vous le même texte par e-mail à ce fournisseur ? Sinon, résumez, masquez, ou utilisez
      un outil autorisé.
  - id: licensing-and-attribution
    name: Licences et attribution
    definition: >-
      Ce que vous donnez à un modèle et ce qu’il produit s’accompagnent tous deux d’obligations.
      Fournir un texte ou du code protégé que vous n’avez pas le droit de redistribuer ne lève pas la
      restriction qui pèse sur lui, et une sortie qui reproduit une source exige l’attribution que
      demande cette source. Gardez trace de la provenance des entrées, et vérifiez qu’une sortie qui
      semble copiée est créditée ou remplacée.
  - id: disclosure
    name: Mention de l’usage de l’IA
    definition: >-
      Dire que l’IA a servi, dans la mesure où le public s’y attend. Le lecteur d’un rapport, la
      personne qui relit du code ou la partie à un contrat veulent en général savoir si une machine a
      rédigé le texte et qui l’a vérifié. Cette mention sert la confiance, et elle n’a rien d’un
      aveu : dites ce que l’IA a fait, ce que vous avez fait, et qui répond du résultat.
