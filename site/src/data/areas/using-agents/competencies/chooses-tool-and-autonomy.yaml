id: using-agents/chooses-tool-and-autonomy
area: using-agents
statement: Choisit l’outil et le degré d’autonomie adaptés à une tâche
topics: [using-agents/choosing-tools, using-agents/delegating]
objectives:
  - id: using-agents/chooses-tool-and-autonomy/picks-chat-agent-or-automation
    statement: Choisit entre conversation, agent et automatisation pour une tâche, et dit pourquoi
    level: base
    behaviors:
      - claim: >-
          L’apprenant choisit la conversation quand la tâche demande du jugement à chaque étape, un agent
          quand les étapes sont connues mais le chemin varie, et l’automatisation quand les étapes et
          le
          chemin sont fixes.
        why: >-
          Chaque niveau échange du contrôle contre de l’effort, et un mauvais choix gaspille l’attention
          ou la retire là où elle était nécessaire.
        example: >-
          Rédiger un e-mail délicat relève de la conversation. Ranger un dossier de fichiers mal nommés
          relève d’un agent. Renommer chaque nouvelle facture à son arrivée relève de l’automatisation.
      - claim: >-
          L’apprenant dit ce qui lui ferait passer une tâche au niveau suivant, et ce qui la ferait
          revenir en arrière.
        why: Les tâches changent, et une règle de passage rend le choix réexaminable.
        example: >-
          « Une fois que l’agent a classé dix rapports sans correction, on le planifie ; s’il faut le
          corriger deux fois dans le mois, on revient à la relecture de chaque rapport. »
      - claim: L’apprenant choisit le niveau d’après le pire cas de la tâche.
        why: >-
          Une tâche routinière neuf fois sur dix et lourde de conséquences la dixième demande le niveau
          qui gère la dixième.
        example: >-
          La réponse aux tickets d’assistance reste au niveau agent avec approbation, parce qu’un ticket
          sur cinquante est une réclamation juridique.
  - id: using-agents/chooses-tool-and-autonomy/picks-a-model-by-fit
    statement: Choisit un modèle pour une tâche en testant l’adéquation, le coût et la rapidité
    level: base
    behaviors:
      - claim: >-
          L’apprenant fait passer quelques entrées représentatives sur chaque modèle candidat et compare,
          au lieu de choisir par défaut le plus capable.
        why: >-
          Le modèle le plus capable est en général aussi le plus lent et le plus cher, et sur beaucoup
          de
          tâches un plus petit donne la même réponse.
        example: >-
          Avant de choisir un modèle pour étiqueter des tickets d’assistance, l’apprenant fait passer
          les
          dix mêmes tickets sur un petit et un grand modèle, et constate que les étiquettes concordent
          sur
          neuf.
      - claim: >-
          L’apprenant énonce ce dont la tâche a besoin (reformater, classer, raisonner en plusieurs
          étapes, des faits récents) avant de nommer un modèle.
        why: >-
          C’est la nature du travail qui décide quel modèle peut le faire, et un modèle nommé en premier
          fait plier la tâche à sa mesure.
        example: >-
          « Ceci est du reformatage, donc n’importe quel modèle fera l’affaire. Ceci demande les prix
          du
          jour, donc il faut un modèle avec recherche, quelle que soit sa taille. »
      - claim: >-
          L’apprenant pèse le prix et le délai par appel au volume prévu, et mesure avant de passer à
          l’échelle un travail répété.
        why: >-
          Un coût faible pour un appel devient tout le budget à dix mille appels par jour, et un délai
          acceptable en conversation bloque une boucle.
        example: >-
          L’apprenant chronomètre un appel à quatre secondes, multiplie par les vingt mille documents
          du
          traitement de nuit, obtient plus de vingt-deux heures, et passe la tâche sur le modèle plus
          rapide avant de la planifier.
  - id: using-agents/chooses-tool-and-autonomy/keeps-the-human-steps
    statement: Nomme les étapes qui restent humaines, et pourquoi
    level: base
    behaviors:
      - claim: >-
          L’apprenant nomme les étapes qui restent à une personne parce que quelqu’un doit en répondre,
          même quand l’agent pourrait les faire.
        why: >-
          Certaines étapes sont gardées parce qu’une personne doit en être responsable, et cette raison
          doit être dite à voix haute.
        example: >-
          L’agent peut rédiger l’entretien d’évaluation, mais c’est le manager qui écrit la note, parce
          que c’est lui qui doit la défendre.
      - claim: >-
          L’apprenant garde l’étape dont l’information ne se trouve dans aucun système que l’agent peut
          atteindre.
        why: >-
          Un agent travaille à partir de ce qu’il peut lire, et une grande partie de ce qui compte dans
          une décision se trouve dans des conversations et un contexte qu’il n’a jamais vus.
        example: >-
          L’agent propose l’horaire de la réunion d’après les agendas, et la personne garde le choix parce
          qu’elle sait qu’un collègue traverse une semaine difficile.
      - claim: >-
          L’apprenant garde les étapes qui lui apprennent ce dont il a besoin pour continuer à juger le
          travail de l’agent.
        why: >-
          Si chaque étape est confiée, la personne perd le savoir qui lui permet de vérifier le résultat.
        example: >-
          L’ingénieure continue de lire les tests qu’écrit l’agent, même si l’agent pourrait les relire,
          pour continuer à connaître le système.
  - id: using-agents/chooses-tool-and-autonomy/reasons-across-levels
    statement: Réapplique son jugement quand le niveau de l’outil monte
    level: expert
    behaviors:
      - claim: >-
          Quand un outil prend en charge un niveau de travail, l’apprenant déplace son attention au niveau
          supérieur et y pose les mêmes questions.
        why: >-
          Les questions d’exactitude, de coût et de risque ne disparaissent pas. Elles se déplacent vers
          la spécification et la relecture.
        example: >-
          Quand l’agent écrit le code, l’apprenant cesse de relire la syntaxe et commence à vérifier si
          le
          test d’acceptation prouve l’exigence.
      - claim: >-
          L’apprenant peut encore redescendre au niveau inférieur quand le signal de haut niveau ne tient
          pas.
        why: >-
          Les signaux de haut niveau dépendent de la solidité du niveau inférieur, et la capacité à le
          vérifier est ce qui rend la confiance méritée.
        example: >-
          Le tableau de bord dit que la migration a réussi, et l’apprenant ouvre quand même la base de
          données pour compter les lignes quand le nombre paraît trop rond.
      - claim: >-
          L’apprenant remarque quand la montée d’un outil change ce qui compte comme une erreur, et adapte
          ses vérifications.
        why: >-
          Les anciennes vérifications attrapent les anciennes erreurs, et un outil plus capable en fait
          d’autres.
        example: >-
          Avec un agent qui écrit aussi les tests, « y a-t-il des tests ? » ne suffit plus comme
          vérification, et « les tests échouent-ils quand la fonctionnalité est cassée ? » prend sa place.
