id: using-agents/delegates-and-checks
area: using-agents
statement: Délègue une tâche à un agent et vérifie le résultat
topics: [using-agents/delegating, using-agents/decomposition, using-agents/assistant-work]
objectives:
  - id: using-agents/delegates-and-checks/writes-a-brief
    statement: Rédige une consigne avec objectif, contexte, limites et critères d’achèvement
    level: base
    behaviors:
      - claim: >-
          Une consigne énonce l’objectif, le contexte dont le travail a besoin et les limites qu’il doit
          respecter.
        why: >-
          Un agent remplit tout ce qui n’est pas dit avec des valeurs par défaut plausibles, donc ce qu’il
          ne doit pas toucher compte autant que ce qu’il doit faire.
        example: >-
          « Mets à jour le tableau des prix dans `docs/pricing.md` à partir de ce tableur ; ne modifie
          aucun autre fichier » reste dans la tâche, alors que « mets à jour les prix » peut réécrire
          toute la page.
      - claim: Les critères d’achèvement sont écrits avant que le travail commence.
        why: >-
          Sans eux, le résultat est jugé au ressenti, et un résultat plausible est accepté comme un
          résultat juste.
        example: >-
          « Terminé quand chaque ligne du tableur apparaît une fois dans le tableau et que les totaux
          concordent » transforme la relecture en vérification.
      - claim: La consigne nomme les informations que l’agent doit utiliser, et où elles se
          trouvent.
        why: Un agent qui doit deviner ses sources prend la plus accessible, qui est rarement la
          bonne.
        example: >-
          Désigner le tableur approuvé, et non « les derniers chiffres », empêche l’agent de reprendre
          les
          chiffres du trimestre précédent dans un vieil e-mail.
  - id: using-agents/delegates-and-checks/chooses-autonomy
    statement: Choisit ce que l’agent peut faire avant de faire le point
    level: base
    behaviors:
      - claim: >-
          L’apprenant fixe le point d’étape d’après le coût d’une mauvaise étape, quelle que soit sa
          confiance dans l’outil.
        why: >-
          Une confiance construite sur quelques bonnes exécutions ne réduit pas le coût de la mauvaise.
        example: >-
          Pour un résumé de notes de réunion, l’agent peut terminer sans surveillance. Pour des réponses
          à
          des clients, il s’arrête avant chaque envoi, même s’il a bien rédigé jusque-là.
      - claim: >-
          La première exécution d’un nouveau type de tâche se fait avec plus de points d’étape que les
          suivantes.
        why: >-
          La première exécution montre où les valeurs par défaut de l’agent diffèrent de celles de
          l’apprenant, et c’est le moment de corriger la consigne.
        example: >-
          La première fois que l’agent classe des notes de frais, l’apprenant relit chacune. Après deux
          corrections de la consigne, il en relit un échantillon.
      - claim: >-
          L’apprenant sait dire en une phrase ce que l’agent peut faire sans demander et ce pour quoi
          il
          doit demander.
        why: >-
          Si la limite ne peut pas être dite simplement, c’est qu’elle n’a pas été choisie, et l’agent
          la
          choisira.
        example: >-
          « Modifie tout ce qui est sous `brouillons/`, demande avant de toucher à autre chose, n’envoie
          jamais rien » est une limite, et « fais attention » n’en est pas une.
  - id: using-agents/delegates-and-checks/reviews-against-brief
    statement: Vérifie le résultat au regard de la consigne, et non d’une impression
    level: base
    behaviors:
      - claim: >-
          La relecture parcourt les critères d’achèvement un par un et note pour chacun réussi ou échoué.
        why: >-
          Un résultat qui se lit bien est accepté au ressenti, et une liste de contrôle attrape le critère
          que l’agent a sauté.
        example: >-
          La consigne disait « chaque ligne apparaît une fois et les totaux concordent », donc l’apprenant
          compte les lignes et additionne les totaux au lieu de parcourir le tableau.
      - claim: >-
          La relecture vérifie les limites autant que l’objectif, en cherchant ce que l’agent a fait sans
          qu’on le lui demande.
        why: >-
          Un agent qui termine la tâche et « améliore » au passage trois autres choses a enfreint la
          consigne, même si la tâche est faite.
        example: >-
          L’apprenant ouvre la liste des fichiers modifiés et interroge les deux fichiers que la consigne
          ne mentionnait pas.
      - claim: >-
          Un résultat qui échoue à la relecture renvoie l’apprenant à la consigne avant de le renvoyer
          à
          l’agent.
        why: >-
          La plupart des ratés viennent de ce que la consigne n’a pas dit, et relancer la même consigne
          reproduit le raté.
        example: >-
          L’agent a utilisé le gabarit de l’an dernier, donc l’apprenant ajoute « utilise le gabarit de
          `templates/2026/` » à la consigne et relance, au lieu de taper « non, le nouveau ».
  - id: using-agents/delegates-and-checks/adjusts-mid-task
    statement: Ajuste la consigne quand le travail révèle une information nouvelle
    level: base
    behaviors:
      - claim: >-
          Quand l’agent signale quelque chose que la consigne n’avait pas prévu, l’apprenant met à jour
          la
          consigne au lieu de répondre à la question dans la conversation.
        why: >-
          Une réponse dans la conversation est perdue pour l’exécution suivante, alors qu’une consigne
          qui
          contient l’information nouvelle garde la correction.
        example: >-
          L’agent demande lequel de deux gabarits utiliser, donc l’apprenant ajoute « utilise
          `templates/2026/` » à la consigne et repart d’elle.
      - claim: >-
          L’apprenant arrête l’agent quand le travail montre que l’objectif lui-même était faux, au lieu
          de le laisser bien terminer la mauvaise chose.
        why: >-
          Un mauvais travail terminé coûte l’exécution et la relecture, et une exécution arrêtée ne coûte
          que l’exécution.
        example: >-
          Le premier brouillon de l’agent montre que les données sont trimestrielles et non mensuelles,
          donc l’apprenant arrête tout et réécrit les critères d’achèvement.
      - claim: >-
          Un changement de consigne est présenté comme un changement, pour que l’agent abandonne
          l’ancienne contrainte.
        why: >-
          Un agent garde l’instruction précédente dans son contexte et essaie de satisfaire les deux.
        example: >-
          « Remplace la limite précédente de cinq puces par : aucune limite, une puce par décision »
          plutôt que d’énoncer seulement la nouvelle règle.
