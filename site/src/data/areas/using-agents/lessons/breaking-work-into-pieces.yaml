id: using-agents/breaking-work-into-pieces
title: Découper une tâche en morceaux qu’un agent peut terminer
description: >-
  Confier à un agent un rapport en trois parties en un seul prompt et voir les parties se
  mélanger. Puis découper la tâche en morceaux qui ont chacun une entrée, une sortie et une
  vérification, et lancer le premier.
mode: tutorial
covers: using-agents/decomposition
serves: [using-agents/delegates-and-checks/writes-a-brief]
introduces: [task-decomposition]
assumes:
  - objective: using-agents/delegates-and-checks/reviews-against-brief
    lesson: using-agents/delegating
    section: vérifier-au-regard-de-la-consigne
extends-to:
  - label: >-
      Applied AI Foundations, module 4 : une tâche récurrente écrite en étapes, avec une vérification
      après chacune (OpenAI Academy, compte gratuit)
    href: https://academy.openai.com/public/courses/applied-ai-foundations-szsmv
after: [using-agents/delegating]
shorts: [Les décisions qui vous reviennent d’abord]
exercise:
  kind: do
  brief: >-
    Prendre la grande tâche donnée (un rapport en trois parties tiré de trois fichiers sources), la
    découper en morceaux qui ont chacun une entrée, une sortie et une vérification, écrire la
    consigne du premier morceau, et lancer ce morceau pour examiner son résultat.
sources: [DLAI-11, Academy ai-fluency-framework-foundations]
sources-checked: 2026-09-26
review-by: 2027-03-26
minutes: 15
notes: >-
  The issue listed no assumed objective. The page checks a piece against its own criterion, which the
  live delegating lesson teaches, so it assumes reviews-against-brief from there. That also places the
  lesson after delegating in the graph, where `after` had put it while it was planned. The sources
  and people in the page have no names on purpose, so no fictional name can collide with a real one.
