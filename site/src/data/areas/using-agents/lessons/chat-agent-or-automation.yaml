id: using-agents/chat-agent-or-automation
title: Conversation, agent ou automatisation
description: >-
  Choisir entre conversation, agent et automatisation pour une tâche d’après son pire cas, adapter
  les vérifications au niveau, et écrire la règle qui ferait monter ou redescendre le choix.
mode: explanation
covers: using-agents/choosing-tools
serves: [using-agents/chooses-tool-and-autonomy/picks-chat-agent-or-automation]
introduces: [chat-vs-agent-vs-automation]
assumes:
  - objective: concepts/recognizes-agents/tells-agent-from-assistant
    lesson: concepts/assistant-or-agent
    section: un-seul-test--que-peut-il-faire-sans-nouveau-prompt-
  - objective: safety/judges-agent-risk/chooses-human-in-loop
    lesson: safety/agent-risk
    section: lhumain-dans-la-boucle
extends-to:
  - label: >-
      Agents and Workflows, module 5 : plugins, skills et tâches planifiées dans ChatGPT, et comment
      choisir le plus petit qui convient (OpenAI Academy, compte gratuit)
    href: https://academy.openai.com/public/courses/agents-and-workflows-y0qoc
after: [using-agents/choosing-autonomy]
shorts: [Choisir pour la dixième fois]
exercise:
  kind: judge
  brief: >-
    Pour cinq tâches données, choisir conversation, agent ou automatisation d’après le pire cas de
    la tâche, et écrire ce qui ferait monter chacune d’un niveau et ce qui la ferait redescendre.
sources:
  - Academy building-effective-human-agent-teams
  - Academy ai-fluency-for-builders
issue: 158
minutes: 15
notes: >-
  Academy building-effective-human-agent-teams is cited for checks growing with the autonomy handed
  over, and Academy ai-fluency-for-builders for making the delegation level a deliberate, written
  decision, both as paraphrased ideas in our own words. AEC-12 and Brilliant ABS from the plan are
  not cited, because the page is a foundations lesson with no coding tool in it, so they are not in
  sources. The planned after lesson choosing-autonomy is ordering only, and the page never refers
  to it. The support queue, the invoice mailbox and the monthly report are invented examples with
  no named person or company.
