id: using-agents/drafting-and-critique
title: Rédiger un texte et demander une critique
description: >-
  Donner à un assistant conversationnel une consigne pour un court e-mail et vérifier chaque fait
  du brouillon, puis en demander la critique comme s’il s’agissait du texte d’un collègue, au
  regard de critères écrits d’abord, et obtenir des problèmes à la place des compliments.
mode: tutorial
covers: using-agents/assistant-work
serves:
  - using-agents/delegates-and-checks/writes-a-brief
  - using-agents/delegates-and-checks/reviews-against-brief
introduces: [drafting, critique]
assumes:
  - objective: concepts/prompts-reliably/structures-a-prompt
    lesson: concepts/prompt-anatomy
    section: public-et-objectif
  - objective: safety/verifies-output/spots-sycophancy
    lesson: safety/asking-a-model-to-disagree
    section: des-habitudes-du-côté-du-prompt
extends-to:
  - label: Déléguer une tâche à un agent
    href: /using-agents/delegating/
after: [using-agents/thought-partner]
shorts: [Noter au regard de critères énoncés]
exercise:
  kind: do
  brief: >-
    Donner à l’assistant une consigne pour un court e-mail (public, objectif, deux points qui
    doivent figurer, ton, longueur) avec deux ou trois critères d’achèvement, et marquer chaque fait
    du brouillon comme venu de la consigne, marqueur à remplir ou ajouté par le modèle. Puis coller
    le brouillon dans une nouvelle conversation comme le texte d’un collègue avec ces critères, et
    demander uniquement les problèmes, réussi ou échoué par critère.
sources: [Sharma 2023]
issue: 142
minutes: 15
notes: >-
  The plan listed DLAI-3 and two Claude Academy courses as sources. The page makes no claim that
  needs them, so it cites only Sharma 2023, whose feedback-sycophancy experiment (section 3.1) found
  more positive feedback when the user says they wrote or like a text and more negative feedback
  when they say they did not write it. That is the basis for calling the text a colleague's, and the
  page says the framing leans the critique harsh, so the learner judges each finding. The fresh chat
  keeps the earlier praise and the draft request out of what the model reads. The critique criteria
  are the done-criteria of the drafting brief, which ties writes-a-brief ("done-criteria are written
  before the work starts") to reviews-against-brief (walking the criteria one by one). No fixture:
  the learner uses a chat tool, and every exchange is illustrative. The example email names no
  company or person.
