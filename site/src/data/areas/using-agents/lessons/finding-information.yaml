id: using-agents/finding-information
title: Trouver de l’information avec un assistant
description: >-
  Demander à un assistant ce qu’un nouveau venu doit savoir d’un texte que vous fournissez, avec
  une citation derrière chaque affirmation, et voir pourquoi la même question posée de mémoire
  donne une réponse fausse et assurée.
mode: tutorial
covers: using-agents/assistant-work
serves: [using-agents/delegates-and-checks/writes-a-brief]
introduces: [finding-information]
assumes:
  - objective: concepts/prompts-reliably/structures-a-prompt
    lesson: concepts/prompt-anatomy
    section: marquer-la-frontière
  - objective: concepts/explains-models/names-failure-modes
    lesson: concepts/how-models-work
    section: les-défaillances-nommées
extends-to:
  - label: Déléguer une tâche à un agent
    href: /using-agents/delegating/
  - label: >-
      Applied AI Foundations, module 3 : la recherche comparée à la recherche approfondie dans ChatGPT
      (OpenAI Academy, compte gratuit)
    href: https://academy.openai.com/public/courses/applied-ai-foundations-szsmv
after: []
shorts: [Demander des sources]
exercise:
  kind: do
  brief: >-
    Coller le guide fourni, demander les trois choses qu’un nouveau venu doit savoir avec une
    citation pour chacune, puis vérifier chaque citation dans le texte et noter celle qui n’y figure
    pas mot pour mot.
sources:
  - Academy ai-capabilities-and-limitations
  - Claude support enabling-and-using-web-search
sources-checked: 2026-09-26
review-by: 2027-03-26
minutes: 15
notes: >-
  The plan named the topic concepts/prompting as assumed; taken as the objective
  concepts/prompts-reliably/structures-a-prompt. The lesson has no fixture: the learner types the
  prompts into a chat tool, and every transcript is marked illustrative.
