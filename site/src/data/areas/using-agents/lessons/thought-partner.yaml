id: using-agents/thought-partner
title: Réfléchir à un problème avec un assistant
description: >-
  Demander à un assistant laquelle de deux offres d’emploi accepter et recevoir son propre cadrage
  sous forme de conseil, puis lui donner une consigne pour argumenter contre votre préférence et
  lister ce que vous avez omis, pour que la réflexion reste la vôtre.
mode: tutorial
covers: using-agents/assistant-work
serves: [using-agents/delegates-and-checks/writes-a-brief]
introduces: [thought-partner]
assumes:
  - objective: concepts/prompts-reliably/structures-a-prompt
    lesson: concepts/prompt-anatomy
    section: public-et-objectif
  - objective: safety/verifies-output/spots-sycophancy
    lesson: safety/asking-a-model-to-disagree
    section: des-habitudes-du-côté-du-prompt
extends-to:
  - label: Déléguer une tâche à un agent
    href: /using-agents/delegating/
after: []
shorts: [Pourquoi un modèle approuve votre cadrage]
exercise:
  kind: do
  brief: >-
    Décrire en cinq lignes une décision que vous avez à prendre, demander à l’assistant d’argumenter
    contre l’option que vous préférez et de lister ce que vous n’avez pas mentionné, puis noter le
    point qui a changé votre avis.
sources: [Sharma 2023]
issue: 139
minutes: 10
notes: >-
  The plan named the topic concepts/prompting as assumed; taken as the objective
  concepts/prompts-reliably/structures-a-prompt, taught in prompt-anatomy "Audience and purpose",
  because the first line of the thinking brief is a purpose sentence. spots-sycophancy points at
  asking-a-model-to-disagree "Habits on the prompt side". That lesson strips the user's opinion out
  of an assessment question, and this one names the lean on purpose as the target and asks for no
  verdict, and the page says so to reconcile the two. The facts in the thinking brief are written
  without adjectives, which keeps the safety lesson's pitfall (a counter-argument prompt that
  carries its verdict) out of it. The plan listed DLAI-3 and two Claude Academy courses as sources;
  the page makes no claim that needs them, so it cites only Sharma 2023 for the sycophancy finding.
  No fixture: the learner uses a chat tool, and every exchange is illustrative. The job offers name
  no company.
