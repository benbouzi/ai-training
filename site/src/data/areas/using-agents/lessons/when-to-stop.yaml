id: using-agents/when-to-stop
title: Quand arrêter de déléguer et le faire soi-même
description: >-
  Lire trois journaux de tours, nommer les trois signes qui montrent qu’un tour de plus coûte
  davantage que de faire l’étape soi-même, et voir pourquoi reprendre une étape ne dit rien de
  l’outil ni de vous.
mode: explanation
covers: using-agents/decomposition
serves: [using-agents/delegates-and-checks/adjusts-mid-task]
introduces: [when-to-stop-and-do-it-yourself]
assumes:
  - objective: using-agents/delegates-and-checks/reviews-against-brief
    lesson: using-agents/delegating
    section: vérifier-au-regard-de-la-consigne
after: [using-agents/delegating-in-rounds]
shorts: [Le troisième tour sur un même morceau est le signal]
exercise:
  kind: judge
  brief: >-
    Lire trois journaux de tours donnés et marquer, pour chacun, le tour où reprendre l’étape aurait
    coûté moins cher, avec le signe qui le montre.
sources: [Academy ai-fluency-framework-foundations]
minutes: 10
notes: >-
  The page explains a round in one paragraph of its own and never refers to delegating-in-rounds,
  the lesson before it that teaches working in rounds, so it reads on its own in review. It assumes
  reviews-against-brief from the live delegating lesson because every log reads a result against
  its done-criteria. The logs use Brindlewick Instruments, the fictional company from the earlier
  lessons, and the people in them have no names, so no invented name can collide with a real one.
  Academy ai-fluency-framework-foundations is cited for the judgment of when to delegate, as
  inspiration in our own words. DLAI-11 from the plan is not cited, because its public outline has
  nothing on rounds or stopping, so it is not in sources.
  The recap cites the Academy course on the point that taking a piece back is a judgment about cost,
  the same claim the body cites it for. The plan has no sources-checked or review-by, because the page
  names no product, law, price or vendor behavior, so no fact on it can move (checked 2026-09-26).
