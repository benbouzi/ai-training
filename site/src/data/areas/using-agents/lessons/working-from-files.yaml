id: using-agents/working-from-files
title: Travailler à partir de vos propres fichiers et images
description: >-
  Remettre à un assistant la capture d’écran d’un tableau au lieu de le décrire, récupérer les
  lignes pour un tableur, et compter les cellules revenues fausses. Puis comparer deux versions
  d’un contrat avec une consigne qui dit quelles différences comptent.
mode: tutorial
covers: using-agents/assistant-work
serves: [using-agents/delegates-and-checks/writes-a-brief]
introduces: [working-with-files-and-images]
assumes:
  - objective: safety/handles-data-safely/decides-what-to-share
    lesson: safety/redact-before-you-paste
    section: ce-dont-la-tâche-a-besoin
extends-to:
  - label: Déléguer une tâche à un agent
    href: /using-agents/delegating/
after: [using-agents/finding-information]
shorts: [Ce qu’un envoi de fichier divulgue]
exercise:
  kind: do
  brief: >-
    Envoyer la capture d’écran fournie d’un inventaire de stock, la demander sous forme de lignes à
    coller dans un tableur, les coller, et compter les cellules revenues fausses.
sources: [Claude docs vision]
sources-checked: 2026-09-23
review-by: 2027-03-23
minutes: 10
notes: >-
  The screenshot is site/public/using-agents/working-from-files/stock-count.png, rendered from a
  hand-written SVG table so the page holds the true values. The issue named safety/responsible-use
  for the assumed objective; the page points at redact-before-you-paste "What the task needs"
  because its pitfall is an upload that holds more than the task needs, which that section teaches
  directly. The image limits come from the Claude docs vision page and must be re-checked by
  review-by. No fixture: the learner uses a chat tool, and every transcript is illustrative.
