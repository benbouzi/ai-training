id: using-agents/assistant-work
area: using-agents
name: Travailler avec un assistant
definition: >-
  Les usages quotidiens d’un assistant conversationnel pour le travail intellectuel : trouver et
  résumer des informations, réfléchir à voix haute sur un problème, produire et remanier des
  brouillons, obtenir un regard critique sur son propre travail, et travailler à partir de
  fichiers et d’images que vous fournissez au lieu de la mémoire du modèle.
concepts:
  - id: finding-information
    name: Trouver de l’information
    definition: >-
      Utiliser un assistant pour repérer, résumer et comparer des informations, dans des documents que
      vous fournissez ou, avec un outil de recherche, sur le web. Il est rapide pour s’orienter et
      pour réduire un long texte aux trois choses que vous devez savoir. Il est peu fiable sur les
      détails précis tirés de sa seule mémoire, donc demandez des sources, fournissez vous-même le
      contenu quand vous le pouvez, et vérifiez tout ce que vous allez répéter.
  - id: thought-partner
    name: Partenaire de réflexion
    definition: >-
      Utiliser l’assistant pour réfléchir plutôt que pour obtenir une réponse : exposer votre
      problème, lui demander de questionner vos hypothèses, de lister ce qui pourrait vous échapper,
      de défendre le point de vue opposé ou de présenter des options. La valeur est dans la clarté de
      votre propre réflexion. Demandez explicitement à être contredit, parce qu’un modèle laissé à
      lui-même tend à approuver le cadrage que vous lui donnez.
  - id: drafting
    name: Rédaction
    definition: >-
      Obtenir une première version d’un e-mail, d’un rapport, d’un plan ou d’un message à partir d’une
      consigne, puis la façonner. Donnez le public, l’objectif, les points qui doivent figurer et le
      ton, et demandez des variantes quand vous hésitez. Le brouillon est une matière première, et le
      produit final reste à faire. Les faits qu’il contient sont à vous de les fournir et de les
      vérifier, et la voix finale doit être la vôtre.
  - id: critique
    name: Critique
    definition: >-
      Demander à un assistant de relire votre propre travail : trouver les arguments faibles, les
      passages obscurs, les étapes manquantes ou les erreurs. Comme les modèles tendent à faire des
      compliments, demandez uniquement des problèmes, demandez une note selon des critères énoncés, ou
      dites que le texte est de quelqu’un d’autre. La critique est l’un des usages les plus sûrs,
      puisque vous restez l’auteur et jugez chaque suggestion.
  - id: working-with-files-and-images
    name: Travailler à partir de fichiers et d’images
    definition: >-
      Donner à l’assistant un document, un tableur, une capture d’écran ou une photo sur lesquels
      travailler au lieu de les décrire. Cela ancre la réponse dans votre contenu et rend possibles
      des tâches comme extraire un tableau d’une image ou comparer deux versions d’un contrat. Faites
      attention à ce que contient le fichier avant de l’envoyer : une pièce jointe divulgue des
      données exactement comme un texte collé.
