id: using-agents/choosing-tools
area: using-agents
name: Choisir les modèles et les outils
definition: >-
  Toutes les tâches ne demandent pas le plus gros modèle ou un agent. Ce thème couvre l’adéquation
  d’un modèle à une tâche, l’arbitrage entre coût, rapidité et qualité, le choix entre une
  conversation, un agent et une automatisation sans surveillance, la décision des étapes qui
  restent humaines, et la manière de réappliquer ce jugement à mesure que les outils gagnent en
  capacités.
concepts:
  - id: model-fit
    name: Adéquation du modèle
    definition: >-
      Choisir un modèle selon ce dont la tâche a besoin : un petit modèle rapide pour classer ou
      reformater, un plus grand pour un raisonnement en plusieurs étapes ou des instructions ambiguës,
      un modèle avec des outils quand des faits récents comptent. L’adéquation se teste : faites
      passer quelques entrées représentatives sur chaque candidat et comparez, au lieu de choisir par
      défaut l’option la plus capable et la plus chère.
  - id: cost-and-speed
    name: Coût et rapidité
    definition: >-
      Le prix et le délai d’un choix, par tâche et au volume que vous prévoyez. Un modèle qui coûte
      dix fois plus et répond plus lentement doit être assez meilleur pour le justifier, et un agent
      qui fait vingt appels d’outils coûte vingt fois une réponse unique. Pour un travail répété, de
      petites différences par appel deviennent tout le budget, donc mesurez avant de passer à
      l’échelle.
  - id: chat-vs-agent-vs-automation
    name: Conversation, agent ou automatisation
    definition: >-
      Trois façons d’utiliser un modèle. La conversation : vous pilotez chaque tour, ce qui convient à
      la réflexion et aux brouillons ponctuels. L’agent : vous lui donnez une consigne et il avance
      par étapes avec des outils, en faisant le point comme convenu, ce qui convient aux tâches
      délimitées avec des critères d’achèvement clairs. L’automatisation : elle tourne sans
      surveillance sur un déclencheur, ce qui convient aux tâches répétitives, à faible enjeu et bien
      testées. L’autonomie augmente d’un cas à l’autre, donc les vérifications doivent augmenter
      aussi.
  - id: what-to-keep-human
    name: Ce qui reste humain
    definition: >-
      Les étapes qui restent volontairement à une personne : les décisions qui ont un poids juridique
      ou éthique, les jugements sur des personnes, tout ce qui est irréversible ou coûteux, et la
      responsabilité finale d’un résultat. Garder une étape humaine est un choix de conception, et
      nommer ces étapes tôt évite qu’elles soient automatisées par défaut à mesure que les outils
      progressent. Garder un chemin humain permet aussi au processus de continuer à fonctionner quand
      l’outil n’est pas disponible.
  - id: reasoning-across-tool-levels
    name: Raisonner d’un niveau d’outil à l’autre
    definition: >-
      Les outils montent en abstraction, de l’autocomplétion à la conversation, puis aux agents et aux
      systèmes d’agents, et chaque niveau cache davantage de ce qui se passe en dessous. Le jugement
      sur l’adéquation, le coût, le risque et ce qui reste humain doit être réappliqué à chaque
      nouveau niveau au lieu d’être reporté tel quel. Ce qui était sûr à un niveau peut ne plus l’être
      au suivant, et inversement.
