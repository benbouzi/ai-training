id: using-agents/decomposition
area: using-agents
name: Découper le travail
definition: >-
  Les grandes tâches échouent quand elles tiennent en un seul prompt. Ce thème apprend à découper
  le travail en morceaux qu’un agent peut terminer et que vous pouvez vérifier, à itérer sur ces
  morceaux à mesure que les résultats révèlent ce dont vous aviez vraiment besoin, et à
  reconnaître le moment où un nouveau tour de délégation coûte plus cher que de faire l’étape
  vous-même.
concepts:
  - id: task-decomposition
    name: Décomposition des tâches
    definition: >-
      Découper un gros travail en étapes assez petites pour que chacune ait une entrée claire, une
      sortie claire et un moyen de la vérifier. De bons morceaux peuvent être confiés à un agent un
      par un, vérifiés séparément et refaits sans perdre les autres. La décomposition (task
      decomposition) fait aussi apparaître les décisions qui vous reviennent avant que l’agent
      commence à combler les trous.
  - id: task-iteration
    name: Itération
    definition: >-
      Travailler par tours : déléguer un morceau, le vérifier, ajuster la consigne avec ce que vous
      avez appris, déléguer le suivant. Le premier résultat révèle en général une contrainte manquante
      ou une fausse hypothèse sur l’objectif. Traitez chaque tour comme un retour sur la consigne
      plutôt que comme un échec de l’agent, et gardez des tours courts pour que les erreurs restent
      peu coûteuses.
  - id: when-to-stop-and-do-it-yourself
    name: Quand arrêter et faire soi-même
    definition: >-
      Reconnaître le moment où expliquer, corriger et revérifier le travail d’un agent coûte plus que
      faire l’étape directement. Les signes : un troisième tour sur le même morceau, une tâche qui
      dépend d’un savoir que vous seul détenez, ou une vérification qui prend plus de temps que le
      travail. Reprendre l’étape relève du jugement, et ne signale un échec ni de l’outil ni de vous.
