id: using-agents/delegating
area: using-agents
name: Déléguer à un agent
definition: >-
  Déléguer à un agent ressemble à déléguer à un nouveau collègue compétent qui comblera chaque
  lacune par une supposition. Ce thème couvre la rédaction d’une consigne avec un objectif, des
  limites et des critères d’achèvement, la fourniture du contexte dont la tâche a besoin, le choix
  de la distance que l’agent peut parcourir avant de faire le point, et la vérification du
  résultat au regard de la consigne.
concepts:
  - id: task-brief
    name: Consigne de la tâche
    definition: >-
      Le court texte écrit que vous remettez à un agent : l’objectif, le contexte dont il a besoin,
      les limites qu’il doit respecter et les critères qui rendent le travail terminé. Tout ce qu’une
      consigne (brief) omet, l’agent le remplit avec une valeur par défaut plausible, donc ce qu’il ne
      doit pas toucher compte autant que ce qu’il doit faire. Écrire d’abord les critères d’achèvement
      (done-criteria) transforme la relecture en vérification.
  - id: giving-context
    name: Donner du contexte
    definition: >-
      Fournir à l’agent les informations et les éléments dont dépend la tâche : les fichiers
      pertinents, la source approuvée des chiffres, la contrainte que vous connaissez et qu’il ignore,
      l’exemple de ce à quoi ressemble un bon résultat. Un agent qui doit deviner ses sources prend la
      plus accessible, rarement la bonne. Désignez les choses par leur nom et leur emplacement plutôt
      que par une description.
  - id: choosing-a-degree-of-autonomy
    name: Choisir un degré d’autonomie
    definition: >-
      Décider, tâche par tâche, ce que l’agent peut faire avant que vous regardiez : seulement
      rédiger, agir mais demander avant tout ce qui est irréversible, ou aller jusqu’au bout. Le choix
      découle du coût d’une erreur et de la facilité à la réparer, quelle que soit la compétence
      apparente de l’agent. Commencez avec moins d’autonomie sur un nouveau type de tâche et
      élargissez-la à mesure que les résultats gagnent votre confiance.
  - id: checking-results
    name: Vérifier les résultats
    definition: >-
      Relire ce que l’agent a livré au regard des critères d’achèvement de la consigne, plutôt que
      d’une impression générale. Lisez les modifications elles-mêmes, et pas le résumé qu’en fait
      l’agent ; exécutez ce qui peut l’être ; cherchez le travail fait hors des limites que vous avez
      fixées. Un résultat plausible s’accepte facilement et se révèle souvent subtilement faux, donc
      la consigne sert d’étalon, et tout écart va dans la consigne suivante.
